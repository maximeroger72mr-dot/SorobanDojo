# Construit les versions à télécharger à chaque envoi sur main :
#  - Soroban-x.y.z-Windows.exe : version portable (un seul fichier, aucune installation)
#  - Soroban.html              : version navigateur en un seul fichier
# et les publie sur la page « Releases » du dépôt, sous le nom « Dernière version ».
# Chaque fichier est publié dès qu'il est prêt (le .exe n'attend pas le Mac).
name: Versions à télécharger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]  # Mac retiré : seule la version Windows est utile
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Windows (portable)
        if: runner.os == 'Windows'
        run: npx electron-builder --win portable --publish never
      - name: Mac (dmg universel, signature ad hoc)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # Chaque système publie son fichier dès qu'il est prêt, sans attendre l'autre
      # (les machines Mac de GitHub sont parfois longues à se libérer).
      - name: Publier dans « Dernière version »
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=exe; NOM=Windows; else EXT=dmg; NOM=Mac; fi
          bash .github/release.sh
          for a in $(gh release view derniere-version --json assets -q '.assets[].name' | grep -- "-${NOM}\.${EXT}$" || true); do
            gh release delete-asset derniere-version "$a" --yes || true
          done
          gh release upload derniere-version dist/*.${EXT} --clobber

  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run html
      - name: Publier Soroban.html
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash .github/release.sh
          gh release upload derniere-version Soroban.html --clobber
