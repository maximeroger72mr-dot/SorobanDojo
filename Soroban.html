",titre:"Le\xE7on 0 : tenue, lecture et vitesse",type:"theorie",repetitions:0,pourquoi:"Quelques r\xE9glages qui changent tout, \xE0 lire une fois puis \xE0 garder en t\xEAte.",sections:[["Le soroban","Pos\xE9 \xE0 plat, la barre horizontale devant vous, les boules c\xE9lestes en haut. Choisissez une tige marqu\xE9e d'un point, vers la droite, comme tige des unit\xE9s : tous les nombres s'alignent dessus. \xC0 l'\xE9cran, l'application montre moins de tiges que votre soroban (13, 17, 23 ou 27 selon les mod\xE8les) et place les unit\xE9s sur la tige la plus \xE0 droite : sur le v\xF4tre, gardez votre tige des unit\xE9s et alignez-vous dessus."],["La main gauche","Elle tient le bord gauche du soroban pour qu'il ne glisse pas, sans cacher les tiges. En multiplication et en division, son index sert de rep\xE8re : il marque la tige o\xF9 l'on travaille, pour ne jamais perdre sa place."],["La main droite et le crayon","Seuls le pouce et l'index bougent les boules : le pouce MONTE les terrestres ; l'index les DESCEND et man\u0153uvre la c\xE9leste dans les deux sens. Le crayon reste dans la main droite, serr\xE9 entre la paume et l'annulaire (ou l'auriculaire), pointe vers l'ext\xE9rieur : on \xE9crit le r\xE9sultat sans le reprendre et sans l\xE2cher le soroban."],["Gaucher ?","Inversez simplement les mains : la main gauche manipule (pouce et index, m\xEAmes r\xF4les), la main droite tient le bord droit et sert de rep\xE8re. Les r\xE8gles de calcul ne changent pas : on lit et on pose toujours les nombres de gauche \xE0 droite. Beaucoup de gauchers gardent toutefois la main droite pour les boules, comme on l'enseigne au Japon : essayez les deux une semaine, puis gardez la plus naturelle."],["Lire une colonne : nombre par nombre","Pour 300 + 156 + 228, on pose 300, puis on AJOUTE 156 en entier (1 aux centaines, 5 aux dizaines, 6 aux unit\xE9s, de gauche \xE0 droite), puis 228 de la m\xEAme fa\xE7on. On ne fait PAS colonne par colonne comme sur papier : le total est sur le soroban, il suffit d'ajouter chaque nombre tel qu'on le lit."],["Pourquoi de gauche \xE0 droite","On lit un nombre de gauche \xE0 droite : on le pose dans le m\xEAme ordre, sans rien retenir de t\xEAte. Les retenues tombent sur des tiges d\xE9j\xE0 trait\xE9es, elles s'ajoutent simplement."],["Remise \xE0 z\xE9ro","Inclinez le soroban vers vous (les terrestres tombent), reposez-le \xE0 plat, puis faites glisser l'index de gauche \xE0 droite le long de la barre pour \xE9carter les c\xE9lestes. Deux secondes."]],pourquoiCaMarche:[["La m\xE9moire de travail est petite","De t\xEAte, on ne garde qu'un petit nombre d'\xE9l\xE9ments \xE0 la fois (environ 4 selon les \xE9tudes de psychologie cognitive, avec de grandes diff\xE9rences entre personnes). Sur papier, retenues et chiffres interm\xE9diaires l'encombrent vite. Le soroban la d\xE9charge : le total est pos\xE9 sur les boules, la t\xEAte n'a rien \xE0 retenir \xE0 part le nombre qu'on lit."],["Pourquoi 5 et 4 boules","L'\u0153il reconna\xEEt d'un coup, sans compter, jusqu'\xE0 3 ou 4 objets (c'est la \xAB subitisation \xBB, bien \xE9tudi\xE9e en psychologie). Une tige se lit donc en un regard : la c\xE9leste (5 ou rien) plus un petit groupe de terrestres. C'est aussi pour cela qu'on lit les grands nombres par tranches de 3 chiffres."],["Du geste au r\xE9flexe","Au d\xE9but, chaque ami demande une r\xE9flexion (\xAB 4 = 5 \u2212 1 \xBB). Avec la r\xE9p\xE9tition, le cerveau transforme cette r\xE8gle en geste automatique, qui ne co\xFBte plus d'attention. D'o\xF9 les volumes d'entra\xEEnement, et la vitesse qui vient d'elle-m\xEAme : on ne peut pas aller vite tant qu'on r\xE9fl\xE9chit."],["Pourquoi les r\xE9visions espac\xE9es","Revoir une le\xE7on juste avant de l'oublier (apr\xE8s 1, 3, 7, 14, 30 jours) la fixe bien mieux que de la r\xE9p\xE9ter le m\xEAme jour. C'est le r\xF4le des r\xE9visions du jour."],["Pourquoi m\xE9langer ensuite","R\xE9p\xE9ter un geste en bloc l'installe vite ; le m\xE9langer ensuite avec les autres oblige \xE0 le CHOISIR, comme dans un vrai calcul. C'est ce qui le rend durable : d'o\xF9 les s\xE9ances de consolidation apr\xE8s chaque le\xE7on."],["Et la t\xEAte dans tout \xE7a ?","\xC0 force de manipuler, l'image du soroban s'installe dans la t\xEAte : c'est l'anzan. Le calcul mental des bons joueurs n'est pas un don, c'est ce soroban imaginaire, construit geste apr\xE8s geste."]],quiz:[{q:"Quel doigt fait MONTER les boules terrestres ?",choix:["Le pouce","L'index","Le majeur"],bonne:0,pourquoi:"Le pouce monte les terrestres ; l'index les descend et man\u0153uvre la c\xE9leste (\xAB La main droite et le crayon \xBB)."},{q:"Et l'index, que fait-il ?",choix:["Il descend les terrestres et man\u0153uvre la c\xE9leste","Il monte les terrestres","Il ne sert qu'\xE0 tenir le crayon"],bonne:0,pourquoi:"L'index DESCEND les terrestres et bouge la c\xE9leste dans les deux sens."},{q:"Quelle tige prendre comme tige des unit\xE9s ?",choix:["Une tige marqu\xE9e d'un point, vers la droite","La tige la plus \xE0 gauche","N'importe laquelle, elle change \xE0 chaque calcul"],bonne:0,pourquoi:"Une tige marqu\xE9e d'un point, vers la droite, toujours la m\xEAme : tous les nombres s'alignent dessus (\xAB Le soroban \xBB)."},{q:"Pour 300 + 156, comment pose-t-on 156 ?",choix:["En entier, de gauche \xE0 droite : 1, puis 5, puis 6","Colonne par colonne, en partant des unit\xE9s, comme sur papier","On calcule le total de t\xEAte, puis on le pose"],bonne:0,pourquoi:"Nombre par nombre, de gauche \xE0 droite : le total est sur le soroban, la t\xEAte n'a rien \xE0 retenir (\xAB Lire une colonne \xBB)."},{q:"\xC0 quoi sert la main gauche ?",choix:["Elle tient le bord du soroban et sert de rep\xE8re","Elle bouge les boules c\xE9lestes","Elle tient le crayon"],bonne:0,pourquoi:"Elle tient le soroban sans cacher les tiges, et son index marque la tige de travail en multiplication et en division."},{q:"Comment remettre le soroban \xE0 z\xE9ro ?",choix:["L'incliner vers soi, le reposer, puis glisser l'index le long de la barre","Le secouer","Repousser chaque boule une \xE0 une"],bonne:0,pourquoi:"Inclinez-le (les terrestres tombent), reposez-le, puis \xE9cartez les c\xE9lestes d'un gliss\xE9 de l'index : deux secondes."}],demos:[]},{id:"p0-2",titre:"Lire et poser un nombre",type:"lire",repetitions:30,sansRevision:!0,pourquoi:"C'est la base de tout : une erreur de lecture (c\xE9leste prise pour une terrestre, mauvaise tige des unit\xE9s) ressemble \xE0 une erreur de geste, et l'on retravaille alors ce qui n'est pas en cause.",regles:["Chaque tige porte un chiffre. De droite \xE0 gauche : unit\xE9s, dizaines, centaines\u2026","Seules les boules qui touchent la barre du milieu comptent.","La boule du haut (c\xE9leste) vaut 5 ; chacune des 4 boules du bas (terrestres) vaut 1.","Une tige sans boule contre la barre vaut 0.","Les nombres s'alignent sur la tige des unit\xE9s (marqu\xE9e d'un point) : on les pose de gauche \xE0 droite."],demos:[]}]},{id:"p1",titre:"Gestes directs",sousPaliers:[{id:"p1-1",titre:"Ajouter 1 \xE0 4",cibles:dt("+",[1,2,3,4],"direct"),chiffres:1,lignes:3,ops:["+"],repetitions:20,cumul:!0,pourquoi:"Ajouter, c'est faire monter des boules terrestres contre la barre, avec le POUCE, plac\xE9 sous les boules : un seul mouvement vers le haut. Condition : les boules n\xE9cessaires doivent \xEAtre libres (en bas).",demos:[{depart:0,op:"+",n:3},{depart:1,op:"+",n:3}]},{id:"p1-2",titre:"Retirer 1 \xE0 4",cibles:dt("-",[1,2,3,4],"direct"),chiffres:1,lignes:4,repetitions:20,cumul:!0,pourquoi:"Retirer, c'est \xE9loigner des boules terrestres de la barre avec l'INDEX, qui les pousse vers le bas. Pouce pour monter, index pour descendre : les deux doigts ne se g\xEAnent jamais.",demos:[{depart:4,op:"-",n:3},{depart:3,op:"-",n:2}]},{id:"p1-3",titre:"Le 5 et la pinc\xE9e (6 \xE0 9)",cibles:[...dt("+",[5,6,7,8,9],"direct"),...dt("-",[5,6,7,8,9],"direct")],chiffres:1,lignes:4,repetitions:20,cumul:!0,pourquoi:"La boule c\xE9leste vaut 5 et c'est toujours l'INDEX qui la man\u0153uvre. Pour 6 \xE0 9 (5 + 1 \u2026 5 + 4), on fait UN seul geste : l'index abaisse la c\xE9leste pendant que le pouce monte les terrestres, comme une pince. Pour retirer 6 \xE0 9, c'est l'index seul, en UN SEUL mouvement : il rel\xE8ve la c\xE9leste et descend les terrestres dans la m\xEAme trajectoire, sans s'arr\xEAter entre les deux.",demos:[{depart:2,op:"+",n:5},{depart:0,op:"+",n:7},{depart:9,op:"-",n:6}]},{id:"p1-4",titre:"Gestes directs \xE0 2 et 3 chiffres",cibles:Do,chiffres:2,lignes:4,repetitions:20,cumul:!0,pourquoi:"On calcule NOMBRE PAR NOMBRE et de GAUCHE \xC0 DROITE : pour 12 + 35, on pose 12, puis on ajoute 35 en entier, d'abord le 3 sur les dizaines, puis le 5 sur les unit\xE9s, dans l'ordre de lecture. Jamais colonne par colonne comme sur papier : le total courant est sur le soroban. Chaque tige se traite ind\xE9pendamment.",demos:[{depart:12,op:"+",n:35},{depart:87,op:"-",n:32}]}]},{id:"p2",titre:"Petits amis (compl\xE9ments \xE0 5)",sousPaliers:[{id:"p2-0",titre:"Les paires qui font 5",type:"complement",cible:5,repetitions:20,testNombre:20,testMin:19,testSecondes:60,sansRevision:!0,pourquoi:"Les petits amis reposent sur les paires qui font 5 : 1 et 4, 2 et 3. Au moment du geste, le compl\xE9ment doit venir tout seul, sinon la main s'arr\xEAte et l'on finit par calculer de t\xEAte.",demos:[]},{id:"p2-1",titre:"+4 et +3",cibles:dt("+",[4,3],"petit"),chiffres:1,lignes:5,repetitions:50,pourquoi:"Sur 3, ajouter 4 : il ne reste qu'une terrestre libre. Astuce : 4 = 5 \u2212 1. L'index abaisse la c\xE9leste (+5), puis descend 1 terrestre (\u22121). 1 et 4 sont \xAB petits amis \xBB (leur somme fait 5), de m\xEAme 2 et 3.",demos:[{depart:3,op:"+",n:4},{depart:2,op:"+",n:3}]},{id:"p2-2",titre:"+2 et +1",cibles:dt("+",[2,1],"petit"),chiffres:1,lignes:5,repetitions:50,pourquoi:"2 = 5 \u2212 3 et 1 = 5 \u2212 4. Sur 4, ajouter 1 : l'index abaisse la c\xE9leste et descend les 4 terrestres.",demos:[{depart:4,op:"+",n:1},{depart:3,op:"+",n:2}]},{id:"p2-3",titre:"Petits amis en addition, 2 et 3 chiffres",cibles:dt("+",[1,2,3,4],"petit"),chiffres:2,lignes:5,repetitions:50,pourquoi:"Le petit ami peut tomber sur n'importe quelle tige. Toujours de gauche \xE0 droite : chaque tige choisit son geste, direct ou petit ami.",demos:[{depart:34,op:"+",n:43}]},{id:"p2-4",titre:"\u22124 et \u22123",cibles:dt("-",[4,3],"petit"),chiffres:1,lignes:5,repetitions:50,pourquoi:"Sur 5, retirer 4 : aucune terrestre n'est contre la barre. \u22124 = +1 \u2212 5 : le pouce monte 1 terrestre, puis l'index rel\xE8ve la c\xE9leste. On ajoute d'abord le petit ami, puis on enl\xE8ve le 5.",demos:[{depart:5,op:"-",n:4},{depart:6,op:"-",n:3}]},{id:"p2-5",titre:"\u22122 et \u22121",cibles:dt("-",[2,1],"petit"),chiffres:1,lignes:5,repetitions:50,pourquoi:"\u22122 = +3 \u2212 5 et \u22121 = +4 \u2212 5. Sur 5, retirer 1 : le pouce monte les 4 terrestres, l'index rel\xE8ve la c\xE9leste.",demos:[{depart:5,op:"-",n:1},{depart:6,op:"-",n:2}]},{id:"p2-6",titre:"Petits amis en soustraction, 2 et 3 chiffres",cibles:dt("-",[1,2,3,4],"petit"),chiffres:2,lignes:5,repetitions:50,pourquoi:"M\xEAme geste sur chaque tige concern\xE9e, de gauche \xE0 droite.",demos:[{depart:65,op:"-",n:32}]},{id:"p2-7",titre:"Tous les petits amis, 3 chiffres",cibles:xp,chiffres:3,lignes:5,repetitions:50,pourquoi:"Additions et soustractions m\xE9lang\xE9es : si les boules manquent sur une tige, le petit ami s'impose. Avec la r\xE9p\xE9tition, le geste devient un r\xE9flexe associ\xE9 au chiffre.",demos:[{depart:342,op:"+",n:413}]}]},{id:"p3",titre:"Grands amis en addition (compl\xE9ments \xE0 10)",sousPaliers:[{id:"p3-0",titre:"Les paires qui font 10",type:"complement",cible:10,repetitions:20,testNombre:20,testMin:19,testSecondes:60,sansRevision:!0,pourquoi:"Les grands amis reposent sur les paires qui font 10 : 1 et 9, 2 et 8, 3 et 7, 4 et 6, 5 et 5. Si l'on h\xE9site (\xAB 10 \u2212 7, \xE7a fait\u2026 3 \xBB), la main s'arr\xEAte : automatisez-les avant le geste.",demos:[]},{id:"p3-1",titre:"+9 et +8",cibles:dt("+",[9,8],"grand"),chiffres:1,lignes:5,repetitions:50,pourquoi:"Sur 3, ajouter 9 donnerait 12 : impossible sur une tige. 9 = 10 \u2212 1 : on retire 1 sur les unit\xE9s, puis on ajoute 1 sur les dizaines (la retenue). 9 et 1 sont \xAB grands amis \xBB (leur somme fait 10). Ordre standard : d'abord le compl\xE9ment, ensuite la retenue.",demos:[{depart:3,op:"+",n:9},{depart:4,op:"+",n:8}]},{id:"p3-2",titre:"+7 et +6",cibles:dt("+",[7,6],"grand"),chiffres:1,lignes:5,repetitions:50,pourquoi:"7 = 10 \u2212 3 et 6 = 10 \u2212 4. Sur 8, ajouter 7 : l'index descend 3 terrestres, puis le pouce monte 1 terrestre sur les dizaines.",demos:[{depart:8,op:"+",n:7},{depart:4,op:"+",n:6}]},{id:"p3-3",titre:"+5 \xE0 +1",cibles:dt("+",[5,4,3,2,1],"grand"),chiffres:1,lignes:5,repetitions:50,pourquoi:"5 = 10 \u2212 5, 4 = 10 \u2212 6 \u2026 1 = 10 \u2212 9. Le compl\xE9ment \xE0 retirer contient la c\xE9leste : l'index la rel\xE8ve (et descend les terrestres d'un m\xEAme geste), puis la retenue.",demos:[{depart:7,op:"+",n:5},{depart:8,op:"+",n:4},{depart:9,op:"+",n:1}]},{id:"p3-4",titre:"Grands amis en addition, 2 et 3 chiffres",cibles:Al(zi),chiffres:2,lignes:5,repetitions:50,pourquoi:"La retenue tombe sur la tige de gauche, d\xE9j\xE0 calcul\xE9e : c'est pour cela qu'on travaille de gauche \xE0 droite, la retenue s'ajoute simplement.",demos:[{depart:39,op:"+",n:85}]}]},{id:"p4",titre:"Grands amis en soustraction",sousPaliers:[{id:"p4-1",titre:"\u22129 et \u22128",cibles:dt("-",[9,8],"grand"),chiffres:1,lignes:5,repetitions:50,pourquoi:"Sur 12, retirer 9 : les unit\xE9s ne valent que 2. \u22129 = \u221210 + 1 : on retire d'abord 1 sur les dizaines (l'emprunt), puis on ajoute 1 sur les unit\xE9s. En soustraction, l'ordre s'inverse : l'emprunt d'abord, le compl\xE9ment ensuite.",demos:[{depart:12,op:"-",n:9},{depart:11,op:"-",n:8}]},{id:"p4-2",titre:"\u22127 et \u22126",cibles:dt("-",[7,6],"grand"),chiffres:1,lignes:5,repetitions:50,pourquoi:"\u22127 = \u221210 + 3 et \u22126 = \u221210 + 4. Sur 15, retirer 7 : l'index retire 1 dizaine, puis le pouce monte 3 terrestres sur les unit\xE9s.",demos:[{depart:15,op:"-",n:7},{depart:10,op:"-",n:6}]},{id:"p4-3",titre:"\u22125 \xE0 \u22121",cibles:dt("-",[5,4,3,2,1],"grand"),chiffres:1,lignes:5,repetitions:50,pourquoi:"\u22125 = \u221210 + 5 \u2026 \u22121 = \u221210 + 9. On emprunte 1 dizaine, puis on ajoute le grand compl\xE9ment (c\xE9leste, ou pinc\xE9e c\xE9leste + terrestres).",demos:[{depart:13,op:"-",n:5},{depart:10,op:"-",n:1}]},{id:"p4-4",titre:"Grands amis en soustraction, 2 et 3 chiffres",cibles:Cl(zi),chiffres:2,lignes:5,repetitions:50,pourquoi:"L'emprunt se prend sur la tige de gauche, d\xE9j\xE0 calcul\xE9e. Toujours de gauche \xE0 droite.",demos:[{depart:95,op:"-",n:17}]},{id:"p4-5",titre:"Tous les grands amis, 3 chiffres",cibles:zi,chiffres:3,lignes:5,repetitions:50,pourquoi:"Rep\xE9rez le passage de la dizaine avant de bouger : si la tige ne peut pas absorber le chiffre, c'est le grand ami. Compl\xE9ment d'abord en addition, emprunt d'abord en soustraction.",demos:[{depart:876,op:"+",n:285},{depart:952,op:"-",n:663}]}]},{id:"p5",titre:"Combinaisons et r\xE9vision g\xE9n\xE9rale",sousPaliers:[{id:"p5-1",titre:"+6 \xE0 +9 combin\xE9s (grand ami + petit ami)",cibles:Al(kl),chiffres:1,lignes:5,repetitions:50,pourquoi:"Sur 5, ajouter 6 : grand ami, il faut retirer 4\u2026 mais aucune terrestre n'est pos\xE9e. Le \u22124 se fait par le petit ami (+1 \u22125). Geste complet : pouce +1, index rel\xE8ve la c\xE9leste, puis pouce +1 sur les dizaines.",demos:[{depart:5,op:"+",n:6},{depart:6,op:"+",n:8}]},{id:"p5-2",titre:"\u22126 \xE0 \u22129 combin\xE9s",cibles:Cl(kl),chiffres:1,lignes:5,repetitions:50,pourquoi:"Sur 13, retirer 8 : on emprunte 1 dizaine, puis il faut ajouter 2 sur un 3 : pas assez de terrestres, petit ami +5 \u22123. Geste : index \u22121 sur les dizaines, index abaisse la c\xE9leste, index descend 3 terrestres.",demos:[{depart:13,op:"-",n:8},{depart:12,op:"-",n:6}]},{id:"p5-3",titre:"Combinaisons, 2 et 3 chiffres",cibles:kl,chiffres:2,lignes:5,repetitions:50,pourquoi:"Les combinaisons arrivent sur n'importe quelle tige. D\xE9composez calmement : grand ami d'abord, et son compl\xE9ment par le petit ami.",demos:[{depart:56,op:"+",n:67}]},{id:"p5-4",titre:"Retenues et emprunts en cascade",cibles:["cascade+","cascade-"],chiffres:2,lignes:4,repetitions:30,cumul:!0,pourquoi:"Une retenue qui tombe sur un 9 : ce 9 devient 0 (grand ami, \u22129) et la retenue continue plus \xE0 gauche. Un emprunt sur un 0 le transforme en 9 et continue. C'est la m\xEAme r\xE8gle, r\xE9p\xE9t\xE9e.",demos:[{depart:99,op:"+",n:1},{depart:100,op:"-",n:1},{depart:95,op:"+",n:17}]},{id:"p5-5",titre:"R\xE9vision g\xE9n\xE9rale, 3 chiffres",cibles:qe,chiffres:3,lignes:5,repetitions:50,cumul:!0,testNombre:20,testMin:17,pourquoi:"Tous les gestes sont permis : chaque tige choisit le sien. C'est le calcul courant.",demos:[{depart:478,op:"+",n:685}]},{id:"p5-e7",titre:"Endurance : 7 lignes de 1 \xE0 2 chiffres",cibles:qe,chiffres:1,chiffresMax:2,lignes:7,repetitions:20,cumul:!0,pourquoi:"Jusqu'ici, vos colonnes avaient 5 lignes, le format des 10e et 9e ky\u016B ; au 8e ky\u016B, elles en ont 8, au 7e, 10. On allonge par marches : 7 lignes d'abord. Rien de nouveau dans les gestes : c'est l'attention qui apprend \xE0 tenir un peu plus longtemps.",demos:[]},{id:"p5-e8",titre:"Endurance : 8 lignes de 1 \xE0 2 chiffres",cibles:qe,chiffres:1,chiffresMax:2,lignes:8,repetitions:20,cumul:!0,pourquoi:"Une ligne de plus. Gardez le m\xEAme rythme de la premi\xE8re \xE0 la derni\xE8re ligne : c'est le signe que l'endurance s'installe. C'est le format du 8e ky\u016B ; la marche suivante, 10 lignes, est celui du 7e.",demos:[]},{id:"p5-e",titre:"Endurance : 10 lignes de 1 \xE0 2 chiffres",cibles:qe,chiffres:1,chiffresMax:2,lignes:10,repetitions:30,cumul:!0,pourquoi:"\xC0 partir du 7e ky\u016B, une colonne d'examen a 10 lignes (5 aux 10e et 9e ky\u016B, 8 au 8e). Le geste ne change pas : c'est l'attention qui doit tenir jusqu'au bout. Gardez le m\xEAme rythme de la 1re \xE0 la 10e ligne, et lisez la ligne suivante pendant que la main finit.",demos:[]},{id:"p5-6",titre:"Passer une \xE9preuve : la strat\xE9gie",type:"theorie",repetitions:0,pourquoi:"Une \xE9preuve ne se gagne pas seulement avec de bons gestes : il faut aussi savoir par o\xF9 commencer, quoi laisser, et comment ne pas perdre de points en recopiant. \xC0 lire avant votre premier passage de ky\u016B.",sections:[["Un seul chronom\xE8tre","Le temps est donn\xE9 pour TOUT le sujet (20 minutes du 10e au 7e ky\u016B, 30 minutes ensuite) : les additions et soustractions, les multiplications, les divisions. Vous passez d'une partie \xE0 l'autre quand vous voulez. Il n'y a aucun point n\xE9gatif : une r\xE9ponse fausse vaut z\xE9ro, comme une case vide."],["Viser le seuil, pas la perfection","Il faut 60 % des points du 9e au 7e ky\u016B (30 % au 10e), 70 % du 6e au 4e, 80 % \xE0 partir du 3e. Vous pouvez donc laisser des probl\xE8mes. Mieux vaut 8 colonnes justes que 10 colonnes b\xE2cl\xE9es : chaque colonne vaut autant, et une colonne fausse a co\xFBt\xE9 le m\xEAme temps qu'une juste."],["Par o\xF9 commencer","Commencez par la partie o\xF9 vous \xEAtes le plus s\xFBr : elle rapporte vite et met la main en route. Gardez pour la fin celle qui vous co\xFBte le plus. Fixez-vous une heure de bascule (par exemple : \xE0 mi-temps, je quitte les colonnes), et tenez-la."],["Sauter sans regret","Vous perdez votre place, une ligne vous \xE9chappe, le soroban vous para\xEEt faux : n'essayez pas de \xAB rattraper \xBB. Remettez \xE0 z\xE9ro et recommencez la colonne une fois ; si cela se reproduit, passez \xE0 la suivante. S'acharner sur un probl\xE8me en co\xFBte deux."],["La remise \xE0 z\xE9ro compte","Entre deux probl\xE8mes : incliner, reposer, glisser l'index. Deux secondes, toujours le m\xEAme geste. Une boule oubli\xE9e de la colonne pr\xE9c\xE9dente fausse la suivante, et c'est l'erreur la plus b\xEAte de l'\xE9preuve."],["Recopier sans se tromper","Lisez le r\xE9sultat sur le soroban de gauche \xE0 droite, par tranches de 3 chiffres, et \xE9crivez-le dans le m\xEAme mouvement, crayon d\xE9j\xE0 en main. V\xE9rifiez seulement le nombre de chiffres : un chiffre en trop ou en moins se voit d'un coup d'\u0153il."],["L'allure","L'\xE9cran des \xE9preuves indique, pour chaque grade, la cadence \xE0 tenir et la v\xF4tre. Pendant une \xE9preuve d'entra\xEEnement, vous pouvez afficher votre avance ou votre retard. Le jour o\xF9 vous voulez vous tester pour de bon, cochez \xAB Examen pur \xBB : le sujet, le temps, et rien d'autre."],["S'il reste du temps","Refaites d'abord les probl\xE8mes saut\xE9s. Ensuite seulement, v\xE9rifiez ceux dont vous doutiez en les recalculant enti\xE8rement : relire un r\xE9sultat ne d\xE9tecte rien."]],quiz:[{q:"Une r\xE9ponse fausse \xE0 l'examen, c'est :",choix:["Z\xE9ro point, comme une case vide","Des points retir\xE9s","L'\xE9limination"],bonne:0,pourquoi:"Aucun point n\xE9gatif : fausse ou vide, la case vaut z\xE9ro. On peut donc tenter, mais pas b\xE2cler."},{q:"Vous perdez votre place au milieu d'une colonne. Que faire ?",choix:["Remettre \xE0 z\xE9ro et la recommencer une fois, sinon passer","Essayer de retrouver o\xF9 vous en \xE9tiez","Deviner la fin"],bonne:0,pourquoi:"On ne \xAB rattrape \xBB pas une colonne : on la refait une fois, ou on passe \xE0 la suivante (\xAB Sauter sans regret \xBB)."},{q:"Par quelle partie commencer ?",choix:["Celle o\xF9 vous \xEAtes le plus s\xFBr","Toujours la plus difficile","Peu importe"],bonne:0,pourquoi:"La partie la plus s\xFBre rapporte vite et met la main en route ; la plus co\xFBteuse se garde pour la fin."},{q:"Il vous reste deux minutes et tout est rempli. Que faire ?",choix:["Recalculer enti\xE8rement un probl\xE8me dont vous doutiez","Relire les r\xE9sultats \xE9crits","Poser le crayon"],bonne:0,pourquoi:"Relire un r\xE9sultat ne d\xE9tecte rien : seule une colonne recalcul\xE9e confirme ou corrige."}],demos:[]}]},{id:"p6",titre:"Multiplication (\u4E21\u843D\u3068\u3057)",sousPaliers:[{id:"p6-a",titre:"1 \xD7 1 : un produit, deux tiges (\xAB 06 \xBB)",type:"table",repetitions:40,pourquoi:"En multiplication japonaise, chaque produit de la table occupe TOUJOURS deux tiges : la dizaine et l'unit\xE9. 7 \xD7 8 = \xAB 56 \xBB, mais 2 \xD7 3 = \xAB 06 \xBB : la tige des dizaines reste vide, et c'est elle qui garde le d\xE9calage juste pour la suite. Ici, tapez chaque produit sur deux chiffres (06, 00, 56) : c'est la convention \xE0 ancrer, et en m\xEAme temps un entra\xEEnement de vitesse sur la table.",demos:[{a:2,b:3},{a:7,b:8}]},{id:"p6-0",titre:"O\xF9 poser le premier produit ?",type:"placement",op:"mul",repetitions:40,pourquoi:"Avant de multiplier, il faut savoir O\xD9 commencer, sans r\xE9fl\xE9chir. R\xE8gle : comptez les chiffres des deux nombres (37 \xD7 85 : 2 + 2 = 4). La dizaine du premier produit se pose sur la 4e tige en comptant la tige des unit\xE9s comme la 1re. Cliquez la bonne tige le plus vite possible : ce r\xE9flexe doit devenir automatique, c'est lui qui \xE9vite les r\xE9sultats d\xE9cal\xE9s. L'index gauche se pose ensuite sur cette tige et la marque pendant tout le calcul.",demos:[]},{id:"p6-1a",titre:"2 \xD7 1 : deux produits, sans retenue",type:"mul",m:2,n:1,marche:"mul-direct",marcheDe:"p6-1",repetitions:50,pourquoi:"On ne pose ni le multiplicande ni le multiplicateur : on les lit sur la feuille, et l'on ne pose que les produits de la table, chacun sur DEUX tiges. Pour 46 \xD7 3 : 4 \xD7 3 = 12 d'abord, puis 6 \xD7 3 = 18 une tige plus \xE0 droite. Dans cette premi\xE8re marche, les deux produits ont deux chiffres et s'ajoutent sans aucune retenue : toute votre attention va \xE0 la place des produits. On avancera par petites marches, une difficult\xE9 \xE0 la fois.",demos:[{a:46,b:3}]},{id:"p6-1b",titre:"2 \xD7 1 : deux produits, avec retenue",type:"mul",m:2,n:1,marche:"mul-retenue",marcheDe:"p6-1",repetitions:50,pourquoi:"M\xEAme placement, mais le second produit fait maintenant une retenue en s'ajoutant au premier. Pour 67 \xD7 8 : 48, puis 56 une tige \xE0 droite ; le 5 s'ajoute au 8 et la retenue remonte sur la tige de gauche. C'est un grand ami ordinaire : le geste est connu, il se fait simplement au milieu d'une multiplication.",demos:[{a:67,b:8}]},{id:"p6-1c",titre:"2 \xD7 1 : un produit \xE0 un seul chiffre (\xAB 06 \xBB)",type:"mul",m:2,n:1,marche:"mul-court",marcheDe:"p6-1",repetitions:50,pourquoi:"Quand un produit n'a qu'un chiffre (2 \xD7 4 = 8), il occupe quand m\xEAme deux tiges : \xAB 08 \xBB. Sa tige des dizaines reste vide, et le chiffre se pose sur la suivante. C'est l'erreur de placement la plus fr\xE9quente : on pose le 8 une tige trop \xE0 gauche. Pour 72 \xD7 4 : 28, puis \xAB 08 \xBB : le 8 tombe sur la tige des unit\xE9s.",demos:[{a:72,b:4},{a:23,b:3}]},{id:"p6-1d",titre:"2 \xD7 1 : un produit qui finit par 0",type:"mul",m:2,n:1,marche:"mul-zero",marcheDe:"p6-1",repetitions:50,pourquoi:"Un produit comme 5 \xD7 6 = 30 ne pose rien sur sa seconde tige. Il faut pourtant la compter : la main passe dessus sans rien toucher. Pour 45 \xD7 6 : 24, puis 30 une tige \xE0 droite ; le 3 s'ajoute au 4, et les unit\xE9s restent \xE0 0. R\xE9sultat 270.",demos:[{a:45,b:6}]},{id:"p6-1",titre:"2 chiffres \xD7 1 chiffre",type:"mul",m:2,n:1,repetitions:50,pourquoi:"M\xE9thode japonaise actuelle, \u4E21\u843D\u3068\u3057 (\xAB les deux tombent \xBB) : on ne pose ni le multiplicande ni le multiplicateur, on les lit sur la feuille. On ne pose que les produits de la table, chacun sur DEUX tiges (dizaine, unit\xE9 ; 2 \xD7 3 s'\xE9crit \xAB 06 \xBB). On commence \xE0 gauche. Position du premier produit : 2 + 1 = 3 chiffres au total, donc sa dizaine va sur la 3e tige en partant des unit\xE9s. Chaque produit suivant se d\xE9cale d'une tige vers la droite.",demos:[{a:37,b:8},{a:23,b:3}]},{id:"p6-2",titre:"3 et 4 chiffres \xD7 1 chiffre",type:"mul",m:3,n:1,repetitions:50,pourquoi:"M\xEAme principe : 3 + 1 = 4 chiffres, donc premier produit sur la 4e tige (sa dizaine). Exemple 372 \xD7 8 : 24, puis 56 une tige plus \xE0 droite, puis 16.",demos:[{a:372,b:8}]},{id:"p6-3a",titre:"2 \xD7 2 : quatre produits, sans retenue",type:"mul",m:2,n:2,marche:"mul22-direct",marcheDe:"p6-3",repetitions:30,pourquoi:"Quatre produits au lieu de deux. Pour 24 \xD7 12 : on prend le 2 et on le multiplie par 1 puis par 2 (02, puis 04 une tige \xE0 droite) ; on passe au 4, qui commence une tige plus \xE0 droite que le 2 : 4 \xD7 1 = 04, puis 4 \xD7 2 = 08. Dans cette marche, aucun produit ne fait de retenue : toute votre attention va \xE0 l'ordre des produits et \xE0 leur place. Dites les produits \xE0 voix basse en les posant.",demos:[{a:24,b:12},{a:43,b:51}]},{id:"p6-3b",titre:"2 \xD7 2 : avec des retenues",type:"mul",m:2,n:2,marche:"mul22-retenue",marcheDe:"p6-3",repetitions:30,pourquoi:"M\xEAme ordre, m\xEAmes places, mais les produits font maintenant des retenues en s'ajoutant. Elles restent \xE0 l'int\xE9rieur des deux tiges du produit : la main ne sort pas de sa zone. Pour 93 \xD7 31 : 27, puis 09 ; puis 09 qui s'ajoute au 9 d\xE9j\xE0 pos\xE9 (grand ami), puis 03.",demos:[{a:93,b:31}]},{id:"p6-3c",titre:"2 \xD7 2 : la retenue qui d\xE9borde \xE0 gauche",type:"mul",m:2,n:2,marche:"mul22-deborde",marcheDe:"p6-3",repetitions:30,pourquoi:"Le cas qui fait perdre sa place : en s'ajoutant, un produit fait monter une retenue sur une TROISI\xC8ME tige, \xE0 gauche de ses deux tiges. L'index gauche ne doit pas la suivre : il reste sur la tige du produit en cours. Dans l'exemple anim\xE9, regardez le produit signal\xE9 \xAB d\xE9borde \xBB : la retenue part \xE0 gauche, puis on reprend exactement o\xF9 l'on \xE9tait.",demos:[{a:37,b:65},{a:69,b:31}]},{id:"p6-3",titre:"2 chiffres \xD7 2 chiffres",type:"mul",m:2,n:2,repetitions:50,pourquoi:"Pour 37 \xD7 85 : 4 chiffres au total. On prend le 3 et on le multiplie par 8 puis par 5 (24, puis 15 une tige \xE0 droite) ; on passe au 7 : 7 \xD7 8 = 56 se pose l\xE0 o\xF9 commen\xE7ait le 15 (une tige \xE0 droite du 24), puis 7 \xD7 5 = 35. Regardez bien le 56 dans l'exemple anim\xE9 : en s'ajoutant, il fait D\xC9BORDER une retenue sur la tige de gauche. C'est le moment o\xF9 l'on perd sa place : l'index gauche ne suit pas la retenue, il reste sur sa tige. Plus d'une multiplication sur deux en contient une.",demos:[{a:37,b:85},{a:68,b:79}]},{id:"p6-4",titre:"3 chiffres \xD7 2 chiffres",type:"mul",m:3,n:2,repetitions:50,pourquoi:"5 chiffres au total : premier produit sur la 5e tige. Chaque chiffre du multiplicande commence une tige plus \xE0 droite que le pr\xE9c\xE9dent.",demos:[{a:246,b:37}]}]},{id:"p7",titre:"Division (\u7247\u843D\u3068\u3057)",sousPaliers:[{id:"p7-0",titre:"O\xF9 poser le premier chiffre du quotient ?",type:"placement",op:"div",repetitions:40,pourquoi:"Le dividende est pos\xE9 \xE0 droite. On compare son d\xE9but au diviseur : s'il est plus grand ou \xE9gal (156 \xF7 12 : 15 \u2265 12), le premier chiffre du quotient se pose DEUX tiges \xE0 gauche du premier chiffre du dividende ; s'il est plus petit (108 \xF7 12 : 10 < 12), JUSTE \xE0 gauche. Cliquez la bonne tige : ce r\xE9flexe doit \xEAtre imm\xE9diat. L'index gauche se pose ensuite sur cette tige.",demos:[]},{id:"p7-1",titre:"\xF7 1 chiffre, quotient 1 chiffre",type:"div",nd:1,nq:1,repetitions:50,pourquoi:"M\xE9thode \u7247\u843D\u3068\u3057 : on pose seulement le dividende ; le diviseur se lit sur la feuille. On compare le d\xE9but du dividende au diviseur : plus grand ou \xE9gal \u2192 le chiffre du quotient se pose DEUX tiges \xE0 gauche (une tige libre) ; plus petit \u2192 JUSTE \xE0 gauche. Puis on retire le produit (quotient \xD7 diviseur, sur deux tiges) juste \xE0 droite du quotient.",demos:[{a:14,b:2},{a:72,b:8}]},{id:"p7-2a",titre:"Quotient \xE0 2 chiffres : deux petits produits",type:"div",nd:1,nq:2,marche:"div-court",marcheDe:"p7-2",repetitions:30,pourquoi:"On r\xE9p\xE8te le geste de la le\xE7on pr\xE9c\xE9dente pour chaque chiffre du quotient. Pour 84 \xF7 4 : 8 \xF7 4 = 2, on retire 2 \xD7 4 = 8 ; puis 4 \xF7 4 = 1, on retire 4. Dans cette premi\xE8re marche, les produits \xE0 retirer n'ont qu'un chiffre : toute votre attention va \xE0 la place des chiffres du quotient.",demos:[{a:84,b:4}]},{id:"p7-2b",titre:"Quotient \xE0 2 chiffres : produits \xE0 deux chiffres",type:"div",nd:1,nq:2,marche:"div-direct",marcheDe:"p7-2",repetitions:50,pourquoi:"Les produits \xE0 retirer ont maintenant deux chiffres, mais se retirent sans emprunt. Pour 252 \xF7 7 : 25 \xF7 7 = 3, on retire 21, il reste 4 ; puis 42 \xF7 7 = 6, on retire 42. Le reste du premier pas devient le d\xE9but du second : c'est lui qu'il faut lire sur le soroban, pas sur la feuille.",demos:[{a:252,b:7}]},{id:"p7-2c",titre:"Quotient \xE0 2 chiffres : retirer avec un emprunt",type:"div",nd:1,nq:2,marche:"div-emprunt",marcheDe:"p7-2",repetitions:50,pourquoi:"Le produit se retire cette fois avec un emprunt. Pour 216 \xF7 8 : 21 \xF7 8 = 2, on retire 16 de 21 : le 6 ne se retire pas du 1, on emprunte une dizaine (grand ami). Il reste 5, donc 56 \xF7 8 = 7. Le geste est connu : il se fait simplement au milieu d'une division.",demos:[{a:216,b:8}]},{id:"p7-2d",titre:"Quotient \xE0 2 chiffres : dividende finissant par 0",type:"div",nd:1,nq:2,marche:"div-zero",marcheDe:"p7-2",repetitions:50,pourquoi:"Quand le dividende finit par 0, le dernier produit finit par 0 lui aussi (5 \xD7 6 = 30) : on ne retire rien sur la derni\xE8re tige. Pour 150 \xF7 6 : 15 \xF7 6 = 2, on retire 12, il reste 3 ; puis 30 \xF7 6 = 5, on retire 30. Ne cherchez pas un chiffre de plus au quotient : le calcul est fini quand le dividende est vide.",demos:[{a:150,b:6}]},{id:"p7-2",titre:"\xF7 1 chiffre, quotient 2 et 3 chiffres",type:"div",nd:1,nq:2,repetitions:50,pourquoi:"On r\xE9p\xE8te pour chaque chiffre du quotient, avec le reste. L'unit\xE9 du quotient se trouve 2 tiges \xE0 gauche de l'unit\xE9 du dividende (1 chiffre au diviseur + 1).",demos:[{a:156,b:4}]},{id:"p7-ea",titre:"Diviser par 2 chiffres : l'estimation tombe juste",type:"div",nd:2,nq:1,marche:"div21-direct",marcheDe:"p7-e",repetitions:30,pourquoi:"Le diviseur a deux chiffres : on retire donc DEUX produits pour chaque chiffre du quotient. Pour 176 \xF7 44 : on arrondit 44 \xE0 40, 176 \xF7 40 \u2248 4. On retire 4 \xD7 4 = 16, puis 4 \xD7 4 = 16 une tige plus \xE0 droite : le dividende est vide. Dans cette marche, l'estimation est toujours la bonne : vous apprenez seulement le geste des deux produits. Les corrections viennent \xE0 la le\xE7on suivante.",demos:[{a:176,b:44},{a:567,b:63}]},{id:"p7-e",titre:"Diviser par 2 chiffres : estimer et corriger",type:"div",nd:2,nq:1,repetitions:50,corrections:!0,pourquoi:"Personne ne conna\xEEt la table de 18 : on ESTIME. On arrondit le diviseur \xE0 sa dizaine (18 \u2192 20, 43 \u2192 40 ; on arrondit au-dessus d\xE8s que le 2e chiffre vaut 5 ou plus) et on divise le d\xE9but du dividende par ce nombre rond : 144 \xF7 20 \u2248 7. Puis on v\xE9rifie avec les vrais produits : 7 \xD7 1 = 7 et 7 \xD7 8 = 56, donc 7 \xD7 18 = 126, qui tient dans 144. On retire 126 : il reste 18, qui n'est pas plus petit que 18 \u2192 l'estimation \xE9tait trop petite : on ajoute 1 au quotient (8) et on retire encore 18. Si au contraire le produit ne tient pas (arrondi au-dessous : 112 \xF7 14, 14 \u2248 10 donne 11, on plafonne \xE0 9 ; 9 \xD7 14 = 126 > 112), on diminue de 1 de t\xEAte AVANT de poser (de 2 ou 3 si besoin : avec un diviseur de 11 \xE0 19, l'arrondi peut tromper de plusieurs crans). Et si vous avez pos\xE9 un chiffre trop grand sans le voir (le deuxi\xE8me produit ne peut plus \xEAtre retir\xE9), inutile de tout effacer : on retire 1 au quotient, on REND le premier chiffre du diviseur sur la tige o\xF9 il vient d'\xEAtre retir\xE9 en trop, et on continue (voir le 4e exemple anim\xE9). En cas de blocage pendant un exercice, le bouton \xAB Je suis bloqu\xE9 \xBB d\xE9roule ce raisonnement et affiche la table du diviseur.",demos:[{a:144,b:18},{a:112,b:14},{a:156,b:12},{a:168,b:24,rattrapage:!0}]},{id:"p7-3",titre:"\xF7 2 chiffres, quotient 1 chiffre",type:"div",nd:2,nq:1,repetitions:50,pourquoi:"On compare les deux premiers chiffres du dividende au diviseur entier. Le chiffre du quotient s'estime exactement comme \xE0 la le\xE7on pr\xE9c\xE9dente : diviseur arrondi \xE0 sa dizaine (12 \u2192 10, 18 \u2192 20), puis v\xE9rification avec le vrai produit. On retire ensuite quotient \xD7 chaque chiffre du diviseur, en d\xE9calant d'une tige. Si le produit ne peut pas \xEAtre retir\xE9, le chiffre \xE9tait trop grand : on le diminue de 1 ; s'il reste au moins le diviseur, il \xE9tait trop petit : on ajoute 1. On recommence tant qu'il le faut : avec un diviseur de 11 \xE0 19, l'\xE9cart peut \xEAtre de 2 ou 3 crans.",demos:[{a:108,b:12}]},{id:"p7-4a",titre:"\xF7 2 chiffres, quotient 2 chiffres : estimations justes",type:"div",nd:2,nq:2,marche:"div22-direct",marcheDe:"p7-4",repetitions:30,pourquoi:"On encha\xEEne deux fois le geste de la le\xE7on pr\xE9c\xE9dente : un chiffre du quotient, ses deux produits \xE0 retirer, puis le suivant avec ce qui reste. Pour 5 103 \xF7 63 : 510 \xF7 60 \u2248 8, on retire 48 puis 24 ; il reste 63, donc 1. Ici, les deux estimations tombent juste : toute l'attention va au reste, qu'il faut lire sur le soroban avant d'estimer le second chiffre.",demos:[{a:5103,b:63}]},{id:"p7-4b",titre:"\xF7 2 chiffres, quotient 2 chiffres : avec une correction",type:"div",nd:2,nq:2,marche:"div22-corrige",marcheDe:"p7-4",repetitions:30,pourquoi:"Cette fois, une estimation au moins est \xE0 corriger : trop grande (le produit ne se retire pas, on diminue le chiffre de 1) ou trop petite (le reste est encore plus grand que le diviseur, on ajoute 1). Corrigez sans effacer : c'est le geste de \xAB estimer et corriger \xBB, plac\xE9 au milieu d'un calcul plus long.",demos:[{a:2479,b:67}]},{id:"p7-4c",titre:"Diviser par 11 \xE0 19 : l'arrondi trompe de 2 crans",type:"div",nd:2,marche:"div-1x",marcheDe:"p7-4",repetitions:30,nq:2,pourquoi:"Avec un diviseur de 11 \xE0 19, l'arrondi \xE0 la dizaine trompe beaucoup : une fois sur six, l'estimation tombe \xE0 2 ou 3 crans du vrai chiffre (136 \xF7 17 : 17 \u2248 20 donne 6, mais la r\xE9ponse est 8). La bonne m\xE9thode : estimez avec le VRAI diviseur, dont les multiples sont faciles (17, 34, 51, 68, 85, 102, 119, 136, 153). Et si vous arrondissez quand m\xEAme, corrigez autant de fois qu'il faut, sans paniquer : un cran, puis un autre.",demos:[{a:136,b:17},{a:104,b:13}]},{id:"p7-4",titre:"\xF7 2 chiffres, quotient 2 chiffres",type:"div",nd:2,nq:2,repetitions:50,pourquoi:"L'unit\xE9 du quotient est 3 tiges \xE0 gauche de l'unit\xE9 du dividende (2 chiffres au diviseur + 1).",demos:[{a:156,b:12}]}]},{id:"p8",titre:"Vers le 6e, le 5e et le 4e ky\u016B",sousPaliers:[{id:"p8-t1",titre:"3 chiffres, 10 lignes (format du 6e ky\u016B)",cibles:qe,chiffres:3,lignes:10,repetitions:30,cumul:!0,pourquoi:"Le format du 6e ky\u016B : 10 lignes de 3 chiffres, 30 chiffres par colonne. Des nombres que vous connaissez d\xE9j\xE0, mais deux fois plus de lignes qu'en le\xE7on : gardez le m\xEAme rythme d'un bout \xE0 l'autre de la colonne, et lisez la ligne suivante pendant que la main finit.",demos:[{depart:472,op:"+",n:358}]},{id:"p8-t2",titre:"Transition : 4 chiffres, 6 \xE0 7 lignes",cibles:qe,chiffres:4,lignes:6,lignesMax:7,repetitions:30,cumul:!0,pourquoi:"Le 4e chiffre ajoute une tranche : rep\xE9rez les milliers avec le point de la barre, lisez le nombre d'un bloc, posez-le de gauche \xE0 droite.",demos:[{depart:4721,op:"+",n:3586}]},{id:"p8-1",titre:"Additions et soustractions \xE0 4 chiffres, 10 lignes",cibles:qe,chiffres:4,lignes:10,repetitions:30,cumul:!0,pourquoi:"Le format du 5e ky\u016B : 10 lignes de 4 chiffres. La difficult\xE9 n'est plus le geste mais la lecture et le rythme : lisez chaque nombre d'un bloc, posez-le de gauche \xE0 droite, et lisez d\xE9j\xE0 le suivant.",demos:[{depart:4721,op:"+",n:3586}]},{id:"p8-2",titre:"Z\xE9ros internes",cibles:qe,chiffres:4,lignes:8,repetitions:30,cumul:!0,zeros:!0,pourquoi:"Un z\xE9ro au milieu d'un nombre (3 058, 7 040) est le pi\xE8ge n\xB0 1 : on saute une tige de trop ou de moins, et tout le reste est d\xE9cal\xE9. Le z\xE9ro ne se pose pas, mais il se COMPTE : dites-le int\xE9rieurement (\xAB trois, z\xE9ro, cinq, huit \xBB) et faites avancer le doigt d'une tige.",demos:[{depart:3058,op:"+",n:4070}]},{id:"p8-4",titre:"Multiplication avec des z\xE9ros (406 \xD7 7)",type:"mul",m:3,n:1,mMax:4,zeros:!0,repetitions:30,pourquoi:"Avec \u4E21\u843D\u3068\u3057, un z\xE9ro dans un facteur donne un produit \xAB 00 \xBB : on ne pose rien, MAIS on avance d'une tige. Pour 406 \xD7 7 : 4 \xD7 7 = 28, puis 0 \xD7 7 = 00 (rien, on avance), puis 6 \xD7 7 = 42.",demos:[{a:406,b:7},{a:37,b:208}]},{id:"p8-6",titre:"Division : quotient avec un z\xE9ro (304)",type:"div",nd:1,nq:3,ndMax:2,zeros:!0,repetitions:30,pourquoi:"Quand le reste est plus petit que le diviseur, le chiffre du quotient est 0 : la tige reste vide MAIS elle compte, le chiffre suivant se pose une tige plus \xE0 droite. Ne \xAB tassez \xBB jamais le quotient.",demos:[{a:2128,b:7},{a:3672,b:12}]},{id:"p8-5a",titre:"Multiplication \xE0 6 chiffres au total (3 \xD7 3, 4 \xD7 2)",type:"mul",m:3,n:3,formes:[[3,3],[4,2],[2,4]],zerosFinaux:.15,repetitions:30,pourquoi:"Le format du 5e ky\u016B : 6 chiffres au total, d\xE9coup\xE9s de plusieurs fa\xE7ons (246 \xD7 375, 4 827 \xD7 36, 58 \xD7 7 041). M\xEAme m\xE9thode, mais la place du premier produit change avec le d\xE9coupage : comptez les chiffres des DEUX facteurs, c'est ce total qui donne la tige du premier produit. Un facteur peut finir par 0 (4 820 \xD7 36) : son produit \xAB 00 \xBB ne se pose pas, mais on avance d'une tige.",demos:[{a:246,b:375},{a:4827,b:36}]},{id:"p8-7",titre:"Division \xE0 5 chiffres au total (\xF7 3 chiffres, \xF7 2 chiffres et quotient de 3)",type:"div",nd:3,nq:2,formes:[[3,2],[2,3]],zerosFinaux:.15,repetitions:30,corrections:!0,pourquoi:"Le format du 5e ky\u016B : diviseur et quotient font 5 chiffres (5 832 \xF7 243 = 24, ou 8 694 \xF7 23 = 378). M\xEAme estimation qu'avec 2 chiffres : on arrondit le diviseur sur son premier chiffre (243 \u2192 200, 268 \u2192 300), on estime, puis on corrige de \xB11 si besoin. On compare le d\xE9but du dividende au diviseur pour savoir o\xF9 poser le quotient. Un chiffre trop grand peut ne se r\xE9v\xE9ler qu'au DERNIER produit : on retire alors 1 au quotient et on rend les produits d\xE9j\xE0 retir\xE9s.",demos:[{a:5832,b:243},{a:1950,b:249,rattrapage:!0}]},{id:"p8-3",titre:"5 et 6 chiffres, 10 lignes (endurance)",cibles:qe,chiffres:5,chiffresMax:6,lignes:10,repetitions:20,cumul:!0,pourquoi:"Le format du 4e ky\u016B (10 lignes de 5 chiffres), puis du 3e (6 chiffres) : 10 lignes sans perdre le rythme. Rep\xE9rez les tranches de 3 chiffres avec les points de la barre.",demos:[{depart:52708,op:"+",n:39415}]},{id:"p8-5",titre:"Multiplication \xE0 7 chiffres au total (4 \xD7 3, 5 \xD7 2)",type:"mul",m:4,n:3,formes:[[4,3],[3,4],[5,2],[2,5]],zerosFinaux:.15,repetitions:30,pourquoi:"Le format du 4e ky\u016B : 7 chiffres au total (3 506 \xD7 701, 74 213 \xD7 25, 872 \xD7 6 279). Plus le multiplicateur est court, plus le multiplicande est long : avec 5 \xD7 2, ce sont 10 produits sur une seule ligne de tiges. L'index gauche avance d'une tige \xE0 chaque chiffre du multiplicande ; les produits du m\xEAme chiffre glissent d'une tige chacun.",demos:[{a:3506,b:701},{a:74213,b:25}]},{id:"p8-8",titre:"Division \xE0 6 chiffres au total (\xF7 3 et quotient de 3, \xF7 2 et quotient de 4, \xF7 4 et quotient de 2)",type:"div",nd:3,nq:3,formes:[[3,3],[2,4],[4,2]],zerosFinaux:.15,repetitions:30,corrections:!0,pourquoi:"Le format du 4e ky\u016B : diviseur et quotient font 6 chiffres (140 866 \xF7 674 = 209 ; 265 118 \xF7 29 = 9 142 ; 289 153 \xF7 3 961 = 73). Avec un diviseur court, le quotient est long : quatre estimations \xE0 la suite, sans perdre la tige. Avec un diviseur \xE0 4 chiffres, une seule estimation, mais quatre produits \xE0 retirer pour chaque chiffre.",demos:[{a:140866,b:674},{a:289153,b:3961}]},{id:"p8-pl",titre:"Placement : les formes du 5e et du 4e ky\u016B",type:"placement",op:"mul",repetitions:30,formes:[["mul",3,3],["mul",4,2],["mul",2,4],["mul",4,3],["mul",3,4],["mul",5,2],["mul",2,5],["div",3,2],["div",2,3],["div",3,3],["div",2,4],["div",4,2]],pourquoi:"Une s\xE9rie courte, sans calculer : on ne pose que le PREMIER chiffre du produit ou du quotient. Les d\xE9coupages inhabituels (5 \xD7 2, diviseur \xE0 4 chiffres et quotient \xE0 2) pi\xE8gent surtout l\xE0 : une tige de travers, et tout le calcul est d\xE9cal\xE9. Multiplication : chiffres des deux facteurs au total = tige de la dizaine du premier produit. Division : on compare le d\xE9but du dividende au diviseur.",demos:[]}]},{id:"pd",titre:"D\xE9cimaux et arrondis (3e ky\u016B), n\xE9gatifs (2e ky\u016B)",sousPaliers:[{id:"pd-1",titre:"Le point des unit\xE9s : additions et soustractions de d\xE9cimaux",type:"addsubdec",repetitions:30,pourquoi:"Les points de la barre servent de rep\xE8re : on choisit l'un d'eux comme tige des unit\xE9s, et TOUTES les virgules s'alignent dessus. Les d\xE9cimales se posent sur les tiges \xE0 sa droite (dixi\xE8mes, centi\xE8mes\u2026). Pour 12,5 + 3,075 : 12 avant le point, 5 sur la 1re tige apr\xE8s ; puis 3 sur les unit\xE9s, 0, 7, 5 sur les trois tiges suivantes. Rien d'autre ne change : m\xEAmes gestes, m\xEAmes amis.",demos:[]},{id:"pd-2",titre:"Placer un produit d\xE9cimal (compte des chiffres)",type:"placement",op:"muldec",repetitions:30,exemples:[["D'abord, pourquoi ce n'est pas une formule",["En additions de d\xE9cimaux (le\xE7on pr\xE9c\xE9dente), rien ne bouge : chaque chiffre a SA tige, \xE0 gauche ou \xE0 droite du point des unit\xE9s.","En multiplication, le r\xE9sultat n'a pas la taille des facteurs : 37 \xD7 85 a 4 chiffres, 3,7 \xD7 8,5 n'en a que 2 avant la virgule. Il faut donc savoir O\xD9 va le premier produit.","Le \xAB compte \xBB d'un nombre, c'est simplement sa taille : combien de tiges il occupe \xE0 gauche de la virgule. 37,2 \u2192 2. 5,04 \u2192 1. 0,85 \u2192 0 (rien \xE0 gauche). 0,04 \u2192 \u22121 (il commence encore une tige plus \xE0 droite).","Multiplier, c'est additionner les tailles : un nombre \xAB \xE0 2 tiges \xBB fois un nombre \xAB \xE0 1 tige \xBB donne un produit qui commence 3 tiges \xE0 gauche de la virgule. C'est la r\xE8gle m + n des entiers, rien de plus."]],["37,2 \xD7 0,85",["Comptes : 37,2 \u2192 2 ; 0,85 \u2192 0. Somme : 2.","Le premier produit (3 \xD7 8 = 24) pose donc sa DIZAINE sur la 2e tige \xE0 gauche de la virgule, son unit\xE9 sur la 1re.","On multiplie ensuite comme des entiers (372 \xD7 85) : le soroban montre 31,62 par rapport au point des unit\xE9s.","Contr\xF4le de bon sens : 37 \xD7 0,85, c'est un peu moins que 37. 31,62 : coh\xE9rent."]],["0,04 \xD7 2,5",["Comptes : 0,04 \u2192 \u22121 ; 2,5 \u2192 1. Somme : 0.","Somme 0 : la dizaine du premier produit (4 \xD7 2 = 08) va sur la 1re tige \xE0 DROITE de la virgule.","R\xE9sultat : 0,100. Contr\xF4le : 4 centi\xE8mes fois 2,5, c'est 10 centi\xE8mes, soit 0,1."]]],pourquoi:"La m\xE9thode la plus rapide ne place pas la virgule \xE0 la fin : elle pose le premier produit directement au bon endroit. On compte les chiffres de chaque facteur AVEC SIGNE : 37,2 compte 2 (chiffres avant la virgule), 0,85 compte 0, 0,04 compte \u22121 (un z\xE9ro juste apr\xE8s la virgule). On additionne : la dizaine du premier produit va sur la tige de ce rang (2 \u2192 2e tige avant la virgule ; 0 \u2192 1re tige apr\xE8s la virgule ; \u22121 \u2192 2e tige apr\xE8s). C'est la r\xE8gle \xAB m + n \xBB des entiers, prolong\xE9e.",demos:[]},{id:"pd-3",titre:"Multiplier des d\xE9cimaux",type:"muldec",repetitions:30,exemples:[["6,4 \xD7 1,25 en trois temps",["Placer : comptes 1 et 1, somme 2. La dizaine du premier produit va sur la 2e tige \xE0 gauche de la virgule.","Calculer : 64 \xD7 125 comme des entiers, sans plus penser \xE0 la virgule.","Lire et contr\xF4ler : le soroban montre 8,000. Estimation : 6 \xD7 1,25 = 7,5, donc un peu plus : 8. Les d\xE9cimales : 1 + 2 = 3, on en lit bien trois."]]],pourquoi:"Compte des chiffres, puis \u4E21\u843D\u3068\u3057 exactement comme avec des entiers. Le r\xE9sultat se lit directement par rapport au point des unit\xE9s. V\xE9rification rapide : le nombre de d\xE9cimales du r\xE9sultat est la somme de celles des facteurs.",demos:[]},{id:"pd-4",titre:"Diviser des d\xE9cimaux",type:"divdec",repetitions:30,exemples:[["L'id\xE9e, avant la r\xE8gle",["Diviser, c'est l'inverse : les tailles se SOUSTRAIENT. Un nombre \xAB \xE0 3 tiges \xBB divis\xE9 par un nombre \xAB \xE0 1 tige \xBB donne un quotient d'environ 2 tiges.","\xAB Environ \xBB : il y a une tige de plus quand le d\xE9but du dividende est au moins aussi grand que le diviseur (le diviseur \xAB entre \xBB tout de suite). C'est exactement le test que vous faites d\xE9j\xE0 pour poser le premier chiffre du quotient."]],["1,56 \xF7 0,12",["Comptes : 1,56 \u2192 1 ; 0,12 \u2192 0. Diff\xE9rence : 1.","Le d\xE9but du dividende (15) est plus grand que le diviseur (12) : une tige de plus. Le quotient a donc 2 chiffres avant la virgule.","On divise comme des entiers (156 \xF7 12 = 13) et on lit 13.","Contr\xF4le : 13 \xD7 0,12 = 1,56."]],["0,36 \xF7 4,5",["Comptes : 0,36 \u2192 0 ; 4,5 \u2192 1. Diff\xE9rence : \u22121.","Le d\xE9but du dividende (36) est plus petit que le diviseur (45) : pas de tige en plus. Le quotient commence donc \xE0 la 2e tige apr\xE8s la virgule.","36 \xF7 45 donne 8 : on lit 0,08. Contr\xF4le : 0,08 \xD7 4,5 = 0,36."]]],pourquoi:"Le quotient a q chiffres avant la virgule, avec q = compte(dividende) \u2212 compte(diviseur), plus 1 si le d\xE9but du dividende est plus grand ou \xE9gal au diviseur (le m\xEAme test que pour poser le premier chiffre). Exemple : 1,56 \xF7 0,12 : 1 \u2212 0 + 1 = 2 chiffres \u2192 13. On divise comme d'habitude, et on lit le quotient avec ce compte.",demos:[]},{id:"pd-5",titre:"Arrondir au milli\xE8me",type:"divarrondi",repetitions:30,pourquoi:"Pour arrondir au milli\xE8me, on calcule UNE d\xE9cimale de plus (la 4e), puis on arrondit. Astuce rapide au soroban : on ajoute 5 sur la tige de cette 4e d\xE9cimale ; si elle valait 5 ou plus, la retenue monte toute seule sur le milli\xE8me. On lit ensuite jusqu'au milli\xE8me, sans rien effacer.",demos:[]},{id:"pd-6",titre:"Arrondir \xE0 l'unit\xE9 (les montants)",type:"arrondiunite",repetitions:30,pourquoi:"Dans la seconde moiti\xE9 des multiplications et des divisions d'examen, les nombres sont des montants : le r\xE9sultat s'arrondit \xE0 l'UNIT\xC9. M\xEAme geste que pour le milli\xE8me, un cran plus haut : on calcule UNE d\xE9cimale (le dixi\xE8me), on ajoute 5 sur sa tige, et on lit jusqu'aux unit\xE9s. En multiplication, les d\xE9cimales du produit se posent normalement ; seul le premier chiffre apr\xE8s le point des unit\xE9s d\xE9cide de l'arrondi. Lisez bien la consigne en t\xEAte de chaque s\xE9rie : l'erreur la plus fr\xE9quente est d'arrondir au mauvais rang.",demos:[]},{id:"p8-n",titre:"R\xE9sultats n\xE9gatifs : le compl\xE9ment",type:"negatif",chiffres:2,lignes:4,repetitions:20,pourquoi:"Aux 1er et 2e ky\u016B, un probl\xE8me de mitorizan (le 9e du sujet) finit sous z\xE9ro. Quand une soustraction \xAB d\xE9passe \xBB (il faut retirer plus que ce qui est pos\xE9), on emprunte un 1 IMAGINAIRE sur la tige \xE0 gauche de la colonne (100 pour une colonne \xE0 2 chiffres) et on continue normalement. \xC0 la fin, le soroban affiche le COMPL\xC9MENT du r\xE9sultat : s'il affiche 63 apr\xE8s un emprunt de 100, le r\xE9sultat est \u2212(100 \u2212 63) = \u221237. Lecture rapide : compl\xE9ment \xE0 9 de chaque chiffre, \xE0 10 pour le dernier (63 \u2192 3 et 7 \u2192 \u221237). Si le calcul repasse au-dessus de z\xE9ro, la retenue rend le 1 emprunt\xE9. Tapez le r\xE9sultat avec le signe moins.",demos:[]},{id:"p8-n2",titre:"R\xE9sultats n\xE9gatifs au format d'examen (8 chiffres)",type:"negatif",chiffres:8,lignes:6,repetitions:20,pourquoi:"Le m\xEAme geste qu'\xE0 la le\xE7on pr\xE9c\xE9dente, sur des nombres d'examen : on emprunte un 1 imaginaire \xE0 gauche des 8 tiges (100 000 000), et le soroban affiche le compl\xE9ment. Lisez-le d'un coup, tige par tige : compl\xE9ment \xE0 9 sur chaque tige, sauf la derni\xE8re qui porte un chiffre : compl\xE9ment \xE0 10.",demos:[]}]},{id:"p9",titre:"Vers le 1er ky\u016B",sousPaliers:[{id:"p9-1",titre:"7 et 8 chiffres, 10 lignes",cibles:qe,chiffres:7,chiffresMax:8,lignes:10,repetitions:20,cumul:!0,pourquoi:"Le format du 2e ky\u016B : 10 lignes de 8 chiffres. Aucun geste nouveau : ce qui change, c'est la lecture. Lisez par tranches de 3 chiffres, rep\xE9r\xE9es par les points de la barre (millions, milliers, unit\xE9s), et posez chaque tranche pendant que l'\u0153il prend la suivante. Ne revenez jamais en arri\xE8re sur une ligne : mieux vaut une colonne refaite qu'une ligne \xAB rattrap\xE9e \xBB.",demos:[{depart:4072581,op:"+",n:3964207}]},{id:"p9-3",titre:"Multiplication \xE0 8 et 9 chiffres au total (4 \xD7 4, 5 \xD7 3, 5 \xD7 4, 6 \xD7 3)",type:"mul",m:4,n:4,formes:[[4,4],[5,3],[3,5],[5,4],[4,5],[6,3],[3,6]],zerosFinaux:.15,repetitions:30,pourquoi:"Les formats du \u6E962 (8 chiffres au total) et du 2e ky\u016B (9 chiffres), dans tous leurs d\xE9coupages. M\xEAme m\xE9thode, plus de produits : jusqu'\xE0 20 produits de table. L'index gauche avance d'une tige \xE0 chaque chiffre du multiplicande ; ne le l\xE2chez jamais, c'est lui qui garde la place.",demos:[{a:2468,b:3751}]},{id:"p9-5",titre:"Division \xE0 7 et 8 chiffres au total (diviseur de 2 \xE0 5 chiffres)",type:"div",nd:4,nq:3,formes:[[4,3],[3,4],[5,2],[2,5],[4,4],[5,3],[3,5]],zerosFinaux:.15,repetitions:30,corrections:!0,pourquoi:"On estime toujours avec le diviseur arrondi sur son premier chiffre (2 431 \u2192 2 000, 2 780 \u2192 3 000), puis on corrige de \xB11. Avec 4 chiffres au diviseur, chaque chiffre du quotient demande 4 retraits : v\xE9rifiez l'estimation de t\xEAte avant de poser.",demos:[{a:1110967,b:2431}]},{id:"p9-2",titre:"9 et 10 chiffres, 10 lignes",cibles:qe,chiffres:9,chiffresMax:10,lignes:10,repetitions:20,cumul:!0,pourquoi:"Le format du 1er ky\u016B : 10 lignes de 10 chiffres, soit 100 chiffres par colonne. C'est une \xE9preuve d'endurance : gardez un rythme \xE9gal du premier au dernier chiffre, sans acc\xE9l\xE9rer sur les lignes faciles. La main gauche suit la ligne sur la feuille pour ne pas en sauter une.",demos:[{depart:407258136,op:"+",n:396420715}]},{id:"p9-4",titre:"Multiplication \xE0 10 et 11 chiffres au total (5 \xD7 5, 6 \xD7 4, 6 \xD7 5, 7 \xD7 4)",type:"mul",m:6,n:5,formes:[[5,5],[6,4],[4,6],[6,5],[5,6],[7,4],[4,7]],zerosFinaux:.15,repetitions:30,pourquoi:"Les formats du \u6E961 (10 chiffres au total) et du 1er ky\u016B (11 chiffres) : jusqu'\xE0 30 produits de table \xE0 la suite. La difficult\xE9 est de ne perdre ni sa place sur la feuille ni sa tige sur le soroban. Dites int\xE9rieurement le chiffre du multiplicande en cours.",demos:[{a:246813,b:37519}]},{id:"p9-6",titre:"Division \xE0 9 et 10 chiffres au total (diviseur de 3 \xE0 6 chiffres)",type:"div",nd:5,nq:5,formes:[[5,4],[4,5],[6,3],[3,6],[5,5],[6,4],[4,6]],zerosFinaux:.15,repetitions:30,pourquoi:"Les formats du \u6E961 (9 chiffres au total) et du 1er ky\u016B (10 chiffres) : diviseur de 3 \xE0 6 chiffres. Avec 5 chiffres au diviseur, l'unit\xE9 du quotient est 6 tiges \xE0 gauche de l'unit\xE9 du dividende (chiffres du diviseur + 1). Comparez les 5 premiers chiffres du dividende au diviseur pour savoir o\xF9 poser le premier chiffre.",demos:[{a:760107726,b:24318}]},{id:"p9-pl",titre:"Placement : les formes du 2e et du 1er ky\u016B",type:"placement",op:"mul",repetitions:30,formes:[["mul",5,3],["mul",6,3],["mul",3,6],["mul",5,4],["mul",6,4],["mul",7,4],["mul",4,7],["mul",6,5],["div",5,2],["div",3,5],["div",5,3],["div",4,4],["div",6,3],["div",6,4],["div",4,6],["div",5,5]],pourquoi:"Le premier chiffre seulement, sur les grands d\xE9coupages du 2e et du 1er ky\u016B (7 \xD7 4, diviseur \xE0 6 chiffres et quotient \xE0 4). Avec 10 ou 11 chiffres au total, la tige du premier produit se compte vite de travers : comptez les chiffres des deux facteurs, et rep\xE9rez la tige avec les points de la barre.",demos:[]}]},{id:"pa",titre:"Anzan et visualisation (piste parall\xE8le)",mental:!0,sousPaliers:[{id:"pa-0",titre:"Le cours : voir le soroban dans sa t\xEAte",type:"theorie",apres:"p1-4",repetitions:0,pourquoi:"L'anzan, c'est calculer avec un soroban imaginaire. Ce n'est pas du calcul mental \xAB avec des mots \xBB : on VOIT les boules bouger. Cette piste avance \xE0 son rythme, en parall\xE8le des le\xE7ons sur le vrai soroban, et toujours un peu en retard sur elles : on n'imagine bien que des gestes d\xE9j\xE0 automatiques.",sections:[["Les \xE9tapes","1. Prendre la \xAB photo \xBB d'un soroban : le voir une seconde et lire le nombre. 2. Tenir une image : poser un nombre sur le soroban imaginaire et le garder net. 3. Calculer avec une image d'aide qui s'estompe peu \xE0 peu. 4. Calculer de t\xEAte, en allongeant la cha\xEEne de nombres, puis en acc\xE9l\xE9rant."],["Toujours le m\xEAme soroban","Imaginez VOTRE soroban, avec sa couleur, la taille de ses boules et sa barre. Toujours le m\xEAme : l'image se renforce \xE0 chaque s\xE9ance. Ne visualisez que les tiges utiles (une ou deux au d\xE9but), pas tout le cadre."],["Garder l'image du TOTAL","Le nombre lu ne sert qu'\xE0 d\xE9clencher un geste, puis on l'oublie. Ce qu'on garde en t\xEAte, c'est l'\xE9tat du soroban : le total. \xC0 la fin, on ne calcule rien, on LIT le soroban imaginaire."],["Les doigts dans l'air","\xC0 chaque nombre, faites le geste avec le pouce et l'index, comme sur le vrai soroban. Au d\xE9but, c'est le mouvement des doigts qui \xAB porte \xBB l'image. Les doigts s'effacent d'eux-m\xEAmes beaucoup plus tard."],["Pas de phrase int\xE9rieure","Ne vous dites pas \xAB 4 plus 3 \xE9gale 7 \xBB : on voit la c\xE9leste descendre et deux terrestres s'en aller. Si une voix int\xE9rieure compte, ralentissez jusqu'\xE0 voir les boules."],["Les yeux","En mitori-anzan (colonne affich\xE9e), fermer les yeux un instant entre deux nombres aide au d\xE9but. En flash, regardez le nombre, puis l'image int\xE9rieure."],["Quand l'image se brouille","On r\xE9duit le NOMBRE de nombres, pas la vitesse : mieux vaut 3 nombres nets que 5 flous. Quand on est perdu, on ne devine pas : on le note faux et on recommence. L'application allonge la cha\xEEne quand vous r\xE9ussissez, et la raccourcit apr\xE8s une erreur."],["Peu, mais tous les jours","5 minutes d'anzan chaque jour valent mieux que 20 minutes une fois par semaine. L'image se construit par la r\xE9p\xE9tition, entre les s\xE9ances."]],pourquoiCaMarche:[["Une image plut\xF4t que des mots","Garder \xAB 47 \xBB en mots occupe la m\xE9moire de travail, d\xE9j\xE0 petite. Une image de soroban se garde mieux : c'est une forme, pas une suite de sons. C'est pourquoi on \xE9vite la voix int\xE9rieure."],["Les doigts aident la t\xEAte","D'apr\xE8s l'imagerie c\xE9r\xE9brale, les zones qui commandent un geste s'activent en partie quand on l'imagine. Bouger les doigts dans l'air relie l'image au geste appris sur le vrai soroban."],["Pourquoi aller lentement","Si l'image se brouille, on s'entra\xEEne \xE0\u2026 deviner. Mieux vaut des cha\xEEnes courtes et nettes : la longueur vient ensuite, puis la vitesse."]],quiz:[{q:"Pendant un calcul de t\xEAte, que garde-t-on en t\xEAte ?",choix:["L'image du soroban, avec le total","La liste des nombres lus","La phrase \xAB 4 plus 3 \xE9gale 7 \xBB"],bonne:0,pourquoi:"Le nombre lu d\xE9clenche un geste, puis on l'oublie : on garde l'\xE9tat du soroban, le total (\xAB Garder l'image du TOTAL \xBB)."},{q:"L'image se brouille : que faire ?",choix:["R\xE9duire le nombre de nombres","Aller plus vite pour finir avant d'oublier","Deviner le r\xE9sultat"],bonne:0,pourquoi:"On r\xE9duit le NOMBRE de nombres, pas la vitesse : 3 nombres nets valent mieux que 5 flous."},{q:"Et les doigts ?",choix:["On fait le geste dans l'air, comme sur le vrai soroban","On les garde immobiles","On compte sur ses doigts"],bonne:0,pourquoi:"Au d\xE9but, c'est le mouvement des doigts qui porte l'image (\xAB Les doigts dans l'air \xBB)."},{q:"Quel soroban imaginer ?",choix:["Toujours le m\xEAme : le v\xF4tre","Un nouveau \xE0 chaque s\xE9ance","Peu importe"],bonne:0,pourquoi:"Toujours le m\xEAme : l'image se renforce \xE0 chaque s\xE9ance."}],demos:[]},{id:"pa-1",titre:"Photo du soroban : 1 tige",type:"photo",apres:"p1-4",chiffres:1,duree:1.5,repetitions:20,pourquoi:"Un soroban s'affiche un court instant : tapez le nombre qu'il montrait. Ne comptez pas les boules une \xE0 une : prenez une \xAB photo \xBB d'un coup d'\u0153il, c\xE9leste puis terrestres. C'est la brique de base de la visualisation.",demos:[]},{id:"pa-2",titre:"Photo du soroban : 2 tiges",type:"photo",apres:"p1-4",chiffres:2,duree:2,repetitions:20,pourquoi:"Deux tiges : on photographie la tige des dizaines puis celle des unit\xE9s, de gauche \xE0 droite, comme on lit un nombre.",demos:[]},{id:"pa-3",titre:"Tenir une image",type:"tenir",apres:"p1-4",chiffres:2,duree:1.5,tenir:3,repetitions:15,testMin:12,pourquoi:"Un nombre s'affiche en chiffres. Fermez les yeux et posez-le sur votre soroban imaginaire, avec les doigts dans l'air. Gardez l'image nette quelques secondes. Ensuite le vrai soroban s'affiche : votre image \xE9tait-elle la m\xEAme ? Vous r\xE9pondez honn\xEAtement, O ou N.",demos:[]},{id:"p1-a",titre:"Anzan : gestes directs",type:"anzan",apres:"p1-4",image:!0,cibles:dt("+",[1,2,3,4],"direct"),chiffres:1,lignes:5,duree:3,repetitions:30,testMin:12,pourquoi:"Les nombres s'affichent un par un. \xC0 chaque nombre, faites le geste avec les doigts dans l'air et voyez les boules bouger. Au d\xE9but, un petit soroban montre le TOTAL qui \xE9volue : suivez-le, puis il s'estompe \xE0 mesure que vous r\xE9ussissez. La cha\xEEne commence \xE0 2 nombres et s'allonge quand vous r\xE9ussissez.",demos:[]},{id:"p2-a",titre:"Anzan : petits amis",type:"anzan",apres:"p2-7",image:!0,cibles:xp,chiffres:1,lignes:5,duree:2.5,repetitions:30,testMin:12,pourquoi:"M\xEAmes gestes qu'au soroban : le petit ami se \xAB voit \xBB (la c\xE9leste descend, des terrestres s'en vont). Gardez les doigts actifs. Si l'image se brouille, la cha\xEEne se raccourcit d'elle-m\xEAme : ne devinez pas.",demos:[]},{id:"p3-a",titre:"Anzan : grands amis (addition)",type:"anzan",apres:"p3-4",image:!0,cibles:Al(zi),chiffres:1,lignes:5,duree:2.5,repetitions:30,testMin:12,pourquoi:"Une deuxi\xE8me tige appara\xEEt dans l'image : la retenue monte sur la tige des dizaines. Voyez le compl\xE9ment partir des unit\xE9s, puis la boule monter \xE0 gauche.",demos:[]},{id:"p4-a",titre:"Anzan : grands amis (soustraction)",type:"anzan",apres:"p4-5",image:!0,cibles:Cl(zi),chiffres:1,lignes:5,duree:2,repetitions:30,testMin:12,pourquoi:"L'emprunt se voit sur la tige des dizaines avant le compl\xE9ment sur les unit\xE9s : m\xEAme ordre qu'au soroban.",demos:[]},{id:"pa-5",titre:"Anzan : 5 nombres, tous les amis",type:"anzan",apres:"p5-5",image:!0,cibles:qe.filter(e=>!e.startsWith("cascade")&&!e.endsWith(":direct")),chiffres:1,lignes:6,duree:1.5,repetitions:30,testMin:12,lignesDepart:3,pourquoi:"Avant de passer \xE0 deux chiffres, on consolide \xE0 un chiffre : tous les gestes m\xE9lang\xE9s, des cha\xEEnes de 5 ou 6 nombres, un peu plus vite. C'est ici que l'image devient vraiment stable.",demos:[]},{id:"pa-6",titre:"Anzan : 2 chiffres, sans retenue",type:"anzan",apres:"p1-4",image:!0,cibles:Do,chiffres:2,lignes:4,duree:3,repetitions:30,testMin:12,pourquoi:"Deux tiges dans la t\xEAte, mais rien que des gestes directs : aucune retenue, aucun ami. Les dizaines et les unit\xE9s bougent chacune de leur c\xF4t\xE9. C'est la marche entre un chiffre et le vrai calcul \xE0 deux chiffres : on y apprend seulement \xE0 tenir deux tiges nettes, de gauche \xE0 droite.",demos:[]},{id:"p5-a",titre:"Anzan : 2 chiffres",type:"anzan",apres:"p5-5",image:!0,cibles:qe,chiffres:2,lignes:4,duree:3,repetitions:30,testMin:12,pourquoi:"Deux tiges, et maintenant tous les gestes : la retenue passe d'une tige \xE0 l'autre dans l'image. On revient \xE0 des cha\xEEnes courtes et \xE0 un affichage lent, avec l'image d'aide : la difficult\xE9 a chang\xE9, on repart doucement.",demos:[]},{id:"pa-m1",titre:"Anzan : multiplier 2 chiffres par 1",type:"mul",m:2,n:1,apres:"p6-1",repetitions:30,testMin:12,pourquoi:"Soroban rang\xE9. La multiplication se fait dans la t\xEAte exactement comme sur les boules : on voit le premier produit se poser sur ses deux tiges, puis le second une tige plus \xE0 droite, et on LIT le total. Pour 37 \xD7 8 : 24 d'abord (2 et 4), puis 56 une tige \xE0 droite : le 5 s'ajoute au 4 (grand ami), il reste 6. Faites les gestes dans l'air. Si l'image se brouille, ne devinez pas : reprenez depuis le premier produit.",demos:[{a:37,b:8}]},{id:"pa-m2",titre:"Anzan : multiplier 3 chiffres par 1",type:"mul",m:3,n:1,apres:"p6-2",repetitions:30,testMin:12,pourquoi:"Un produit de plus, donc une tige de plus dans l'image : quatre tiges \xE0 tenir. Gardez les yeux (int\xE9rieurs) sur la tige o\xF9 tombe le produit en cours ; les tiges de gauche, d\xE9j\xE0 finies, ne bougent plus.",demos:[{a:372,b:8}]},{id:"pa-d1",titre:"Anzan : diviser par 1 chiffre",type:"div",nd:1,nq:2,apres:"p7-2",repetitions:30,testMin:12,pourquoi:"Le dividende est pos\xE9 dans la t\xEAte ; on y retire les produits, comme sur le soroban, et l'on voit le quotient appara\xEEtre \xE0 gauche. Pour 156 \xF7 4 : 3 (on retire 12, il reste 36), puis 9 (on retire 36). Voyez le reste diminuer : c'est lui qu'il faut garder net.",demos:[{a:156,b:4}]},{id:"pa-7",titre:"Anzan : 2 chiffres, 6 nombres",type:"anzan",apres:"p8-t1",image:!0,cibles:qe,chiffres:2,  (\xAB 24, 15\u2026 \xBB).","L'index gauche marque la tige o\xF9 commence le produit en cours : la main droite pose, la gauche guide. On ne cherche jamais sa place.","Chaque produit sur DEUX tiges, m\xEAme \xAB 06 \xBB ou \xAB 00 \xBB : avancer d'une tige est un r\xE9flexe, jamais un calcul.","Quand une retenue d\xE9borde \xE0 gauche des deux tiges du produit, l'index gauche ne bouge pas : c'est la main droite qui monte la retenue et revient. Le produit suivant part toujours une tige \xE0 droite du pr\xE9c\xE9dent."],p7:["Estimez avec le diviseur arrondi (18 \u2192 20) : c'est plus rapide que de chercher la table exacte, et la correction de \xB11 est rare.","L'index gauche suit le chiffre du quotient en cours ; les produits se retirent juste \xE0 sa droite.","Un chiffre de quotient trop petit se corrige sans tout effacer : +1 au quotient, on retire encore le diviseur.","Un chiffre de quotient trop grand se rattrape aussi : \u22121 au quotient, on rend les chiffres du diviseur d\xE9j\xE0 retir\xE9s une fois de trop, et on continue."],p8:["Grands nombres : d\xE9coupez par tranches de 3 chiffres (les points de la barre) ; l'\u0153il rep\xE8re la tranche, la main pose.","Endurance : sur 10 lignes, gardez le m\xEAme rythme de la 1re \xE0 la 10e. Si vous ralentissez \xE0 la fin, faites des s\xE9ries plus courtes mais plus nombreuses.","Z\xE9ros : un 0 dans un nombre, c'est une tige \xE0 SAUTER, pas \xE0 oublier. Dites-le int\xE9rieurement (\xAB trois, z\xE9ro, sept \xBB)."]},Bu=["Toujours le m\xEAme soroban mental : le v\xF4tre, avec ses couleurs et sa barre. L'image se renforce \xE0 chaque s\xE9ance.","Ne visualisez que les tiges utiles (une ou deux), pas tout le cadre.","Gardez l'image du TOTAL : le nombre lu d\xE9clenche un geste, puis on l'oublie.","Les doigts bougent dans l'air \xE0 chaque nombre : c'est ce qui porte l'image au d\xE9but.","Pas de phrase int\xE9rieure (\xAB 4 plus 3 \xE9gale 7 \xBB) : on voit les boules bouger, on ne compte pas.","Image floue ? Moins  propre record, rejou\xE9 en m\xEAme temps que vous : une barre montre o\xF9 vous en \xE9tiez \xE0 ce moment-l\xE0."],["Flash anzan","Des nombres affich\xE9s tr\xE8s bri\xE8vement, un par un, \xE0 additionner de t\xEAte."],["Ky\u016B (\u7D1A)","Grade de calcul au soroban, du 10e (d\xE9butant) au 1er. Les \xAB ky\u016B pr\xE9p. \xBB (20e au 11e) sont propres \xE0 cette application et n'ont pas de valeur officielle. Les deux \xE9chelles sont sur une seule frise, dans Se mesurer \u2192 Grades."],["Lecture (le\xE7on)","Lire un soroban d'un coup d'\u0153il et poser un nombre sans h\xE9siter : la premi\xE8re le\xE7on apr\xE8s la le\xE7on 0. Une erreur de lecture ressemble \xE0 une erreur de geste."],["Li\xE8vre","Jeu de rythme : les nombres d\xE9filent \xE0 une cadence impos\xE9e qui acc\xE9l\xE8re quand vous suivez."],["Marathon (ruban)","Une longue colonne sans remise \xE0 z\xE9ro : on donne le sous-total r\xE9guli\xE8rement, et on tient le plus longtemps possible."],["Mitori (\u898B\u53D6\u308A)","Les additions et soustractions \xE9crites en colonne, qu'on lit et qu'on pose sur le soroban : l'exercice de base des examens."],["Mode Espace (mains sur le soroban)","On appuie sur Espace d\xE8s que son soroban est fini : le chrono s'arr\xEAte \xE0 cet instant, puis on tape le r\xE9sultat sans \xEAtre press\xE9 (la frappe ne compte pas dans le temps)."],["Mode pur","Planches o\xF9 chaque ligne utilise le geste travaill\xE9, sans geste direct pour souffler."],["Motif (geste)","Un geste pr\xE9cis sur une tige, par exemple \xAB +3 petit ami \xBB ou \xAB \u22128 grand ami \xBB. La carte de ma\xEEtrise les suit un par un."],["Niveau d'un geste","\xC0 d\xE9couvrir, bronze, argent, or, platine : selon la justesse ET la vitesse sur ce geste. Une seule \xE9chelle dans toute l'application. Argent \u2248 l'allure du 6e ky\u016B, or \u2248 4e ky\u016B, platine \u2248 2e ky\u016B. Une fois le 3e ky\u016B r\xE9ussi, elle monte d'un cran : argent \u2248 4e ky\u016B, or \u2248 2e ky\u016B,
