<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Soroban</title>
<!-- Fichier généré par scripts/construire-html.mjs (version 0.8.0). Ne pas modifier à la main. -->
<style>/* Style minimaliste : fond clair, un seul accent, rien d'inutile. */
:root {
  --fond: #f6f5f2;
  --surface: #ffffff;
  --texte: #1f2328;
  --discret: #6b6f76;
  --ligne: #e1dfda;
  --accent: #2f6fdf;
  --ok: #2e8b57;
  --erreur: #d1352b;
  --bois: #3b3530;
  --boule: #7a6b60;
  --boule-active: #2a231e;
  font-size: 16px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, "Segoe UI", system-ui, Roboto, sans-serif;
  background: var(--fond);
  color: var(--texte);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ------------------------------------------------------------ navigation */
#navigation {
  width: 210px;
  flex-shrink: 0;
  padding: 18px 10px;
  border-right: 1px solid var(--ligne);
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow-y: auto;
}
#navigation .titre-app { font-weight: 700; font-size: 1.15rem; padding: 0 10px 14px; }
#navigation button {
  text-align: left; background: none; border: none; padding: 8px 10px; border-radius: 6px;
  font: inherit; color: var(--texte); cursor: pointer;
}
#navigation button:hover { background: #ebe9e4; }
#navigation button.actif { background: var(--texte); color: white; }
#navigation button:disabled { color: #a9acb2; cursor: default; background: none; }
#navigation .bientot { font-size: 0.75rem; margin-left: 4px; }

main { flex: 1; overflow-y: auto; padding: 28px 36px 48px; }
main > * { max-width: 1000px; }

h1 { font-size: 1.5rem; margin: 0 0 6px; }
h2 { font-size: 1.1rem; margin: 24px 0 8px; }
p { line-height: 1.5; margin: 6px 0; }
.discret { color: var(--discret); }

/* ------------------------------------------------------------ contrôles */
button.btn {
  font: inherit; padding: 8px 16px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--ligne); background: var(--surface); color: var(--texte);
}
button.btn:hover { border-color: #c9c6bf; }
button.btn.principal { background: var(--accent); border-color: var(--accent); color: white; }
button.btn:disabled { opacity: 0.45; cursor: default; }
kbd {
  font: 0.75rem ui-monospace, monospace; border: 1px solid var(--ligne); border-bottom-width: 2px;
  border-radius: 4px; padding: 0 4px; background: var(--surface); color: var(--discret);
}

.reglages {
  display: flex; flex-wrap: wrap; gap: 18px; align-items: center;
  padding: 10px 0 14px; border-bottom: 1px solid var(--ligne); margin-bottom: 18px;
}
.reglages label { display: flex; gap: 6px; align-items: center; color: var(--discret); }
select, input[type="number"], input[type="text"] {
  font: inherit; padding: 6px 8px; border: 1px solid var(--ligne); border-radius: 6px; background: var(--surface);
}

.segments { display: inline-flex; border: 1px solid var(--ligne); border-radius: 6px; overflow: hidden; }
.segments button { font: inherit; border: none; background: var(--surface); padding: 6px 14px; cursor: pointer; }
.segments button + button { border-left: 1px solid var(--ligne); }
.segments button.actif { background: var(--texte); color: white; }

.carte { background: var(--surface); border: 1px solid var(--ligne); border-radius: 8px; padding: 16px 18px; }
details.carte summary { cursor: pointer; font-weight: 600; }
details.carte ul { margin: 10px 0 0; padding-left: 20px; line-height: 1.6; }

.ligne { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ------------------------------------------------------------ exercice */
.consigne { font-size: 1.05rem; margin: 6px 0 12px; min-height: 1.5em; }
.nombre-cible { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
.compteur { color: var(--discret); font-variant-numeric: tabular-nums; }
.saisie-nombre { font-size: 1.6rem; width: 220px; font-variant-numeric: tabular-nums; }
.retour { min-height: 3.2em; margin-top: 12px; line-height: 1.5; }
.retour.ok { color: var(--ok); font-weight: 600; }
.retour.erreur { color: var(--erreur); }
.retour .detail { color: var(--texte); font-weight: normal; }

.bilan { font-size: 1.1rem; }
.bilan .grand { font-size: 2rem; font-weight: 700; }

/* ------------------------------------------------------------ soroban */
.zone-soroban { margin: 8px 0; }
svg.soroban { width: 100%; max-height: 360px; display: block; user-select: none; touch-action: none; }
svg.soroban .cadre { fill: var(--bois); }
svg.soroban .fond { fill: #efece6; }
svg.soroban .axe { stroke: #9c958c; stroke-width: 2; }
svg.soroban .barre { fill: var(--bois); }
svg.soroban .repere { fill: #f6f5f2; }
svg.soroban .boule {
  fill: var(--boule); stroke: #00000030; stroke-width: 1;
  transition: transform 110ms ease-out, fill 120ms;
}
svg.soroban.interactif .boule { cursor: pointer; }
svg.soroban.interactif .boule:hover { stroke: var(--accent); stroke-width: 2; }
svg.soroban .boule.active { fill: var(--boule-active); }
svg.soroban .boule.bouge { fill: var(--accent) !important; }
svg.soroban .tige.erreur .boule { fill: var(--erreur); }
svg.soroban .tige.ok .boule.active { fill: var(--ok); }
svg.soroban .tige.cible .axe { stroke: var(--accent); stroke-width: 3; }
svg.soroban .etiquette, svg.soroban .valeur-tige { font-size: 12px; fill: var(--discret); display: none; }
svg.soroban .valeur-tige { font-size: 14px; font-weight: 600; fill: var(--texte); }
svg.soroban.avec-etiquettes .etiquette, svg.soroban.avec-valeurs .valeur-tige { display: block; }
svg.soroban .doigt { font-size: 12px; font-weight: 600; fill: var(--accent); }

/* Démonstration : liste des étapes */
.etapes { list-style: none; padding: 0; margin: 10px 0 0; }
.etapes li { padding: 6px 10px; border-left: 3px solid transparent; color: var(--discret); line-height: 1.45; }
.etapes li.courante { border-left-color: var(--accent); color: var(--texte); background: var(--surface); }
.etapes li.annonce { font-style: italic; }
.etapes .regle {
  display: inline-block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em;
  padding: 1px 6px; border-radius: 4px; background: #ebe9e4; margin-right: 6px; font-style: normal;
}

/* ------------------------------------------------------------ accueil / progression */
.grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 16px; }
.grille .carte { cursor: pointer; }
.grille .carte:hover { border-color: #c9c6bf; }
.grille .carte.indisponible { cursor: default; opacity: 0.55; }
.grille .carte h3 { margin: 0 0 4px; font-size: 1rem; }
.grille .carte p { margin: 0; color: var(--discret); font-size: 0.92rem; }
.suggestion { border-left: 3px solid var(--accent); }

table { border-collapse: collapse; width: 100%; background: var(--surface); }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--ligne); font-variant-numeric: tabular-nums; }
th { font-weight: 600; color: var(--discret); font-size: 0.9rem; }

/* ------------------------------------------------------------ leçons, séances, planches */
button.lien { background: none; border: none; color: var(--accent); font: inherit; cursor: pointer; padding: 0 0 8px; }
.pastille {
  display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px;
  background: var(--erreur); color: white; font-size: 0.75rem; text-align: center; line-height: 18px;
}
.liste-paliers { display: flex; flex-direction: column; gap: 4px; }
.ligne-palier {
  display: flex; align-items: center; gap: 12px; text-align: left; font: inherit; color: var(--texte);
  background: var(--surface); border: 1px solid var(--ligne); border-radius: 6px; padding: 9px 12px; cursor: pointer;
}
.ligne-palier:hover:not(:disabled) { border-color: #c9c6bf; }
.ligne-palier:disabled { opacity: 0.45; cursor: default; }
.ligne-palier .icone { width: 16px; text-align: center; color: var(--accent); }
.ligne-palier.valide .icone { color: var(--ok); }
.ligne-palier .titre { flex: 1; }
.ligne-palier .statut { color: var(--discret); font-size: 0.9rem; }
.pourquoi { line-height: 1.55; border-left: 3px solid var(--accent); }

.enonce { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 4px 0 8px; min-height: 1.3em; }
.enonce .fait { color: var(--discret); font-weight: 600; }
.enonce .courant { color: var(--accent); text-decoration: underline; text-underline-offset: 6px; }

.bandeau { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
.jauge { width: 220px; height: 8px; background: var(--ligne); border-radius: 4px; overflow: hidden; }
.jauge > div { height: 100%; background: var(--accent); transition: width 200ms; }

.diagnostic {
  margin-top: 14px; padding: 12px 16px; border-radius: 8px; background: #fff8ec; border: 1px solid #f0d9ae;
  border-left: 4px solid #e39b21; display: flex; flex-direction: column; gap: 10px;
}
.diag-motif { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; line-height: 1.45; }

.disposition-colonne { display: flex; gap: 24px; align-items: flex-start; }
table.planche { width: auto; min-width: 150px; font-size: 1.6rem; font-weight: 600; background: none; }
table.planche td { padding: 2px 10px; border: none; text-align: right; }
table.planche td.num { font-size: 0.8rem; color: var(--discret); font-weight: normal; }
table.planche td.signe { width: 20px; text-align: center; }
table.planche tr.fait { color: #b3b0aa; }
table.planche tr.courant { color: var(--accent); background: #eaf0fc; }
.chrono { margin-right: 14px; }
td.a-retravailler { color: var(--erreur); font-weight: 600; }

dialog.dialogue {
  border: none; border-radius: 10px; padding: 20px 24px; width: min(900px, 92vw); max-height: 92vh;
  box-shadow: 0 10px 40px #0004; background: var(--fond); color: var(--texte);
}
dialog.dialogue::backdrop { background: #0005; }
.panneau-demo svg.soroban, .seance svg.soroban { max-height: 280px; }

/* ------------------------------------------------------------ énoncés à calculer sur son soroban */
table.colonne { width: auto; background: none; font-size: 2rem; font-weight: 600; font-variant-numeric: tabular-nums; margin: 6px 0 12px; }
table.colonne td { border: none; padding: 1px 8px; text-align: right; }
table.colonne td.signe { width: 24px; text-align: center; color: var(--discret); }
table.colonne td.num { font-size: 0.75rem; color: var(--discret); font-weight: normal; }
table.colonne td.sous-total { font-size: 0.55em; color: var(--accent); font-weight: 500; text-align: left; }
table.colonne tr.cliquable { cursor: pointer; }
table.colonne tr.cliquable:hover { background: #eaf0fc; }
table.colonne td.jouer { font-size: 0.5em; color: var(--accent); }
table.colonne.compacte { font-size: 1.15rem; margin: 4px 0; }
table.colonne.compacte td { padding: 0 4px; }
.operation { font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 10px 0 14px; }
.operation.compacte { font-size: 1.15rem; margin: 4px 0; }
.grand-signe { font-size: 1.5rem; font-weight: 700; }
.pastilles { display: flex; flex-wrap: wrap; gap: 3px; min-height: 22px; }
.pastille-res { width: 22px; height: 22px; border-radius: 4px; font-size: 0.8rem; display: inline-flex; align-items: center; justify-content: center; color: white; }
.pastille-res.ok { background: var(--ok); }
.pastille-res.ko { background: var(--erreur); }
.serie .saisie-nombre { width: 260px; }
.etapes li.sous { padding-left: 26px; }
.etapes li.annonce { font-style: normal; font-weight: 600; color: var(--texte); }
.btn.ok-btn { border-color: var(--ok); color: var(--ok); }
.btn.ko-btn { border-color: var(--erreur); color: var(--erreur); }
.liste-erreurs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.erreur-item .detail { font-size: 0.9rem; }

/* ------------------------------------------------------------ feuilles (planches, épreuves) */
.barre-feuille {
  position: sticky; top: -28px; z-index: 2; display: flex; gap: 10px; align-items: center;
  background: var(--fond); padding: 10px 0; border-bottom: 1px solid var(--ligne); margin-bottom: 12px;
}
.chrono-feuille { font-variant-numeric: tabular-nums; color: var(--discret); }
.chrono-feuille.urgent { color: var(--erreur); font-weight: 700; }
.grille-feuille { display: grid; gap: 10px; }
.grille-feuille.colonnes { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
.grille-feuille.operations { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.probleme { background: var(--surface); border: 1px solid var(--ligne); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.probleme .num-probleme { align-self: flex-start; font-size: 0.75rem; color: var(--discret); }
.probleme input { width: 100%; font: inherit; font-size: 1.05rem; text-align: right; padding: 4px 6px; border: 1px solid var(--ligne); border-radius: 4px; font-variant-numeric: tabular-nums; }
.probleme.ok { border-color: var(--ok); box-shadow: inset 4px 0 0 var(--ok); }
.probleme.ko { border-color: var(--erreur); box-shadow: inset 4px 0 0 var(--erreur); }
.probleme .correction { align-self: stretch; font-size: 0.85rem; text-align: right; }
.section-feuille + .section-feuille { margin-top: 18px; }
.corrige-impression { display: none; }

/* ------------------------------------------------------------ drills, flash anzan */
.drill-operations { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 2px 14px; margin: 12px 0; font-variant-numeric: tabular-nums; }
.drill-op { display: flex; gap: 10px; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-size: 1.1rem; }
.drill-op:hover { background: #eaf0fc; }
.drill-op .num { width: 26px; color: var(--discret); font-size: 0.8rem; }
.drill-op .sous-total { color: var(--accent); margin-left: auto; font-size: 0.95rem; }
.flash-ecran {
  height: 220px; display: flex; align-items: center; justify-content: center; margin: 14px 0;
  background: var(--surface); border: 1px solid var(--ligne); border-radius: 10px;
  font-size: 6rem; font-weight: 700; font-variant-numeric: tabular-nums;
}
.flash-ecran.decompte { color: var(--discret); font-size: 3rem; }

/* ------------------------------------------------------------ impression : la feuille seule, corrigé sur une autre page */
@media print {
  body { display: block; height: auto; overflow: visible; background: white; }
  #navigation, .reglages, .lien, button, .chrono-feuille, .bilan, main > h1, main > p, main > details, main > .carte { display: none !important; }
  main { padding: 0; overflow: visible; }
  .barre-feuille { position: static; border: none; }
  .probleme { break-inside: avoid; border-color: #999; }
  .probleme input { border: none; border-bottom: 1px solid #333; border-radius: 0; color: transparent; }
  .probleme.ok, .probleme.ko { box-shadow: none; }
  .probleme .correction { display: none; }
  .corrige-impression { display: block; break-before: page; }
  .corrige-impression ol { columns: 4; font-variant-numeric: tabular-nums; }
}

/* ------------------------------------------------------------ niveaux d'acquisition et chronomètre */
.niveau { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; white-space: nowrap; font-weight: 600; }
.niveau-decouverte { background: #eeece8; color: #52514e; }
.niveau-progres { background: #86b6ef; color: #0b0b0b; }
.niveau-debutant { background: #5598e7; color: #0b0b0b; }
.niveau-confirme { background: #256abf; color: #ffffff; }
.niveau-expert { background: #104281; color: #ffffff; }
.ligne-palier .niveau { margin-left: 6px; }
.disposition-enonce { display: flex; gap: 32px; align-items: flex-start; max-width: 720px; }
.chrono-exercice { margin: 10px 0 0 auto; text-align: right; min-width: 130px; }
.chrono-exercice .temps { font-size: 1rem; font-variant-numeric: tabular-nums; color: #a9a6a0; }
.chrono-exercice .objectif { font-size: 0.75rem; color: #a9a6a0; line-height: 1.3; }
.objectif.tenu { color: var(--ok); font-weight: 600; }
.localisation { margin-top: 6px; color: var(--texte); }
.avis { border-left: 3px solid #e39b21; margin-bottom: 12px; }

/* ------------------------------------------------------------ menu en sections */
#navigation .section-menu { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--discret); padding: 14px 10px 4px; }
#navigation .separateur-menu { border: none; border-top: 1px solid var(--ligne); margin: 12px 10px 8px; }

/* ------------------------------------------------------------ séance du jour, tuiles */
.tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 12px 0 16px; }
.tuile { background: var(--surface); border: 1px solid var(--ligne); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.tuile-titre { font-size: 0.8rem; color: var(--discret); display: flex; align-items: center; gap: 6px; }
.tuile-titre select { font-size: 0.8rem; padding: 2px 4px; }
.tuile-valeur { font-size: 1.4rem; font-weight: 700; }
.tuile .jauge { width: 100%; }
.plan { line-height: 1.8; margin: 10px 0 0; }
.bilan-seance { border-left: 3px solid var(--accent); margin-bottom: 14px; }
.bilan-seance ul { padding-left: 18px; line-height: 1.7; }
.compteur.fantome { color: #a9a6a0; margin-right: 12px; }
.compteur.fantome.devant { color: var(--accent); }

/* ------------------------------------------------------------ drills */
.chrono-discret { color: #a9a6a0; font-variant-numeric: tabular-nums; min-width: 70px; text-align: right; }
.fantome-ligne { margin: 8px 0; font-size: 0.85rem; }
.fantome-barre { width: 260px; height: 6px; background: var(--ligne); border-radius: 3px; overflow: hidden; }
.fantome-barre > div { height: 100%; width: 0; background: #86b6ef; }
.fantome-barre.depasse > div { background: #a9a6a0; }
.drill-op { flex-direction: column; gap: 2px; }
.drill-op-ligne { display: flex; gap: 10px; align-items: baseline; }
.drill-operations.avec-doigte { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px 14px; }
.doigte { font-size: 0.78rem; color: var(--discret); padding-left: 36px; line-height: 1.45; }
.resultat-drill { font-size: 1.3rem; }

/* ------------------------------------------------------------ progression : graphiques */
.graphique { margin: 6px 0 4px; max-width: 760px; }
.titre-graphique { font-size: 0.85rem; color: var(--discret); margin-bottom: 4px; }
svg.calendrier { width: 100%; max-width: 360px; display: block; }
svg.calendrier .case-jour:hover { stroke: var(--texte); stroke-width: 1; }
svg .axe-texte { font-size: 9px; fill: #6b6f76; font-family: inherit; }
svg.courbe { width: 100%; display: block; }
svg.courbe .axe-texte { font-size: 11px; }
svg.courbe .grille { stroke: #ebe9e4; stroke-width: 1; }
svg.courbe .seuil { stroke: #b3b0aa; stroke-width: 1; stroke-dasharray: 4 4; }
svg.courbe .trace { fill: none; stroke: #2a78d6; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg.courbe .reticule { stroke: #b3b0aa; stroke-width: 1; }
svg.courbe .point { fill: #2a78d6; stroke: var(--surface); stroke-width: 2; }
.legende { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 0.8rem; color: var(--discret); margin-top: 6px; }
.pastille-legende { display: inline-block; width: 12px; height: 12px; border-radius: 2px; }
.pastille-legende.non-pratique { background: var(--surface); border: 1px dashed #b3b0aa; }
.infobulle {
  position: fixed; z-index: 50; display: none; pointer-events: none; max-width: 300px;
  background: var(--surface); color: var(--texte); border: 1px solid var(--ligne); border-radius: 6px;
  padding: 6px 9px; font-size: 0.82rem; box-shadow: 0 4px 14px #0002; line-height: 1.4;
}
table.carte-maitrise { width: auto; border-collapse: separate; border-spacing: 2px; background: none; }
table.carte-maitrise th { font-size: 0.75rem; text-align: center; padding: 2px 4px; border: none; }
table.carte-maitrise th.libelle { text-align: right; padding-right: 8px; white-space: nowrap; }
table.carte-maitrise td { width: 40px; height: 30px; text-align: center; padding: 0; border: none; border-radius: 4px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
table.carte-maitrise td.vide { background: none; cursor: default; }
table.carte-maitrise td.non-pratique { background: var(--surface); border: 1px dashed #b3b0aa; color: var(--discret); font-weight: 400; }
table.carte-maitrise td.pas-vu { opacity: 0.45; }
table.carte-maitrise td.geste:hover, table.carte-maitrise td.geste:focus { outline: 2px solid var(--texte); outline-offset: 1px; }
tr.cliquable { cursor: pointer; }
tr.cliquable:hover td { background: #f3f1ec; }
.grille-succes { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.succes { background: var(--surface); border: 1px dashed #c9c6bf; border-radius: 8px; padding: 8px 10px; font-size: 0.9rem; }
.succes.obtenu { border-style: solid; border-left: 3px solid var(--accent); }
h3 { font-size: 0.95rem; margin: 16px 0 8px; }

/* ------------------------------------------------------------ notifications */
.toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--texte); color: white; border-radius: 8px; padding: 10px 14px; max-width: 320px; font-size: 0.9rem; box-shadow: 0 6px 18px #0003; transition: opacity 0.4s, transform 0.4s; }
.toast.sortie { opacity: 0; transform: translateY(8px); }

/* ------------------------------------------------------------ division, dictée, sélection, sauvegarde */
.consigne-arrondi { font-size: 0.5em; font-weight: 400; color: var(--discret); }
.operation.compacte .consigne-arrondi { font-size: 0.75rem; }
.aide-division { margin: 10px 0; max-width: 820px; }
.aide-division .carte { font-size: 0.92rem; line-height: 1.6; }
.aide-etapes { margin: 8px 0 0; padding-left: 20px; }
.dictee-ecran { font-size: 3rem; }
.metronome { margin: 6px 0; font-size: 0.9rem; }
.zone-choix { margin-bottom: 14px; }
table.carte-maitrise.selection td.choisi { outline: 3px solid var(--texte); outline-offset: -3px; }
.pastille-legende.choisi-legende { background: var(--surface); outline: 2px solid var(--texte); outline-offset: -2px; }
.zone-import { width: 100%; min-height: 120px; margin: 8px 0; font: 0.8rem ui-monospace, monospace; }
table.carte-maitrise.selection td.choisi { opacity: 1; }

/* ------------------------------------------------------------ leçon 0, vitesse, placement, épreuves */
.carte.theorie { margin-bottom: 10px; }
.carte.theorie p { margin: 0; line-height: 1.6; }
.carte.vitesse { border-left: 3px solid var(--accent); margin: 10px 0; }
.carte.vitesse ul { margin: 6px 0 0; padding-left: 20px; line-height: 1.6; }
.conseil-vitesse { color: var(--discret); font-size: 0.9rem; margin-top: 16px; border-top: 1px solid var(--ligne); padding-top: 10px; }
.mode-espace { font-size: 0.85rem; color: var(--discret); margin-right: 12px; }
.flash-image { max-width: 260px; margin: 0 auto 10px; }
.flash-image svg.soroban { max-height: 160px; }
svg.soroban .zone-tige { cursor: pointer; }
svg.soroban .zone-tige:hover { fill: #2a78d61a; }
.zone-soroban.placement svg.soroban { max-height: 300px; }
.liste-grades { display: flex; flex-direction: column; gap: 8px; }
.carte.grade .icone { width: 16px; color: var(--accent); }
/* Tige désignée comme juste (placement) : visible même sans boule posée. */
svg.soroban .tige.ok .axe { stroke: var(--ok); stroke-width: 5; }
svg.soroban .tige.ok .boule:not(.active) { fill: #9fd3b0; }
</style>

50,pourquoi:"Rep\xE9rez le passage de la dizaine avant de bouger : si la tige ne peut pas absorber le chiffre, c'est le grand ami. Compl\xE9ment d'abord en addition, emprunt d'abord en soustraction.",demos:[{depart:876,op:"+",n:285},{depart:952,op:"-",n:663}]},{id:"p4-a",titre:"Anzan : grands amis (soustraction)",type:"anzan",cibles:Us(Ft),chiffres:1,lignes:5,duree:1.2,repetitions:20,testMin:8,pourquoi:"L'emprunt se voit sur la tige des dizaines avant d'ajouter le compl\xE9ment sur les unit\xE9s : m\xEAme ordre qu'au soroban.",demos:[]}]},{id:"p5",titre:"Combinaisons et r\xE9vision g\xE9n\xE9rale",sousPaliers:[{id:"p5-1",titre:"+6 \xE0 +9 combin\xE9s (grand ami + petit ami)",cibles:Is(Os),chiffres:1,lignes:5,repetitions:50,pourquoi:"Sur 5, ajouter 6 : grand ami, il faut retirer 4\u2026 mais aucune terrestre n'est pos\xE9e. Le \u22124 se fait par le petit ami (+1 \u22125). Geste complet : pouce +1, index rel\xE8ve la c\xE9leste, puis pouce +1 sur les dizaines.",demos:[{depart:5,op:"+",n:6},{depart:6,op:"+",n:8}]},{id:"p5-2",titre:"\u22126 \xE0 \u22129 combin\xE9s",cibles:Us(Os),chiffres:1,lignes:5,repetitions:50,pourquoi:"Sur 13, retirer 8 : on emprunte 1 dizaine, puis il faut ajouter 2 sur un 3 : pas assez de terrestres, petit ami +5 \u22123. Geste : index \u22121 sur les dizaines, index abaisse la c\xE9leste, index descend 3 terrestres.",demos:[{depart:13,op:"-",n:8},{depart:12,op:"-",n:6}]},{id:"p5-3",titre:"Combinaisons, 2 et 3 chiffres",cibles:Os,chiffres:2,lignes:5,repetitions:50,pourquoi:"Les combinaisons arrivent sur n'importe quelle tige. D\xE9composez calmement : grand ami d'abord, et son compl\xE9ment par le petit ami.",demos:[{depart:56,op:"+",n:67}]},{id:"p5-4",titre:"Retenues et emprunts en cascade",cibles:["cascade+","cascade-"],chiffres:2,lignes:4,repetitions:30,cumul:!0,pourquoi:"Une retenue qui tombe sur un 9 : ce 9 devient 0 (grand ami, \u22129) et la retenue continue plus \xE0 gauche. Un emprunt sur un 0 le transforme en 9 et continue. C'est la m\xEAme r\xE8gle, r\xE9p\xE9t\xE9e.",demos:[{depart:99,op:"+",n:1},{depart:100,op:"-",n:1},{depart:95,op:"+",n:17}]},{id:"p5-5",titre:"R\xE9vision g\xE9n\xE9rale, 3 chiffres",cibles:re,chiffres:3,lignes:5,repetitions:50,cumul:!0,pourquoi:"Tous les gestes sont permis : chaque tige choisit le sien. C'est le calcul courant.",demos:[{depart:478,op:"+",n:685}]},{id:"p5-a",titre:"Anzan : 2 chiffres",type:"anzan",cibles:re,chiffres:2,lignes:3,duree:2,repetitions:20,testMin:8,pourquoi:"Deux tiges dans la t\xEAte, de gauche \xE0 droite comme au soroban. Peu de nombres d'abord, on allonge ensuite dans le Flash anzan.",demos:[]}]},{id:"p6",titre:"Multiplication (\u4E21\u843D\u3068\u3057)",sousPaliers:[{id:"p6-a",titre:"1 \xD7 1 : un produit, deux tiges (\xAB 06 \xBB)",type:"table",repetitions:40,pourquoi:"En multiplication japonaise, chaque produit de la table occupe TOUJOURS deux tiges : la dizaine et l'unit\xE9. 7 \xD7 8 = \xAB 56 \xBB, mais 2 \xD7 3 = \xAB 06 \xBB : la tige des dizaines reste vide, et c'est elle qui garde le d\xE9calage juste pour la suite. Ici, tapez chaque produit sur deux chiffres (06, 00, 56) : c'est la convention \xE0 ancrer, et en m\xEAme temps un entra\xEEnement de vitesse sur la table.",demos:[{a:2,b:3},{a:7,b:8}]},{id:"p6-0",titre:"O\xF9 poser le premier produit ?",type:"placement",op:"mul",repetitions:40,pourquoi:"Avant de multiplier, il faut savoir O\xD9 commencer, sans r\xE9fl\xE9chir. R\xE8gle : comptez les chiffres des deux nombres (37 \xD7 85 : 2 + 2 = 4). La dizaine du premier produit se pose sur la 4e tige en comptant la tige des unit\xE9s comme la 1re. Cliquez la bonne tige le plus vite possible : ce r\xE9flexe doit devenir automatique, c'est lui qui \xE9vite les r\xE9sultats d\xE9cal\xE9s. L'index gauche se pose ensuite sur cette tige et la marque pendant tout le calcul.",demos:[]},{id:"p6-1",titre:"2 chiffres \xD7 1 chiffre",type:"mul",m:2,n:1,repetitions:30,pourquoi:"M\xE9thode japonaise actuelle, \u4E21\u843D\u3068\u3057 (\xAB les deux tombent \xBB) : on ne pose ni le multiplicande ni le multiplicateur, on les lit sur la feuille. On ne pose que les produits de la table, chacun sur DEUX tiges (dizaine, unit\xE9 ; 2 \xD7 3 s'\xE9crit \xAB 06 \xBB). On commence \xE0 gauche. Position du premier produit : 2 + 1 = 3 chiffres au total, donc sa dizaine va sur la 3e tige en partant des unit\xE9s. Chaque produit suivant se d\xE9cale d'une tige vers la droite.",demos:[{a:37,b:8},{a:23,b:3}]},{id:"p6-2",titre:"3 et 4 chiffres \xD7 1 chiffre",type:"mul",m:3,n:1,repetitions:30,pourquoi:"M\xEAme principe : 3 + 1 = 4 chiffres, donc premier produit sur la 4e tige (sa dizaine). Exemple 372 \xD7 8 : 24, puis 56 une tige plus \xE0 droite, puis 16.",demos:[{a:372,b:8}]},{id:"p6-3",titre:"2 chiffres \xD7 2 chiffres",type:"mul",m:2,n:2,repetitions:30,pourquoi:"Pour 37 \xD7 85 : 4 chiffres au total. On prend le 3 et on le multiplie par 8 puis par 5 (24, puis 15 une tige \xE0 droite) ; on passe au 7 : 7 \xD7 8 = 56 se pose l\xE0 o\xF9 commen\xE7ait le 15 (une tige \xE0 droite du 24), puis 7 \xD7 5 = 35.",demos:[{a:37,b:85}]},{id:"p6-4",titre:"3 chiffres \xD7 2 chiffres",type:"mul",m:3,n:2,repetitions:30,pourquoi:"5 chiffres au total : premier produit sur la 5e tige. Chaque chiffre du multiplicande commence une tige plus \xE0 droite que le pr\xE9c\xE9dent.",demos:[{a:246,b:37}]}]},{id:"p7",titre:"Division (\u7247\u843D\u3068\u3057)",sousPaliers:[{id:"p7-0",titre:"O\xF9 poser le premier chiffre du quotient ?",type:"placement",op:"div",repetitions:40,pourquoi:"Le dividende est pos\xE9 \xE0 droite. On compare son d\xE9but au diviseur : s'il est plus grand ou \xE9gal (156 \xF7 12 : 15 \u2265 12), le premier chiffre du quotient se pose DEUX tiges \xE0 gauche du premier chiffre du dividende ; s'il est plus petit (108 \xF7 12 : 10 < 12), JUSTE \xE0 gauche. Cliquez la bonne tige : ce r\xE9flexe doit \xEAtre imm\xE9diat. L'index gauche se pose ensuite sur cette tige.",demos:[]},{id:"p7-1",titre:"\xF7 1 chiffre, quotient 1 chiffre",type:"div",nd:1,nq:1,repetitions:30,pourquoi:"M\xE9thode \u7247\u843D\u3068\u3057 : on pose seulement le dividende ; le diviseur se lit sur la feuille. On compare le d\xE9but du dividende au diviseur : plus grand ou \xE9gal \u2192 le chiffre du quotient se pose DEUX tiges \xE0 gauche (une tige libre) ; plus petit \u2192 JUSTE \xE0 gauche. Puis on retire le produit (quotient \xD7 diviseur, sur deux tiges) juste \xE0 droite du quotient.",demos:[{a:14,b:2},{a:72,b:8}]},{id:"p7-2",titre:"\xF7 1 chiffre, quotient 2 et 3 chiffres",type:"div",nd:1,nq:2,repetitions:30,pourquoi:"On r\xE9p\xE8te pour chaque chiffre du quotient, avec le reste. L'unit\xE9 du quotient se trouve 2 tiges \xE0 gauche de l'unit\xE9 du dividende (1 chiffre au diviseur + 1).",demos:[{a:156,b:4}]},{id:"p7-e",titre:"Diviser par 2 chiffres : estimer et corriger",type:"div",nd:2,nq:1,repetitions:30,corrections:!0,pourquoi:"Personne ne conna\xEEt la table de 18 : on ESTIME. On arrondit le diviseur \xE0 sa dizaine (18 \u2192 20, 43 \u2192 40 ; on arrondit au-dessus d\xE8s que le 2e chiffre vaut 5 ou plus) et on divise le d\xE9but du dividende par ce nombre rond : 144 \xF7 20 \u2248 7. Puis on v\xE9rifie avec les vrais produits : 7 \xD7 1 = 7 et 7 \xD7 8 = 56, donc 7 \xD7 18 = 126, qui tient dans 144. On retire 126 : il reste 18, qui n'est pas plus petit que 18 \u2192 l'estimation \xE9tait trop petite : on ajoute 1 au quotient (8) et on retire encore 18. Si au contraire le produit ne tient pas (arrondi au-dessous : 112 \xF7 14, 14 \u2248 10 donne 11, on plafonne \xE0 9 ; 9 \xD7 14 = 126 > 112), on diminue de 1 de t\xEAte AVANT de poser. En cas de blocage pendant un exercice, le bouton \xAB Je suis bloqu\xE9 \xBB d\xE9roule ce raisonnement et affiche la table du diviseur.",demos:[{a:144,b:18},{a:112,b:14},{a:156,b:12}]},{id:"p7-3",titre:"\xF7 2 chiffres, quotient 1 chiffre",type:"div",nd:2,nq:1,repetitions:30,pourquoi:"On compare les deux premiers chiffres du dividende au diviseur entier. Le chiffre du quotient s'estime avec le premier chiffre du diviseur ; puis on retire quotient \xD7 chaque chiffre du diviseur, en d\xE9calant d'une tige. Si le produit ne peut pas \xEAtre retir\xE9, le chiffre \xE9tait trop grand : on le diminue de 1.",demos:[{a:108,b:12}]},{id:"p7-4",titre:"\xF7 2 chiffres, quotient 2 chiffres",type:"div",nd:2,nq:2,repetitions:30,pourquoi:"L'unit\xE9 du quotient est 3 tiges \xE0 gauche de l'unit\xE9 du dividende (2 chiffres au diviseur + 1).",demos:[{a:156,b:12}]}]},{id:"pd",titre:"D\xE9cimaux et arrondis",sousPaliers:[{id:"pd-1",titre:"Le point des unit\xE9s : additions et soustractions de d\xE9cimaux",type:"addsubdec",repetitions:30,pourquoi:"Les points de la barre servent de rep\xE8re : on choisit l'un d'eux comme tige des unit\xE9s, et TOUTES les virgules s'alignent dessus. Les d\xE9cimales se posent sur les tiges \xE0 sa droite (dixi\xE8mes, centi\xE8mes\u2026). Pour 12,5 + 3,075 : 12 avant le point, 5 sur la 1re tige apr\xE8s ; puis 3 sur les unit\xE9s, 0, 7, 5 sur les trois tiges suivantes. Rien d'autre ne change : m\xEAmes gestes, m\xEAmes amis.",demos:[]},{id:"pd-2",titre:"Placer un produit d\xE9cimal (compte des chiffres)",type:"placement",op:"muldec",repetitions:30,pourquoi:"La m\xE9thode la plus rapide ne place pas la virgule \xE0 la fin : elle pose le premier produit directement au bon endroit. On compte les chiffres de chaque facteur AVEC SIGNE : 37,2 compte 2 (chiffres avant la virgule), 0,85 compte 0, 0,04 compte \u22121 (un z\xE9ro juste apr\xE8s la virgule). On additionne : la dizaine du premier produit va sur la tige de ce rang (2 \u2192 2e tige avant la virgule ; 0 \u2192 1re tige apr\xE8s la virgule ; \u22121 \u2192 2e tige apr\xE8s). C'est la r\xE8gle \xAB m + n \xBB des entiers, prolong\xE9e.",demos:[]},{id:"pd-3",titre:"Multiplier des d\xE9cimaux",type:"muldec",repetitions:30,pourquoi:"Compte des chiffres, puis \u4E21\u843D\u3068\u3057 exactement comme avec des entiers. Le r\xE9sultat se lit directement par rapport au point des
