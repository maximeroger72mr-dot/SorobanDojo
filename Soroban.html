 puis \xE0 garder en t\xEAte.",sections:[["Le soroban","Pos\xE9 \xE0 plat, la barre horizontale devant vous, les boules c\xE9lestes en haut. Choisissez une tige marqu\xE9e d'un point, vers la droite, comme tige des unit\xE9s : tous les nombres s'alignent dessus. \xC0 l'\xE9cran, l'application montre moins de tiges que votre soroban (13, 17, 23 ou 27 selon les mod\xE8les) et place les unit\xE9s sur la tige la plus \xE0 droite : sur le v\xF4tre, gardez votre tige des unit\xE9s et alignez-vous dessus."],["La main gauche","Elle tient le bord gauche du soroban pour qu'il ne glisse pas, sans cacher les tiges. En multiplication et en division, son index sert de rep\xE8re : il marque la tige o\xF9 l'on travaille, pour ne jamais perdre sa place."],["La main droite et le crayon","Seuls le pouce et l'index bougent les boules : le pouce MONTE les terrestres ; l'index les DESCEND et man\u0153uvre la c\xE9leste dans les deux sens. Le crayon reste dans la main droite, serr\xE9 entre la paume et l'annulaire (ou l'auriculaire), pointe vers l'ext\xE9rieur : on \xE9crit le r\xE9sultat sans le reprendre et sans l\xE2cher le soroban."],["Gaucher ?","Inversez simplement les mains : la main gauche manipule (pouce et index, m\xEAmes r\xF4les), la main droite tient le bord droit et sert de rep\xE8re. Les r\xE8gles de calcul ne changent pas : on lit et on pose toujours les nombres de gauche \xE0 droite. Beaucoup de gauchers gardent toutefois la main droite pour les boules, comme on l'enseigne au Japon : essayez les deux une semaine, puis gardez la plus naturelle."],["Lire une colonne : nombre par nombre","Pour 300 + 156 + 228, on pose 300, puis on AJOUTE 156 en entier (1 aux centaines, 5 aux dizaines, 6 aux unit\xE9s, de gauche \xE0 droite), puis 228 de la m\xEAme fa\xE7on. On ne fait PAS colonne par colonne comme sur papier : le total est sur le soroban, il suffit d'ajouter chaque nombre tel qu'on le lit."],["Pourquoi de gauche \xE0 droite","On lit un nombre de gauche \xE0 droite : on le pose dans le m\xEAme ordre, sans rien retenir de t\xEAte. Les retenues tombent sur des tiges d\xE9j\xE0 trait\xE9es, elles s'ajoutent simplement."],["Remise \xE0 z\xE9ro","Inclinez le soroban vers vous (les terrestres tombent), reposez-le \xE0 plat, puis faites glisser l'index de gauche \xE0 droite le long de la barre pour \xE9carter les c\xE9lestes. Deux secondes."]],pourquoiCaMarche:[["La m\xE9moire de travail est petite","De t\xEAte, on ne garde qu'un petit nombre d'\xE9l\xE9ments \xE0 la fois (environ 4 selon les \xE9tudes de psychologie cognitive, avec de grandes diff\xE9rences entre personnes). Sur papier, retenues et chiffres interm\xE9diaires l'encombrent vite. Le soroban la d\xE9charge : le total est pos\xE9 sur les boules, la t\xEAte n'a rien \xE0 retenir \xE0 part le nombre qu'on lit."],["Pourquoi 5 et 4 boules","L'\u0153il reconna\xEEt d'un coup, sans compter, jusqu'\xE0 3 ou 4 objets (c'est la \xAB subitisation \xBB, bien \xE9tudi\xE9e en psychologie). Une tige se lit donc en un regard : la c\xE9leste (5 ou rien) plus un petit groupe de terrestres. C'est aussi pour cela qu'on lit les grands nombres par tranches de 3 chiffres."],["Du geste au r\xE9flexe","Au d\xE9but, chaque ami demande une r\xE9flexion (\xAB 4 = 5 \u2212 1 \xBB). Avec la r\xE9p\xE9tition, le cerveau transforme cette r\xE8gle en geste automatique, qui ne co\xFBte plus d'attention. D'o\xF9 les volumes d'entra\xEEnement, et la vitesse qui vient d'elle-m\xEAme : on ne peut pas aller vite tant qu'on r\xE9fl\xE9chit."],["Pourquoi les r\xE9visions espac\xE9es","Revoir une le\xE7on juste avant de l'oublier (apr\xE8s 1, 3, 7, 14, 30 jours) la fixe bien mieux que de la r\xE9p\xE9ter le m\xEAme jour. C'est le r\xF4le des r\xE9visions du jour."],["Pourquoi m\xE9langer ensuite","R\xE9p\xE9ter un geste en bloc l'installe vite ; le m\xE9langer ensuite avec les autres oblige \xE0 le CHOISIR, comme dans un vrai calcul. C'est ce qui le rend durable : d'o\xF9 les s\xE9ances de consolidation apr\xE8s chaque le\xE7on."],["Et la t\xEAte dans tout \xE7a ?","\xC0 force de manipuler, l'image du soroban s'installe dans la t\xEAte : c'est l'anzan. Le calcul mental des bons joueurs n'est pas un don, c'est ce soroban imaginaire, construit geste apr\xE8s geste."]],quiz:[{q:"Quel doigt fait MONTER les boules terrestres ?",choix:["Le pouce","L'index","Le majeur"],bonne:0,pourquoi:"Le pouce monte les terrestres ; l'index les descend et man\u0153uvre la c\xE9leste (\xAB La main droite et le crayon \xBB)."},{q:"Et l'index, que fait-il ?",choix:["Il descend les terrestres et man\u0153uvre la c\xE9leste","Il monte les terrestres","Il ne sert qu'\xE0 tenir le crayon"],bonne:0,pourquoi:"L'index DESCEND les terrestres et bouge la c\xE9leste dans les deux sens."},{q:"Quelle tige prendre comme tige des unit\xE9s ?",choix:["Une tige marqu\xE9e d'un point, vers la droite","La tige la plus \xE0 gauche","N'importe laquelle, elle change \xE0 chaque calcul"],bonne:0,pourquoi:"Une tige marqu\xE9e d'un point, vers la droite, toujours la m\xEAme : tous les nombres s'alignent dessus (\xAB Le soroban \xBB)."},{q:"Pour 300 + 156, comment pose-t-on 156 ?",choix:["En entier, de gauche \xE0 droite : 1, puis 5, puis 6","Colonne par colonne, en partant des unit\xE9s, comme sur papier","On calcule le total de t\xEAte, puis on le pose"],bonne:0,pourquoi:"Nombre par nombre, de gauche \xE0 droite : le total est sur le soroban, la t\xEAte n'a rien \xE0 retenir (\xAB Lire une colonne \xBB)."},{q:"\xC0 quoi sert la main gauche ?",choix:["Elle tient le bord du soroban et sert de rep\xE8re","Elle bouge les boules c\xE9lestes","Elle tient le crayon"],bonne:0,pourquoi:"Elle tient le soroban sans cacher les tiges, et son index marque la tige de travail en multiplication et en division."},{q:"Comment remettre le soroban \xE0 z\xE9ro ?",choix:["L'incliner vers soi, le reposer, puis glisser l'index le long de la barre","Le secouer","Repousser chaque boule une \xE0 une"],bonne:0,pourquoi:"Inclinez-le (les terrestres tombent), reposez-le, puis \xE9cartez les c\xE9lestes d'un gliss\xE9 de l'index : deux secondes."}],demos:[]},{id:"p0-2",titre:"Lire et poser un nombre",type:"lire",repetitions:30,sansRevision:!0,pourquoi:"C'est la base de tout : une erreur de lecture (c\xE9leste prise pour une terrestre, mauvaise tige des unit\xE9s) ressemble \xE0 une erreur de geste, et l'on retravaille alors ce qui n'est pas en cause.",regles:["Chaque tige porte un chiffre. De droite \xE0 gauche : unit\xE9s, dizaines, centaines\u2026","Seules les boules qui touchent la barre du milieu comptent.","La boule du haut (c\xE9leste) vaut 5 ; chacune des 4 boules du bas (terrestres) vaut 1.","Une tige sans boule contre la barre vaut 0.","Les nombres s'alignent sur la tige des unit\xE9s (marqu\xE9e d'un point) : on les pose de gauche \xE0 droite."],demos:[]}]},{id:"p1",titre:"Gestes directs",sousPaliers:[{id:"p1-1",titre:"Ajouter 1 \xE0 4",cibles:Te("+",[1,2,3,4],"direct"),chiffres:1,lignes:3,ops:["+"],repetitions:20,cumul:!0,pourquoi:"Ajouter, c'est faire monter des boules terrestres contre la barre, avec le POUCE, plac\xE9 sous les boules : un seul mouvement vers le haut. Condition : les boules n\xE9cessaires doivent \xEAtre libres (en bas).",demos:[{depart:0,op:"+",n:3},{depart:1,op:"+",n:3}]},{id:"p1-2",titre:"Retirer 1 \xE0 4",cibles:Te("-",[1,2,3,4],"direct"),chiffres:1,lignes:4,repetitions:20,cumul:!0,pourquoi:"Retirer, c'est \xE9loigner des boules terrestres de la barre avec l'INDEX, qui les pousse vers le bas. Pouce pour monter, index pour descendre : les deux doigts ne se g\xEAnent jamais.",demos:[{depart:4,op:"-",n:3},{depart:3,op:"-",n:2}]},{id:"p1-3",titre:"Le 5 et la pinc\xE9e (6 \xE0 9)",cibles:[...Te("+",[5,6,7,8,9],"direct"),...Te("-",[5,6,7,8,9],"direct")],chiffres:1,lignes:4,repetitions:20,cumul:!0,pourquoi:"La boule c\xE9leste vaut 5 et c'est toujours l'INDEX qui la man\u0153uvre. Pour 6 \xE0 9 (5 + 1 \u2026 5 + 4), on fait UN seul geste : l'index abaisse la c\xE9leste pendant que le pouce monte les terrestres, comme une pince. Pour retirer 6 \xE0 9, c'est l'index seul, en UN SEUL mouvement : il rel\xE8ve la c\xE9leste et descend les terrestres dans la m\xEAme trajectoire, sans s'arr\xEAter entre les deux.",demos:[{depart:2,op:"+",n:5},{depart:0,op:"+",n:7},{depart:9,op:"-",n:6}]},{id:"p1-4",titre:"Gestes directs \xE0 2 et 3 chiffres",cibles:hi,chiffres:2,lignes:4,repetitions:20,cumul:!0,pourquoi:"On calcule NOMBRE PAR NOMBRE et de GAUCHE \xC0 DROITE : pour 12 + 35, on pose 12, puis on ajoute 35 en entier, d'abord le 3 sur les dizaines, puis le 5 sur les unit\xE9s, dans l'ordre de lecture. Jamais colonne par colonne comme sur papier : le total courant est sur le soroban. Chaque tige se traite ind\xE9pendamment.",demos:[{depart:12,op:"+",n:35},{depart:87,op:"-",n:32}]}]},{id:"p2",titre:"Petits amis (compl\xE9ments \xE0 5)",sousPaliers:[{id:"p2-0",titre:"Les paires qui font 5",type:"complement",cible:5,repetitions:20,testNombre:20,testMin:19,testSecondes:60,sansRevision:!0,pourquoi:"Les petits amis reposent sur les paires qui font 5 : 1 et 4, 2 et 3. Au moment du geste, le compl\xE9ment doit venir tout seul, sinon la main s'arr\xEAte et l'on finit par calculer de t\xEAte.",demos:[]},{id:"p2-1",titre:"+4 et +3",cibles:Te("+",[4,3],"petit"),chiffres:1,lignes:5,repetitions:50,pourquoi:"Sur 3, ajouter 4 : il ne reste qu'une terrestre libre. Astuce : 4 = 5 \u2212 1. L'index abaisse la c\xE9leste (+5), puis descend 1 terrestre (\u22121). 1 et 4 sont \xAB petits amis \xBB (leur somme fait 5), de m\xEAme 2 et 3.",demos:[{depart:3,op:"+",n:4},{depart:2,op:"+",n:3}]},{id:"p2-2",titre:"+2 et +1",cibles:Te("+",[2,1],"petit"),chiffres:1,lignes:5,repetitions:50,pourquoi:"2 = 5 \u2212 3 et 1 = 5 \u2212 4. Sur 4, ajouter 1 : l'index abaisse la c\xE9leste et descend les 4 terrestres.",demos:[{depart:4,op:"+",n:1},{depart:3,op:"+",n:2}]},{id:"p2-3",titre:"Petits amis en addition, 2 et 3 chiffres",cibles:Te("+",[1,2,3,4],"petit"),chiffres:2,lignes:5,repetitions:50,pourquoi:"Le petit ami peut tomber sur n'importe quelle tige. Toujours de gauche \xE0 droite : chaque tige choisit son geste, direct ou petit ami.",demos:[{depart:34,op:"+",n:43}]},{id:"p2-4",titre:"\u22124 et \u22123",cibles:Te("-",[4,3],"petit"),chiffres:1,lignes:5,repetitions:50,pourquoi:"Sur 5, retirer 4 : aucune terrestre n'est contre la barre. \u22124 = +1 \u2212 5 : le pouce monte 1 terrestre, puis l'index rel\xE8ve la c\xE9leste. On ajoute d'abord le petit ami, puis on enl\xE8ve le 5.",demos:[{depart:5,op:"-",n:4},{depart:6,op:"-",n:3}]},{id:"p2-5",titre:"\u22122 et \u22121",cibles:Te("-",[2,1],"petit"),chiffres:1,lignes:5,repetitions:50,pourquoi:"\u22122 = +3 \u2212 5 et \u22121 = +4 \u2212 5. Sur 5, retirer 1 : le pouce monte les 4 terrestres, l'index rel\xE8ve la c\xE9leste.",demos:[{depart:5,op:"-",n:1},{depart:6,op:"-",n:2}]},{id:"p2-6",titre:"Petits amis en soustraction, 2 et 3 chiffres",cibles:Te("-",[1,2,3,4],"petit"),chiffres:2,lignes:5,repetitions:50,pourquoi:"M\xEAme geste sur chaque tige concern\xE9e, de gauche \xE0 droite.",demos:[{depart:65,op:"-",n:32}]},{id:"p2-7",titre:"Tous les petits amis, 3 chiffres",cibles:oa,chiffres:3,lignes:5,repetitions:50,pourquoi:"Additions et soustractions m\xE9lang\xE9es : si les boules manquent sur une tige, le petit ami s'impose. Avec la r\xE9p\xE9tition, le geste devient un r\xE9flexe associ\xE9 au chiffre.",demos:[{depart:342,op:"+",n:413}]}]},{id:"p3",titre:"Grands amis en addition (compl\xE9ments \xE0 10)",sousPaliers:[{id:"p3-0",titre:"Les paires qui font 10",type:"complement",cible:10,repetitions:20,testNombre:20,testMin:19,testSecondes:60,sansRevision:!0,pourquoi:"Les grands amis reposent sur les paires qui font 10 : 1 et 9, 2 et 8, 3 et 7, 4 et 6, 5 et 5. Si l'on h\xE9site (\xAB 10 \u2212 7, \xE7a fait\u2026 3 \xBB), la main s'arr\xEAte : automatisez-les avant le geste.",demos:[]},{id:"p3-1",titre:"+9 et +8",cibles:Te("+",[9,8],"grand"),chiffres:1,lignes:5,repetitions:50,pourquoi:"Sur 3, ajouter 9 donnerait 12 : impossible sur une tige. 9 = 10 \u2212 1 : on retire 1 sur les unit\xE9s, puis on ajoute 1 sur les dizaines (la retenue). 9 et 1 sont \xAB grands amis \xBB (leur somme fait 10). Ordre standard : d'abord le compl\xE9ment, ensuite la retenue.",demos:[{depart:3,op:"+",n:9},{depart:4,op:"+",n:8}]},{id:"p3-2",titre:"+7 et +6",cibles:Te("+",[7,6],"grand"),chiffres:1,lignes:5,repetitions:50,pourquoi:"7 = 10 \u2212 3 et 6 = 10 \u2212 4. Sur 8, ajouter 7 : l'index descend 3 terrestres, puis le pouce monte 1 terrestre sur les dizaines.",demos:[{depart:8,op:"+",n:7},{depart:4,op:"+",n:6}]},{id:"p3-3",titre:"+5 \xE0 +1",cibles:Te("+",[5,4,3,2,1],"grand"),chiffres:1,lignes:5,repetitions:50,pourquoi:"5 = 10 \u2212 5, 4 = 10 \u2212 6 \u2026 1 = 10 \u2212 9. Le compl\xE9ment \xE0 retirer contient la c\xE9leste : l'index la rel\xE8ve (et descend les terrestres d'un m\xEAme geste), puis la retenue.",demos:[{depart:7,op:"+",n:5},{depart:8,op:"+",n:4},{depart:9,op:"+",n:1}]},{id:"p3-4",titre:"Grands amis en addition, 2 et 3 chiffres",cibles:pi(yr),chiffres:2,lignes:5,repetitions:50,pourquoi:"La retenue tombe sur la tige de gauche, d\xE9j\xE0 calcul\xE9e : c'est pour cela qu'on travaille de gauche \xE0 droite, la retenue s'ajoute simplement.",demos:[{depart:39,op:"+",n:85}]}]},{id:"p4",titre:"Grands amis en soustraction",sousPaliers:[{id:"p4-1",titre:"\u22129 et \u22128",cibles:Te("-",[9,8],"grand"),chiffres:1,lignes:5,repetitions:50,pourquoi:"Sur 12, retirer 9 : les unit\xE9s ne valent que 2. \u22129 = \u221210 + 1 : on retire d'abord 1 sur les dizaines (l'emprunt), puis on ajoute 1 sur les unit\xE9s. En soustraction, l'ordre s'inverse : l'emprunt d'abord, le compl\xE9ment ensuite.",demos:[{depart:12,op:"-",n:9},{depart:11,op:"-",n:8}]},{id:"p4-2",titre:"\u22127 et \u22126",cibles:Te("-",[7,6],"grand"),chiffres:1,lignes:5,repetitions:50,pourquoi:"\u22127 = \u221210 + 3 et \u22126 = \u221210 + 4. Sur 15, retirer 7 : l'index retire 1 dizaine, puis le pouce monte 3 terrestres sur les unit\xE9s.",demos:[{depart:15,op:"-",n:7},{depart:10,op:"-",n:6}]},{id:"p4-3",titre:"\u22125 \xE0 \u22121",cibles:Te("-",[5,4,3,2,1],"grand"),chiffres:1,lignes:5,repetitions:50,pourquoi:"\u22125 = \u221210 + 5 \u2026 \u22121 = \u221210 + 9. On emprunte 1 dizaine, puis on ajoute le grand compl\xE9ment (c\xE9leste, ou pinc\xE9e c\xE9leste + terrestres).",demos:[{depart:13,op:"-",n:5},{depart:10,op:"-",n:1}]},{id:"p4-4",titre:"Grands amis en soustraction, 2 et 3 chiffres",cibles:di(yr),chiffres:2,lignes:5,repetitions:50,pourquoi:"L'emprunt se prend sur la tige de gauche, d\xE9j\xE0 calcul\xE9e. Toujours de gauche \xE0 droite.",demos:[{depart:95,op:"-",n:17}]},{id:"p4-5",titre:"Tous les grands amis, 3 chiffres",cibles:yr,chiffres:3,lignes:5,repetitions:50,pourquoi:"Rep\xE9rez le passage de la dizaine avant de bouger : si la tige ne peut pas absorber le chiffre, c'est le grand ami. Compl\xE9ment d'abord en addition, emprunt d'abord en soustraction.",demos:[{depart:876,op:"+",n:285},{depart:952,op:"-",n:663}]}]},{id:"p5",titre:"Combinaisons et r\xE9vision g\xE9n\xE9rale",sousPaliers:[{id:"p5-1",titre:"+6 \xE0 +9 combin\xE9s (grand ami + petit ami)",cibles:pi(ci),chiffres:1,lignes:5,repetitions:50,pourquoi:"Sur 5, ajouter 6 : grand ami, il faut retirer 4\u2026 mais aucune terrestre n'est pos\xE9e. Le \u22124 se fait par le petit ami (+1 \u22125). Geste complet : pouce +1, index rel\xE8ve la c\xE9leste, puis pouce +1 sur les dizaines.",demos:[{depart:5,op:"+",n:6},{depart:6,op:"+",n:8}]},{id:"p5-2",titre:"\u22126 \xE0 \u22129 combin\xE9s",cibles:di(ci),chiffres:1,lignes:5,repetitions:50,pourquoi:"Sur 13, retirer 8 : on emprunte 1 dizaine, puis il faut ajouter 2 sur un 3 : pas assez de terrestres, petit ami +5 \u22123. Geste : index \u22121 sur les dizaines, index abaisse la c\xE9leste, index descend 3 terrestres.",demos:[{depart:13,op:"-",n:8},{depart:12,op:"-",n:6}]},{id:"p5-3",titre:"Combinaisons, 2 et 3 chiffres",cibles:ci,chiffres:2,lignes:5,repetitions:50,pourquoi:"Les combinaisons arrivent sur n'importe quelle tige. D\xE9composez calmement : grand ami d'abord, et son compl\xE9ment par le petit ami.",demos:[{depart:56,op:"+",n:67}]},{id:"p5-4",titre:"Retenues et emprunts en cascade",cibles:["cascade+","cascade-"],chiffres:2,lignes:4,repetitions:30,cumul:!0,pourquoi:"Une retenue qui tombe sur un 9 : ce 9 devient 0 (grand ami, \u22129) et la retenue continue plus \xE0 gauche. Un emprunt sur un 0 le transforme en 9 et continue. C'est la m\xEAme r\xE8gle, r\xE9p\xE9t\xE9e.",demos:[{depart:99,op:"+",n:1},{depart:100,op:"-",n:1},{depart:95,op:"+",n:17}]},{id:"p5-5",titre:"R\xE9vision g\xE9n\xE9rale, 3 chiffres",cibles:ve,chiffres:3,lignes:5,repetitions:50,cumul:!0,pourquoi:"Tous les gestes sont permis : chaque tige choisit le sien. C'est le calcul courant.",demos:[{depart:478,op:"+",n:685}]}]},{id:"p6",titre:"Multiplication (\u4E21\u843D\u3068\u3057)",sousPaliers:[{id:"p6-a",titre:"1 \xD7 1 : un produit, deux tiges (\xAB 06 \xBB)",type:"table",repetitions:40,pourquoi:"En multiplication japonaise, chaque produit de la table occupe TOUJOURS deux tiges : la dizaine et l'unit\xE9. 7 \xD7 8 = \xAB 56 \xBB, mais 2 \xD7 3 = \xAB 06 \xBB : la tige des dizaines reste vide, et c'est elle qui garde le d\xE9calage juste pour la suite. Ici, tapez chaque produit sur deux chiffres (06, 00, 56) : c'est la convention \xE0 ancrer, et en m\xEAme temps un entra\xEEnement de vitesse sur la table.",demos:[{a:2,b:3},{a:7,b:8}]},{id:"p6-0",titre:"O\xF9 poser le premier produit ?",type:"placement",op:"mul",repetitions:40,pourquoi:"Avant de multiplier, il faut savoir O\xD9 commencer, sans r\xE9fl\xE9chir. R\xE8gle : comptez les chiffres des deux nombres (37 \xD7 85 : 2 + 2 = 4). La dizaine du premier produit se pose sur la 4e tige en comptant la tige des unit\xE9s comme la 1re. Cliquez la bonne tige le plus vite possible : ce r\xE9flexe doit devenir automatique, c'est lui qui \xE9vite les r\xE9sultats d\xE9cal\xE9s. L'index gauche se pose ensuite sur cette tige et la marque pendant tout le calcul.",demos:[]},{id:"p6-1",titre:"2 chiffres \xD7 1 chiffre",type:"mul",m:2,n:1,repetitions:30,pourquoi:"M\xE9thode japonaise actuelle, \u4E21\u843D\u3068\u3057 (\xAB les deux tombent \xBB) : on ne pose ni le multiplicande ni le multiplicateur, on les lit sur la feuille. On ne pose que les produits de la table, chacun sur DEUX tiges (dizaine, unit\xE9 ; 2 \xD7 3 s'\xE9crit \xAB 06 \xBB). On commence \xE0 gauche. Position du premier produit : 2 + 1 = 3 chiffres au total, donc sa dizaine va sur la 3e tige en partant des unit\xE9s. Chaque produit suivant se d\xE9cale d'une tige vers la droite.",demos:[{a:37,b:8},{a:23,b:3}]},{id:"p6-2",titre:"3 et 4 chiffres \xD7 1 chiffre",type:"mul",m:3,n:1,repetitions:30,pourquoi:"M\xEAme principe : 3 + 1 = 4 chiffres, donc premier produit sur la 4e tige (sa dizaine). Exemple 372 \xD7 8 : 24, puis 56 une tige plus \xE0 droite, puis 16.",demos:[{a:372,b:8}]},{id:"p6-3",titre:"2 chiffres \xD7 2 chiffres",type:"mul",m:2,n:2,repetitions:30,pourquoi:"Pour 37 \xD7 85 : 4 chiffres au total. On prend le 3 et on le multiplie par 8 puis par 5 (24, puis 15 une tige \xE0 droite) ; on passe au 7 : 7 \xD7 8 = 56 se pose l\xE0 o\xF9 commen\xE7ait le 15 (une tige \xE0 droite du 24), puis 7 \xD7 5 = 35.",demos:[{a:37,b:85}]},{id:"p6-4",titre:"3 chiffres \xD7 2 chiffres",type:"mul",m:3,n:2,repetitions:30,pourquoi:"5 chiffres au total : premier produit sur la 5e tige. Chaque chiffre du multiplicande commence une tige plus \xE0 droite que le pr\xE9c\xE9dent.",demos:[{a:246,b:37}]}]},{id:"p7",titre:"Division (\u7247\u843D\u3068\u3057)",sousPaliers:[{id:"p7-0",titre:"O\xF9 poser le premier chiffre du quotient ?",type:"placement",op:"div",repetitions:40,pourquoi:"Le dividende est pos\xE9 \xE0 droite. On compare son d\xE9but au diviseur : s'il est plus grand ou \xE9gal (156 \xF7 12 : 15 \u2265 12), le premier chiffre du quotient se pose DEUX tiges \xE0 gauche du premier chiffre du dividende ; s'il est plus petit (108 \xF7 12 : 10 < 12), JUSTE \xE0 gauche. Cliquez la bonne tige : ce r\xE9flexe doit \xEAtre imm\xE9diat. L'index gauche se pose ensuite sur cette tige.",demos:[]},{id:"p7-1",titre:"\xF7 1 chiffre, quotient 1 chiffre",type:"div",nd:1,nq:1,repetitions:30,pourquoi:"M\xE9thode \u7247\u843D\u3068\u3057 : on pose seulement le dividende ; le diviseur se lit sur la feuille. On compare le d\xE9but du dividende au diviseur : plus grand ou \xE9gal \u2192 le chiffre du quotient se pose DEUX tiges \xE0 gauche (une tige libre) ; plus petit \u2192 JUSTE \xE0 gauche. Puis on retire le produit (quotient \xD7 diviseur, sur deux tiges) juste \xE0 droite du quotient.",demos:[{a:14,b:2},{a:72,b:8}]},{id:"p7-2",titre:"\xF7 1 chiffre, quotient 2 et 3 chiffres",type:"div",nd:1,nq:2,repetitions:30,pourquoi:"On r\xE9p\xE8te pour chaque chiffre du quotient, avec le reste. L'unit\xE9 du quotient se trouve 2 tiges \xE0 gauche de l'unit\xE9 du dividende (1 chiffre au diviseur + 1).",demos:[{a:156,b:4}]},{id:"p7-e",titre:"Diviser par 2 chiffres : estimer et corriger",type:"div",nd:2,nq:1,repetitions:30,corrections:!0,pourquoi:"Personne ne conna\xEEt la table de 18 : on ESTIME. On arrondit le diviseur \xE0 sa dizaine (18 \u2192 20, 43 \u2192 40 ; on arrondit au-dessus d\xE8s que le 2e chiffre vaut 5 ou plus) et on divise le d\xE9but du dividende par ce nombre rond : 144 \xF7 20 \u2248 7. Puis on v\xE9rifie avec les vrais produits : 7 \xD7 1 = 7 et 7 \xD7 8 = 56, donc 7 \xD7 18 = 126, qui tient dans 144. On retire 126 : il reste 18, qui n'est pas plus petit que 18 \u2192 l'estimation \xE9tait trop petite : on ajoute 1 au quotient (8) et on retire encore 18. Si au contraire le produit ne tient pas (arrondi au-dessous : 112 \xF7 14, 14 \u2248 10 donne 11, on plafonne \xE0 9 ; 9 \xD7 14 = 126 > 112), on diminue de 1 de t\xEAte AVANT de poser. En cas de blocage pendant un exercice, le bouton \xAB Je suis bloqu\xE9 \xBB d\xE9roule ce raisonnement et affiche la table du diviseur.",demos:[{a:144,b:18},{a:112,b:14},{a:156,b:12}]},{id:"p7-3",titre:"\xF7 2 chiffres, quotient 1 chiffre",type:"div",nd:2,nq:1,repetitions:30,pourquoi:"On compare les deux premiers chiffres du dividende au diviseur entier. Le chiffre du quotient s'estime exactement comme \xE0 la le\xE7on pr\xE9c\xE9dente : diviseur arrondi \xE0 sa dizaine (12 \u2192 10, 18 \u2192 20), puis v\xE9rification avec le vrai produit. On retire ensuite quotient \xD7 chaque chiffre du diviseur, en d\xE9calant d'une tige. Si le produit ne peut pas \xEAtre retir\xE9, le chiffre \xE9tait trop grand : on le diminue de 1 ; s'il reste au moins le diviseur, il \xE9tait trop petit : on ajoute 1.",demos:[{a:108,b:12}]},{id:"p7-4",titre:"\xF7 2 chiffres, quotient 2 chiffres",type:"div",nd:2,nq:2,repetitions:30,pourquoi:"L'unit\xE9 du quotient est 3 tiges \xE0 gauche de l'unit\xE9 du dividende (2 chiffres au diviseur + 1).",demos:[{a:156,b:12}]}]},{id:"pd",titre:"D\xE9cimaux et arrondis",sousPaliers:[{id:"pd-1",titre:"Le point des unit\xE9s : additions et soustractions de d\xE9cimaux",type:"addsubdec",repetitions:30,pourquoi:"Les points de la barre servent de rep\xE8re : on choisit l'un d'eux comme tige des unit\xE9s, et TOUTES les virgules s'alignent dessus. Les d\xE9cimales se posent sur les tiges \xE0 sa droite (dixi\xE8mes, centi\xE8mes\u2026). Pour 12,5 + 3,075 : 12 avant le point, 5 sur la 1re tige apr\xE8s ; puis 3 sur les unit\xE9s, 0, 7, 5 sur les trois tiges suivantes. Rien d'autre ne change : m\xEAmes gestes, m\xEAmes amis.",demos:[]},{id:"pd-2",titre:"Placer un produit d\xE9cimal (compte des chiffres)",type:"placement",op:"muldec",repetitions:30,pourquoi:"La m\xE9thode la plus rapide ne place pas la virgule \xE0 la fin : elle pose le premier produit directement au bon endroit. On compte les chiffres de chaque facteur AVEC SIGNE : 37,2 compte 2 (chiffres avant la virgule), 0,85 compte 0, 0,04 compte \u22121 (un z\xE9ro juste apr\xE8s la virgule). On additionne : la dizaine du premier produit va sur la tige de ce rang (2 \u2192 2e tige avant la virgule ; 0 \u2192 1re tige apr\xE8s la virgule ; \u22121 \u2192 2e tige apr\xE8s). C'est la r\xE8gle \xAB m + n \xBB des entiers, prolong\xE9e.",demos:[]},{id:"pd-3",titre:"Multiplier des d\xE9cimaux",type:"muldec",repetitions:30,pourquoi:"Compte des chiffres, puis \u4E21\u843D\u3068\u3057 exactement comme avec des entiers. Le r\xE9sultat se lit directement par rapport au point des unit\xE9s. V\xE9rification rapide : le nombre de d\xE9cimales du r\xE9sultat est la somme de celles des facteurs.",demos:[]},{id:"pd-4",titre:"Diviser des d\xE9cimaux",type:"divdec",repetitions:30,pourquoi:"Le quotient a q chiffres avant la virgule, avec q = compte(dividende) \u2212 compte(diviseur), plus 1 si le d\xE9but du dividende est plus grand ou \xE9gal au diviseur (le m\xEAme test que pour poser le premier chiffre). Exemple : 1,56 \xF7 0,12 : 1 \u2212 0 + 1 = 2 chiffres \u2192 13. On divise comme d'habitude, et on lit le quotient avec ce compte.",demos:[]},{id:"pd-5",titre:"Arrondir au milli\xE8me",type:"divarrondi",repetitions:30,pourquoi:"Pour arrondir au milli\xE8me, on calcule UNE d\xE9cimale de plus (la 4e), puis on arrondit. Astuce rapide au soroban : on ajoute 5 sur la tige de cette 4e d\xE9cimale ; si elle valait 5 ou plus, la retenue monte toute seule sur le milli\xE8me. On lit ensuite jusqu'au milli\xE8me, sans rien effacer.",demos:[]}]},{id:"p8",titre:"Vers le 5e et le 4e ky\u016B",sousPaliers:[{id:"p8-t1",titre:"Transition : 3 chiffres, 6 \xE0 7 lignes",cibles:ve,chiffres:3,lignes:6,lignesMax:7,repetitions:30,cumul:!0,pourquoi:"Avant les 10 lignes : des colonnes un peu plus longues, avec des nombres que vous connaissez d\xE9j\xE0. Gardez le m\xEAme rythme d'un bout \xE0 l'autre de la colonne.",demos:[{depart:472,op:"+",n:358}]},{id:"p8-t2",titre:"Transition : 4 chiffres, 6 \xE0 7 lignes",cibles:ve,chiffres:4,lignes:6,lignesMax:7,repetitions:30,cumul:!0,pourquoi:"Le 4e chiffre ajoute une tranche : rep\xE9rez les milliers avec le point de la barre, lisez le nombre d'un bloc, posez-le de gauche \xE0 droite.",demos:[{depart:4721,op:"+",n:3586}]},{id:"p8-1",titre:"Additions et soustractions \xE0 4 chiffres, 10 lignes",cibles:ve,chiffres:4,lignes:10,repetitions:30,cumul:!0,pourquoi:"Le format des examens : 10 lignes, 4 chiffres. La difficult\xE9 n'est plus le geste mais la lecture et le rythme : lisez chaque nombre d'un bloc, posez-le de gauche \xE0 droite, et lisez d\xE9j\xE0 le suivant.",demos:[{depart:4721,op:"+",n:3586}]},{id:"p8-2",titre:"Z\xE9ros internes",cibles:ve,chiffres:4,lignes:8,repetitions:30,cumul:!0,zeros:!0,pourquoi:"Un z\xE9ro au milieu d'un nombre (3 058, 7 040) est le pi\xE8ge n\xB0 1 : on saute une tige de trop ou de moins, et tout le reste est d\xE9cal\xE9. Le z\xE9ro ne se pose pas, mais il se COMPTE : dites-le int\xE9rieurement (\xAB trois, z\xE9ro, cinq, huit \xBB) et faites avancer le doigt d'une tige.",demos:[{depart:3058,op:"+",n:4070}]},{id:"p8-3",titre:"5 et 6 chiffres, 10 lignes (endurance)",cibles:ve,chiffres:5,chiffresMax:6,lignes:10,repetitions:20,cumul:!0,pourquoi:"Endurance : 10 lignes de 5 ou 6 chiffres sans perdre le rythme. Rep\xE9rez les tranches de 3 chiffres avec les points de la barre.",demos:[{depart:52708,op:"+",n:39415}]},{id:"p8-4",titre:"Multiplication avec des z\xE9ros (406 \xD7 7)",type:"mul",m:3,n:1,mMax:4,zeros:!0,repetitions:30,pourquoi:"Avec \u4E21\u843D\u3068\u3057, un z\xE9ro dans un facteur donne un produit \xAB 00 \xBB : on ne pose rien, MAIS on avance d'une tige. Pour 406 \xD7 7 : 4 \xD7 7 = 28, puis 0 \xD7 7 = 00 (rien, on avance), puis 6 \xD7 7 = 42.",demos:[{a:406,b:7},{a:37,b:208}]},{id:"p8-5",titre:"Multiplication 3 \xD7 3 et 4 \xD7 3 chiffres",type:"mul",m:3,n:3,mMax:4,repetitions:30,pourquoi:"M\xEAme m\xE9thode, plus de produits : 6 chiffres au total pour 3 \xD7 3, donc premier produit sur la 6e tige. L'index gauche avance d'une tige \xE0 chaque chiffre du multiplicande ; les produits du m\xEAme chiffre glissent d'une tige chacun.",demos:[{a:246,b:375}]},{id:"p8-6",titre:"Division : quotient avec un z\xE9ro (304)",type:"div",nd:1,nq:3,ndMax:2,zeros:!0,repetitions:30,pourquoi:"Quand le reste est plus petit que le diviseur, le chiffre du quotient est 0 : la tige reste vide MAIS elle compte, le chiffre suivant se pose une tige plus \xE0 droite. Ne \xAB tassez \xBB jamais le quotient.",demos:[{a:2128,b:7},{a:3672,b:12}]},{id:"p8-7",titre:"Division par 3 chiffres",type:"div",nd:3,nq:2,repetitions:30,corrections:!0,pourquoi:"M\xEAme estimation qu'avec 2 chiffres : on arrondit le diviseur sur son premier chiffre (243 \u2192 200, 268 \u2192 300), on estime, puis on corrige de \xB11 si besoin. On compare les 3 premiers chiffres du dividende au diviseur pour savoir o\xF9 poser le quotient.",demos:[{a:5832,b:243}]},{id:"p8-n",titre:"R\xE9sultats n\xE9gatifs : le compl\xE9ment (facultatif)",type:"negatif",chiffres:2,lignes:4,repetitions:20,optionnel:!0,pourquoi:"Quand une soustraction \xAB d\xE9passe \xBB (il faut retirer plus que ce qui est pos\xE9), on emprunte un 1 IMAGINAIRE sur la tige \xE0 gauche de la colonne (100 pour une colonne \xE0 2 chiffres) et on continue normalement. \xC0 la fin, le soroban affiche le COMPL\xC9MENT du r\xE9sultat : s'il affiche 63 apr\xE8s un emprunt de 100, le r\xE9sultat est \u2212(100 \u2212 63) = \u221237. Lecture rapide : compl\xE9ment \xE0 9 de chaque chiffre, \xE0 10 pour le dernier (63 \u2192 3 et 7 \u2192 \u221237). Si le calcul repasse au-dessus de z\xE9ro, la retenue rend le 1 emprunt\xE9. Tapez le r\xE9sultat avec le signe moins.",demos:[]}]},{id:"pa",titre:"Anzan et visualisation (piste parall\xE8le)",mental:!0,sousPaliers:[{id:"pa-0",titre:"Le cours : voir le soroban dans sa t\xEAte",type:"theorie",apres:"p1-4",repetitions:0,pourquoi:"L'anzan, c'est calculer avec un soroban imaginaire. Ce n'est pas du calcul mental \xAB avec des mots \xBB : on VOIT les boules bouger. Cette piste avance \xE0 son rythme, en parall\xE8le des le\xE7ons sur le vrai soroban, et toujours un peu en retard sur elles : on n'imagine bien que des gestes d\xE9j\xE0 automatiques.",sections:[["Les \xE9tapes","1. Prendre la \xAB photo \xBB d'un soroban : le voir une seconde et lire le nombre. 2. Tenir une image : poser un nombre sur le soroban imaginaire et le garder net. 3. Calculer avec une image d'aide qui s'estompe peu \xE0 peu. 4. Calculer de t\xEAte, en allongeant la cha\xEEne de nombres, puis en acc\xE9l\xE9rant."],["Toujours le m\xEAme soroban","Imaginez VOTRE soroban, avec sa couleur, la taille de ses boules et sa barre. Toujours le m\xEAme : l'image se renforce \xE0 chaque s\xE9ance. Ne visualisez que les tiges utiles (une ou deux au d\xE9but), pas tout le cadre."],["Garder l'image du TOTAL","Le nombre lu ne sert qu'\xE0 d\xE9clencher un geste, puis on l'oublie. Ce qu'on garde en t\xEAte, c'est l'\xE9tat du soroban : le total. \xC0 la fin, on ne calcule rien, on LIT le soroban imaginaire."],["Les doigts dans l'air","\xC0 chaque nombre, faites le geste avec le pouce et l'index, comme sur le vrai soroban. Au d\xE9but, c'est le mouvement des doigts qui \xAB porte \xBB l'image. Les doigts s'effacent d'eux-m\xEAmes beaucoup plus tard."],["Pas de phrase int\xE9rieure","Ne vous dites pas \xAB 4 plus 3 \xE9gale 7 \xBB : on voit la c\xE9leste descendre et deux terrestres s'en aller. Si une voix int\xE9rieure compte, ralentissez jusqu'\xE0 voir les boules."],["Les yeux","En mitori-anzan (colonne affich\xE9e), fermer les yeux un instant entre deux nombres aide au d\xE9but. En flash, regardez le nombre, puis l'image int\xE9rieure."],["Quand l'image se brouille","On r\xE9duit le NOMBRE de nombres, pas la vitesse : mieux vaut 3 nombres nets que 5 flous. Quand on est perdu, on ne devine pas : on le note faux et on recommence. L'application allonge la cha\xEEne quand vous r\xE9ussissez, et la raccourcit apr\xE8s une erreur."],["Peu, mais tous les jours","5 minutes d'anzan chaque jour valent mieux que 20 minutes une fois par semaine. L'image se construit par la r\xE9p\xE9tition, entre les s\xE9ances."]],pourquoiCaMarche:[["Une image plut\xF4t que des mots","Garder \xAB 47 \xBB en mots occupe la m\xE9moire de travail, d\xE9j\xE0 petite. Une image de soroban se garde mieux : c'est une forme, pas une suite de sons. C'est pourquoi on \xE9vite la voix int\xE9rieure."],["Les doigts aident la t\xEAte","D'apr\xE8s l'imagerie c\xE9r\xE9brale, les zones qui commandent un geste s'activent en partie quand on l'imagine. Bouger les doigts dans l'air relie l'image au geste appris sur le vrai soroban."],["Pourquoi aller lentement","Si l'image se brouille, on s'entra\xEEne \xE0\u2026 deviner. Mieux vaut des cha\xEEnes courtes et nettes : la longueur vient ensuite, puis la vitesse."]],quiz:[{q:"Pendant un calcul de t\xEAte, que garde-t-on en t\xEAte ?",choix:["L'image du soroban, avec le total","La liste des nombres lus","La phrase \xAB 4 plus 3 \xE9gale 7 \xBB"],bonne:0,pourquoi:"Le nombre lu d\xE9clenche un geste, puis on l'oublie : on garde l'\xE9tat du soroban, le total (\xAB Garder l'image du TOTAL \xBB)."},{q:"L'image se brouille : que faire ?",choix:["R\xE9duire le nombre de nombres","Aller plus vite pour finir avant d'oublier","Deviner le r\xE9sultat"],bonne:0,pourquoi:"On r\xE9duit le NOMBRE de nombres, pas la vitesse : 3 nombres nets valent mieux que 5 flous."},{q:"Et les doigts ?",choix:["On fait le geste dans l'air, comme sur le vrai soroban","On les garde immobiles","On compte sur ses doigts"],bonne:0,pourquoi:"Au d\xE9but, c'est le mouvement des doigts qui porte l'image (\xAB Les doigts dans l'air \xBB)."},{q:"Quel soroban imaginer ?",choix:["Toujours le m\xEAme : le v\xF4tre","Un nouveau \xE0 chaque s\xE9ance","Peu importe"],bonne:0,pourquoi:"Toujours le m\xEAme : l'image se renforce \xE0 chaque s\xE9ance."}],demos:[]},{id:"pa-1",titre:"Photo du soroban : 1 tige",type:"photo",apres:"p1-4",chiffres:1,duree:1.5,repetitions:20,pourquoi:"Un soroban s'affiche un court instant : tapez le nombre qu'il montrait. Ne comptez pas les boules une \xE0 une  (+6 \xE0 +9) : l'index abaisse la c\xE9leste PENDANT que le pouce monte les terrestres. Un seul mouvement, les deux doigts se referment ensemble.","Retrait de 6 \xE0 9 : l'index fait tout en UN SEUL mouvement : il rel\xE8ve la c\xE9leste et descend les terrestres dans la m\xEAme trajectoire. Pas deux gestes s\xE9par\xE9s."],kp={p2:["Petit ami : les deux temps s'encha\xEEnent sans pause : c\xE9leste puis terrestres, dans la foul\xE9e, comme un seul geste.","Ne r\xE9citez pas la formule (\xAB 4 = 5 \u2212 1 \xBB) : regardez la tige, le geste doit partir seul. La formule ne sert qu'au d\xE9but."],p3:["Grand ami en addition : le compl\xE9ment d'abord, puis la retenue, sans rel\xE2cher la main : le pouce glisse simplement d'une tige vers la gauche.","Quand le compl\xE9ment vaut 6 \xE0 9 (pour +4 \xE0 +1 : +4 = \u22126 + 10), le \u22126 se fait en UN SEUL mouvement de l'index (c\xE9leste relev\xE9e et terrestres descendues ensemble), puis la retenue."],p4:["Grand ami en soustraction : l'emprunt d'abord (index sur la tige de gauche), puis le compl\xE9ment, d'un encha\xEEnement continu.","Quand le compl\xE9ment vaut 6 \xE0 9 (pour \u22124 \xE0 \u22121 : \u22124 = \u221210 + 6), le +6 se fait en PINC\xC9E : l'index abaisse la c\xE9leste pendant que le pouce monte les terrestres, un seul mouvement."],p5:["Combinaisons : trois temps (compl\xE9ment par petit ami, puis retenue) mais un seul mouvement de main qui \xAB roule \xBB de droite \xE0 gauche. Entra\xEEnez-le lentement, puis acc\xE9l\xE9rez.","Cascade (99 + 1) : la main balaie les 9 de droite \xE0 gauche d'un mouvement continu."],p6:["Lisez les deux facteurs une seule fois, puis ne regardez plus la feuille : r\xE9citez int\xE9rieurement les produits (\xAB 24, 15\u2026 \xBB).","L'index gauche marque la tige o\xF9 commence le produit en cours : la main droite pose, la gauche guide. On ne cherche jamais sa place.","Chaque produit sur DEUX tiges, m\xEAme \xAB 06 \xBB ou \xAB 00 \xBB : avancer d'une tige est un r\xE9flexe, ja
