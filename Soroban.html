<!DOCTYPE html>

<style>/* Style minimaliste : fond clair, un seul accent, rien d'inutile. */
:root {
  --fond: #f6f5f2;
  --surface: #ffffff;
  --texte: #1f2328;
  --discret: #6b6f76;
  --ligne: #e1dfda;
  --accent: #2f6fdf;
  --ok: #2e8b57;
  --erreur: #d1352b;
  --bois: #3b3530;
  --boule: #7a6b60;
  --boule-active: #2a231e;
  font-size: 16px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, "Segoe UI", system-ui, Roboto, sans-serif;
  background: var(--fond);
  color: var(--texte);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ------------------------------------------------------------ navigation */
#navigation {
  width: 210px;
  flex-shrink: 0;
  padding: 18px 10px;
  border-right: 1px solid var(--ligne);
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow-y: auto;
}
#navigation .titre-app { font-weight: 700; font-size: 1.15rem; padding: 0 10px 14px; }
#navigation button {
  text-align: left; background: none; border: none; padding: 8px 10px; border-radius: 6px;
  font: inherit; color: var(--texte); cursor: pointer;
}
#navigation button:hover { background: #ebe9e4; }
#navigation button.actif { background: var(--texte); color: white; }
#navigation button:disabled { color: #a9acb2; cursor: default; background: none; }
#navigation .bientot { font-size: 0.75rem; margin-left: 4px; }

main { flex: 1; overflow-y: auto; padding: 28px 36px 48px; }
/* Écran de travail centré : une colonne de 920 px au plus, au milieu de la zone. */
.contenu { max-width: 920px; margin: 0 auto; }

h1 { font-size: 1.5rem; margin: 0 0 6px; }
h2 { font-size: 1.1rem; margin: 24px 0 8px; }
p { line-height: 1.5; margin: 6px 0; }
.discret { color: var(--discret); }

/* ------------------------------------------------------------ contrôles */
button.btn {
  font: inherit; padding: 8px 16px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--ligne); background: var(--surface); color: var(--texte);
}
button.btn:hover { border-color: #c9c6bf; }
button.btn.principal { background: var(--accent); border-color: var(--accent); color: white; }
button.btn:disabled { opacity: 0.45; cursor: default; }
kbd {
  font: 0.75rem ui-monospace, monospace; border: 1px solid var(--ligne); border-bottom-width: 2px;
  border-radius: 4px; padding: 0 4px; background: var(--surface); color: var(--discret);
}

.reglages {
  display: flex; flex-wrap: wrap; gap: 18px; align-items: center;
  padding: 10px 0 14px; border-bottom: 1px solid var(--ligne); margin-bottom: 18px;
}
.reglages label { display: flex; gap: 6px; align-items: center; color: var(--discret); }
select, input[type="number"], input[type="text"] {
  font: inherit; padding: 6px 8px; border: 1px solid var(--ligne); border-radius: 6px; background: var(--surface);
}

.segments { display: inline-flex; border: 1px solid var(--ligne); border-radius: 6px; overflow: hidden; }
.segments button { font: inherit; border: none; background: var(--surface); padding: 6px 14px; cursor: pointer; }
.segments button + button { border-left: 1px solid var(--ligne); }
.segments button.actif { background: var(--texte); color: white; }

.carte { background: var(--surface); border: 1px solid var(--ligne); border-radius: 8px; padding: 16px 18px; }
details.carte summary { cursor: pointer; font-weight: 600; }
details.carte ul { margin: 10px 0 0; padding-left: 20px; line-height: 1.6; }

.ligne { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ------------------------------------------------------------ exercice */
.consigne { font-size: 1.05rem; margin: 6px 0 12px; min-height: 1.5em; }
.nombre-cible { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
.compteur { color: var(--discret); font-variant-numeric: tabular-nums; }
.saisie-nombre { font-size: 1.6rem; width: 220px; font-variant-numeric: tabular-nums; }
.retour { min-height: 3.2em; margin-top: 12px; line-height: 1.5; }
.retour.ok { color: var(--ok); font-weight: 600; }
.retour.erreur { color: var(--erreur); }
.retour .detail { color: var(--texte); font-weight: normal; }

.bilan { font-size: 1.1rem; }
.bilan .grand { font-size: 2rem; font-weight: 700; }

/* ------------------------------------------------------------ soroban */
.zone-soroban { margin: 8px 0; }
svg.soroban { width: 100%; max-height: 360px; display: block; user-select: none; touch-action: none; }
svg.soroban .cadre { fill: var(--bois); }
svg.soroban .fond { fill: #efece6; }
svg.soroban .axe { stroke: #9c958c; stroke-width: 2; }
svg.soroban .barre { fill: var(--bois); }
svg.soroban .repere { fill: #f6f5f2; }
svg.soroban .boule {
  fill: var(--boule); stroke: #00000030; stroke-width: 1;
  transition: transform 110ms ease-out, fill 120ms;
}
svg.soroban.interactif .boule { cursor: pointer; }
svg.soroban.interactif .boule:hover { stroke: var(--accent); stroke-width: 2; }
svg.soroban .boule.active { fill: var(--boule-active); }
svg.soroban .boule.bouge { fill: var(--accent) !important; }
svg.soroban .tige.erreur .boule { fill: var(--erreur); }
svg.soroban .tige.ok .boule.active { fill: var(--ok); }
svg.soroban .tige.cible .axe { stroke: var(--accent); stroke-width: 3; }
svg.soroban .etiquette, svg.soroban .valeur-tige { font-size: 12px; fill: var(--discret); display: none; }
svg.soroban .valeur-tige { font-size: 14px; font-weight: 600; fill: var(--texte); }
svg.soroban.avec-etiquettes .etiquette, svg.soroban.avec-valeurs .valeur-tige { display: block; }
svg.soroban .doigt { font-size: 12px; font-weight: 600; fill: var(--accent); }

/* Démonstration : liste des étapes */
.etapes { list-style: none; padding: 0; margin: 10px 0 0; }
.etapes li { padding: 6px 10px; border-left: 3px solid transparent; color: var(--discret); line-height: 1.45; }
.etapes li.courante { border-left-color: var(--accent); color: var(--texte); background: var(--surface); }
.etapes li.annonce { font-style: italic; }
.etapes .regle {
  display: inline-block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em;
  padding: 1px 6px; border-radius: 4px; background: #ebe9e4; margin-right: 6px; font-style: normal;
}

/* ------------------------------------------------------------ accueil / progression */
.grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 16px; }
.grille .carte { cursor: pointer; }
.grille .carte:hover { border-color: #c9c6bf; }
.grille .carte.indisponible { cursor: default; opacity: 0.55; }
.grille .carte h3 { margin: 0 0 4px; font-size: 1rem; }
.grille .carte p { margin: 0; color: var(--discret); font-size: 0.92rem; }
.suggestion { border-left: 3px solid var(--accent); }

table { border-collapse: collapse; width: 100%; background: var(--surface); }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--ligne); font-variant-numeric: tabular-nums; }
th { font-weight: 600; color: var(--discret); font-size: 0.9rem; }

/* ------------------------------------------------------------ leçons, séances, planches */
button.lien { background: none; border: none; color: var(--accent); font: inherit; cursor: pointer; padding: 0 0 8px; }
.pastille {
  display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px;
  background: var(--erreur); color: white; font-size: 0.75rem; text-align: center; line-height: 18px;
}
.liste-paliers { display: flex; flex-direction: column; gap: 4px; }
.ligne-palier {
  display: flex; align-items: center; gap: 12px; text-align: left; font: inherit; color: var(--texte);
  background: var(--surface); border: 1px solid var(--ligne); border-radius: 6px; padding: 9px 12px; cursor: pointer;
}
.ligne-palier:hover:not(:disabled) { border-color: #c9c6bf; }
.ligne-palier:disabled { opacity: 0.45; cursor: default; }
.ligne-palier .icone { width: 16px; text-align: center; color: var(--accent); }
.ligne-palier.valide .icone { color: var(--ok); }
.ligne-palier .titre { flex: 1; }
.ligne-palier .statut { color: var(--discret); font-size: 0.9rem; }
.pourquoi { line-height: 1.55; border-left: 3px solid var(--accent); }

.enonce { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 4px 0 8px; min-height: 1.3em; }
.enonce .fait { color: var(--discret); font-weight: 600; }
.enonce .courant { color: var(--accent); text-decoration: underline; text-underline-offset: 6px; }

.bandeau { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
.jauge { width: 220px; height: 8px; background: var(--ligne); border-radius: 4px; overflow: hidden; }
.jauge > div { height: 100%; background: var(--accent); transition: width 200ms; }

.diagnostic {
  margin-top: 14px; padding: 12px 16px; border-radius: 8px; background: #fff8ec; border: 1px solid #f0d9ae;
  border-left: 4px solid #e39b21; display: flex; flex-direction: column; gap: 10px;
}
.diag-motif { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; line-height: 1.45; }

.disposition-colonne { display: flex; gap: 24px; align-items: flex-start; }
table.planche { width: auto; min-width: 150px; font-size: 1.6rem; font-weight: 600; background: none; }
table.planche td { padding: 2px 10px; border: none; text-align: right; }
table.planche td.num { font-size: 0.8rem; color: var(--discret); font-weight: normal; }
table.planche td.signe { width: 20px; text-align: center; }
table.planche tr.fait { color: #b3b0aa; }
table.planche tr.courant { color: var(--accent); background: #eaf0fc; }
.chrono { margin-right: 14px; }
td.a-retravailler { color: var(--erreur); font-weight: 600; }

dialog.dialogue {
  border: none; border-radius: 10px; padding: 20px 24px; width: min(900px, 92vw); max-height: 92vh;
  box-shadow: 0 10px 40px #0004; background: var(--fond); color: var(--texte);
}
dialog.dialogue::backdrop { background: #0005; }
.panneau-demo svg.soroban, .seance svg.soroban { max-height: 280px; }

/* ------------------------------------------------------------ énoncés à calculer sur son soroban */
table.colonne { width: auto; background: none; font-size: 2rem; font-weight: 600; font-variant-numeric: tabular-nums; margin: 6px 0 12px; }
table.colonne td { border: none; padding: 1px 8px; text-align: right; }
table.colonne td.signe { width: 24px; text-align: center; color: var(--discret); }
table.colonne td.num { font-size: 0.75rem; color: var(--discret); font-weight: normal; }
table.colonne td.sous-total { font-size: 0.55em; color: var(--accent); font-weight: 500; text-align: left; }
table.colonne tr.cliquable { cursor: pointer; }
table.colonne tr.cliquable:hover { background: #eaf0fc; }
table.colonne td.jouer { font-size: 0.5em; color: var(--accent); }
table.colonne.compacte { font-size: 1.15rem; margin: 4px 0; }
table.colonne.compacte td { padding: 0 4px; }
.operation { font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 10px 0 14px; }
.operation.compacte { font-size: 1.15rem; margin: 4px 0; }
.grand-signe { font-size: 1.5rem; font-weight: 700; }
.pastilles { display: flex; flex-wrap: wrap; gap: 3px; min-height: 22px; }
.pastille-res { width: 22px; height: 22px; border-radius: 4px; font-size: 0.8rem; display: inline-flex; align-items: center; justify-content: center; color: white; }
.pastille-res.ok { background: var(--ok); }
.pastille-res.ko { background: var(--erreur); }
.serie .saisie-nombre { width: 260px; }
.etapes li.sous { padding-left: 26px; }
.etapes li.annonce { font-style: normal; font-weight: 600; color: var(--texte); }
.btn.ok-btn { border-color: var(--ok); color: var(--ok); }
.btn.ko-btn { border-color: var(--erreur); color: var(--erreur); }
.liste-erreurs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.erreur-item .detail { font-size: 0.9rem; }

/* ------------------------------------------------------------ feuilles (planches, épreuves) */
.barre-feuille {
  position: sticky; top: -28px; z-index: 2; display: flex; gap: 10px; align-items: center;
  background: var(--fond); padding: 10px 0; border-bottom: 1px solid var(--ligne); margin-bottom: 12px;
}
.chrono-feuille { font-variant-numeric: tabular-nums; color: var(--discret); }
.chrono-feuille.urgent { color: var(--erreur); font-weight: 700; }
.grille-feuille { display: grid; gap: 10px; }
.grille-feuille.colonnes { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
.grille-feuille.operations { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.probleme { background: var(--surface); border: 1px solid var(--ligne); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.probleme .num-probleme { align-self: flex-start; font-size: 0.75rem; color: var(--discret); }
.probleme input { width: 100%; font: inherit; font-size: 1.05rem; text-align: right; padding: 4px 6px; border: 1px solid var(--ligne); border-radius: 4px; font-variant-numeric: tabular-nums; }
.probleme.ok { border-color: var(--ok); box-shadow: inset 4px 0 0 var(--ok); }
.probleme.ko { border-color: var(--erreur); box-shadow: inset 4px 0 0 var(--erreur); }
.probleme .correction { align-self: stretch; font-size: 0.85rem; text-align: right; }
.section-feuille + .section-feuille { margin-top: 18px; }
.corrige-impression { display: none; }

/* ------------------------------------------------------------ drills, flash anzan */
.drill-operations { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 2px 14px; margin: 12px 0; font-variant-numeric: tabular-nums; }
.drill-op { display: flex; gap: 10px; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-size: 1.1rem; }
.drill-op:hover { background: #eaf0fc; }
.drill-op .num { width: 26px; color: var(--discret); font-size: 0.8rem; }
.drill-op .sous-total { color: var(--accent); margin-left: auto; font-size: 0.95rem; }
.flash-ecran {
  height: 220px; display: flex; align-items: center; justify-content: center; margin: 14px 0;
  background: var(--surface); border: 1px solid var(--ligne); border-radius: 10px;
  font-size: 6rem; font-weight: 700; font-variant-numeric: tabular-nums;
}
.flash-ecran.decompte { color: var(--discret); font-size: 3rem; }

/* ------------------------------------------------------------ impression : la feuille seule, corrigé sur une autre page */
@media print {
  body { display: block; height: auto; overflow: visible; background: white; }
  #navigation, .reglages, .lien, button, .chrono-feuille, .bilan, .contenu > h1, .contenu > p, .contenu > details, .contenu > .carte { display: none !important; }
  main { padding: 0; overflow: visible; }
  .contenu { max-width: none; }
  .barre-feuille { position: static; border: none; }
  .probleme { break-inside: avoid; border-color: #999; }
  .probleme input { border: none; border-bottom: 1px solid #333; border-radius: 0; color: transparent; }
  .probleme.ok, .probleme.ko { box-shadow: none; }
  .probleme .correction { display: none; }
  .corrige-impression { display: block; break-before: page; }
  .corrige-impression ol { columns: 4; font-variant-numeric: tabular-nums; }
}

/* ------------------------------------------------------------ niveaux d'acquisition et chronomètre */
.niveau { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; white-space: nowrap; font-weight: 600; }
.niveau-decouverte { background: #eeece8; color: #52514e; }




.ligne-palier .niveau { margin-left: 6px; }
.disposition-enonce { display: flex; gap: 32px; align-items: flex-start; max-width: 720px; }
.chrono-exercice { margin: 10px 0 0 auto; text-align: right; min-width: 130px; }
.chrono-exercice .temps { font-size: 1rem; font-variant-numeric: tabular-nums; color: #a9a6a0; }
.chrono-exercice .objectif { font-size: 0.75rem; color: #a9a6a0; line-height: 1.3; }
.objectif.tenu { color: var(--ok); font-weight: 600; }
.localisation { margin-top: 6px; color: var(--texte); }
.avis { border-left: 3px solid #e39b21; margin-bottom: 12px; }

/* ------------------------------------------------------------ menu en sections */
#navigation .section-menu { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--discret); padding: 14px 10px 4px; }
#navigation .separateur-menu { border: none; border-top: 1px solid var(--ligne); margin: 12px 10px 8px; }

/* ------------------------------------------------------------ séance du jour, tuiles */
.tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 12px 0 16px; }
.tuile { background: var(--surface); border: 1px solid var(--ligne); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.tuile-titre { font-size: 0.8rem; color: var(--discret); display: flex; align-items: center; gap: 6px; }
.tuile-titre select { font-size: 0.8rem; padding: 2px 4px; }
.tuile-valeur { font-size: 1.4rem; font-weight: 700; }
.tuile .jauge { width: 100%; }
.plan { line-height: 1.8; margin: 10px 0 0; }
.bilan-seance { border-left: 3px solid var(--accent); margin-bottom: 14px; }
.bilan-seance ul { padding-left: 18px; line-height: 1.7; }
.compteur.fantome { color: #a9a6a0; margin-right: 12px; }
.compteur.fantome.devant { color: var(--accent); }

/* ------------------------------------------------------------ drills */
.chrono-discret { color: #a9a6a0; font-variant-numeric: tabular-nums; min-width: 70px; text-align: right; }
.fantome-ligne { margin: 8px 0; font-size: 0.85rem; }
.fantome-barre { width: 260px; height: 6px; background: var(--ligne); border-radius: 3px; overflow: hidden; }
.fantome-barre > div { height: 100%; width: 0; background: #86b6ef; }
.fantome-barre.depasse > div { background: #a9a6a0; }
.drill-op { flex-direction: column; gap: 2px; }
.drill-op-ligne { display: flex; gap: 10px; align-items: baseline; }
.drill-operations.avec-doigte { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px 14px; }
.doigte { font-size: 0.78rem; color: var(--discret); padding-left: 36px; line-height: 1.45; }
.resultat-drill { font-size: 1.3rem; }

/* ------------------------------------------------------------ progression : graphiques */
.graphique { margin: 6px 0 4px; max-width: 760px; }
.titre-graphique { font-size: 0.85rem; color: var(--discret); margin-bottom: 4px; }
svg.calendrier { width: 100%; max-width: 360px; display: block; }
svg.calendrier .case-jour:hover { stroke: var(--texte); stroke-width: 1; }
svg .axe-texte { font-size: 9px; fill: #6b6f76; font-family: inherit; }
svg.courbe { width: 100%; display: block; }
svg.courbe .axe-texte { font-size: 11px; }
svg.courbe .grille { stroke: #ebe9e4; stroke-width: 1; }
svg.courbe .seuil { stroke: #b3b0aa; stroke-width: 1; stroke-dasharray: 4 4; }

.legende { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 0.8rem; color: var(--discret); margin-top: 6px; }
.pastille-legende { display: inline-block; width: 12px; height: 12px; border-radius: 2px; }
.pastille-legende.non-pratique { background: var(--surface); border: 1px dashed #b3b0aa; }
.infobulle {
  position: fixed; z-index: 50; display: none; pointer-events: none; max-width: 300px;
  background: var(--surface); color: var(--texte); border: 1px solid var(--ligne); border-radius: 6px;
  padding: 6px 9px; font-size: 0.82rem; box-shadow: 0 4px 14px #0002; line-height: 1.4;
}
table.carte-maitrise { width: auto; border-collapse: separate; border-spacing: 2px; background: none; }
table.carte-maitrise th { font-size: 0.75rem; text-align: center; padding: 2px 4px; border: none; }
table.carte-maitrise th.libelle { text-align: right; padding-right: 8px; white-space: nowrap; }

table.carte-maitrise td.non-pratique { background: var(--surface); border: 1px dashed #b3b0aa; color: var(--discret); font-weight: 400; }
table.carte-maitrise td.pas-vu { opacity: 0.45; }
table.carte-maitrise td.geste:hover, table.carte-maitrise td.geste:focus { outline: 2px solid var(--texte); outline-offset: 1px; }
tr.cliquable { cursor: pointer; }

.grille-succes { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.succes { background: var(--surface); border: 1px dashed #c9c6bf; border-radius: 8px; padding: 8px 10px; font-size: 0.9rem; }
.succes.obtenu { border-style: solid; border-left: 3px solid var(--accent); }
h3 { font-size: 0.95rem; margin: 16px 0 8px; }

/* ------------------------------------------------------------ notifications */
.toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--texte); color: white; border-radius: 8px; padding: 10px 14px; max-width: 320px; font-size: 0.9rem; box-shadow: 0 6px 18px #0003; transition: opacity 0.4s, transform 0.4s; }
.toast.sortie { opacity: 0; transform: translateY(8px); }

/* ------------------------------------------------------------ division, dictée, sélection, sauvegarde */
.consigne-arrondi { font-size: 0.5em; font-weight: 400; color: var(--discret); }
.operation.compacte .consigne-arrondi { font-size: 0.75rem; }
.aide-division { margin: 10px 0; max-width: 820px; }
.aide-division .carte { font-size: 0.92rem; line-height: 1.6; }
.aide-etapes { margin: 8px 0 0; padding-left: 20px; }
.dictee-ecran { font-size: 3rem; }
.metronome { margin: 6px 0; font-size: 0.9rem; }
.zone-choix { margin-bottom: 14px; }
table.carte-maitrise.selection td.choisi { outline: 3px solid var(--texte); outline-offset: -3px; }
.pastille-legende.choisi-legende { background: var(--surface); outline: 2px solid var(--texte); outline-offset: -2px; }
.zone-import { width: 100%; min-height: 120px; margin: 8px 0; font: 0.8rem ui-monospace, monospace; }
table.carte-maitrise.selection td.choisi { opacity: 1; }

/* ------------------------------------------------------------ leçon 0, vitesse, placement, épreuves */
.carte.theorie { margin-bottom: 10px; }
.carte.theorie p { margin: 0; line-height: 1.6; }
.carte.vitesse { border-left: 3px solid var(--accent); margin: 10px 0; }
.carte.vitesse ul { margin: 6px 0 0; padding-left: 20px; line-height: 1.6; }
.conseil-vitesse { color: var(--discret); font-size: 0.9rem; margin-top: 16px; border-top: 1px solid var(--ligne); padding-top: 10px; }
.mode-espace { font-size: 0.85rem; color: var(--discret); margin-right: 12px; }
.flash-image { max-width: 260px; margin: 0 auto 10px; }
.flash-image svg.soroban { max-height: 160px; }
.flash-ecran { min-width: 260px; }
.flash-ecran .flash-image { margin: 0; }
.flash-ecran .flash-image svg.soroban { max-height: 190px; }
.photo-soroban { max-width: 220px; margin: 6px 0; }
.photo-soroban svg.soroban { max-height: 170px; }
.photo-soroban.compacte svg.soroban { max-height: 110px; }
svg.soroban .zone-tige { cursor: pointer; }
svg.soroban .zone-tige:hover { fill: #2a78d61a; }
.zone-soroban.placement svg.soroban { max-height: 300px; }
.liste-grades { display: flex; flex-direction: column; gap: 8px; }
.carte.grade .icone { width: 16px; color: var(--accent); }
/* Tige désignée comme juste (placement) : visible même sans boule posée. */
svg.soroban .tige.ok .axe { stroke: var(--ok); stroke-width: 5; }
svg.soroban .tige.ok .boule:not(.active) { fill: #9fd3b0; }

/* ------------------------------------------------------------ course contre le fantôme */
.course { display: flex; flex-direction: column; gap: 4px; margin: 6px 0 10px; max-width: 420px; }
.course-ligne { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--discret); }
.course-nom { width: 130px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.course-piste { flex: 1; height: 7px; background: var(--ligne); border-radius: 4px; overflow: hidden; }
.course-remplissage { height: 100%; width: 0; border-radius: 4px; transition: width 0.1s linear; }
.course-remplissage.vous { background: #256abf; }
.course-remplissage.fantome { background: #a9a6a0; }
.ecart { font-variant-numeric: tabular-nums; }
.ecart.avance { color: var(--ok); }
.ecart.retard { color: var(--erreur); }
.medaille { font-weight: 700; }
.medaille.or { color: #a87b00; }
.medaille.argent { color: #6b6f76; }
.medaille.bronze { color: #8a5a2b; }

/* ------------------------------------------------------------ rappel doigté dans les colonnes */
.colonne td.doigte { font-size: 0.72rem; color: var(--discret); padding-left: 12px; white-space: nowrap; text-align: left; }

/* ------------------------------------------------------------ marathon et lièvre */
.ruban-entete { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px; }
.ruban-consigne { font-size: 0.85rem; color: var(--discret); margin: 4px 0 8px; }
.lievre tr { transition: opacity 0.15s; }
.lievre tr.avenir { opacity: 0; }
.lievre tr.suivante { opacity: 0.55; }
.lievre tr.courante td { background: #dbe8fb; }
.lievre tr.passee { opacity: 0; }
.jauge-arcade { height: 12px; background: var(--ligne); border-radius: 6px; overflow: hidden; margin: 8px 0; }
.jauge-arcade > div { height: 100%; background: #256abf; transition: width 0.1s linear; }
.jauge-arcade.alerte > div { background: var(--erreur); }
.jauge-arcade.flash { outline: 2px solid var(--erreur); }
.etoiles { font-size: 1.3rem; letter-spacing: 2px; }
.etoile-vide { color: var(--ligne); }
.etoile-pleine { color: #a87b00; }

.ligne-palier.priorite { border-left: 3px solid var(--accent); }
.plan li.priorite { color: var(--accent); }
details.carte.objectif { margin: 12px 0; }
.avertissement { color: #9a5b00; }
.quotidien { font-size: 1.15rem; line-height: 1.6; }
.quotidien .ticket { font-variant-numeric: tabular-nums; border-left: 2px dashed var(--ligne); padding-left: 12px; margin: 6px 0; }
.quotidien .ticket div { display: flex; justify-content: space-between; gap: 24px; max-width: 280px; }
.quotidien.compacte { font-size: 0.9rem; }
.consigne-situation { font-size: 0.95rem; color: var(--discret); margin-bottom: 6px; }
.quotidien .ticket { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 1.05rem; background: var(--surface); border: 1px solid var(--ligne); border-left: 2px dashed var(--ligne); padding: 10px 14px; max-width: 340px; }
.quotidien .ticket div { max-width: none; }
.quotidien .ticket .ticket-total { border-top: 1px dashed var(--discret); margin-top: 6px; padding-top: 6px; font-weight: 700; }
.quotidien .ticket .sous-total { color: var(--discret); font-size: 0.85em; }
.colonne td.relance { font-size: 0.72rem; color: var(--discret); padding-left: 10px; font-style: italic; }
/* ------------------------------------------------------------ classement : bronze, argent, or, platine */
.badge-classement { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 10px; margin-right: 6px; white-space: nowrap; }
.badge-classement.bronze, .niveau-progres { background: #c98a52; color: #1d1208; }
.badge-classement.argent, .niveau-debutant { background: #c3c8cf; color: #15181c; }
.badge-classement.or, .niveau-confirme { background: #e2b33c; color: #1d1604; }
.badge-classement.platine, .niveau-expert { background: #7a4fd0; color: #ffffff; }
.classement-objectifs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
</style>
</head>

[["Le soroban","Pos\xE9 \xE0 plat, la barre horizontale devant vous, les boules c\xE9lestes en haut. Choisissez une tige marqu\xE9e d'un point, vers la droite, comme tige des unit\xE9s : tous les nombres s'alignent dessus."],["La main gauche","Elle tient le bord gauche du soroban pour qu'il ne glisse pas, sans cacher les tiges. En multiplication et en division, son index sert de rep\xE8re : il marque la tige o\xF9 l'on travaille, pour ne jamais perdre sa place."],["La main droite et le crayon","Seuls le pouce et l'index bougent les boules : le pouce MONTE les terrestres ; l'index les DESCEND et man\u0153uvre la c\xE9leste dans les deux sens. Le crayon reste dans la main droite, serr\xE9 entre la paume et l'annulaire (ou l'auriculaire), pointe vers l'ext\xE9rieur : on \xE9crit le r\xE9sultat sans le reprendre et sans l\xE2cher le soroban."],["Lire une colonne : nombre par nombre","Pour 300 + 156 + 228, on pose 300, puis on AJOUTE 156 en entier (1 aux centaines, 5 aux dizaines, 6 aux unit\xE9s, de gauche \xE0 droite), puis 228 de la m\xEAme fa\xE7on. On ne fait PAS colonne par colonne comme sur papier : le total est sur le soroban, il suffit d'ajouter chaque nombre tel qu'on le lit."],["Pourquoi de gauche \xE0 droite","On lit un nombre de gauche \xE0 droite : on le pose dans le m\xEAme ordre, sans rien retenir de t\xEAte. Les retenues tombent sur des tiges d\xE9j\xE0 trait\xE9es, elles s'ajoutent simplement."],["Remise \xE0 z\xE9ro","Inclinez le soroban vers vous (les terrestres tombent), reposez-le \xE0 plat, puis faites glisser l'index de gauche \xE0 droite le long de la barre pour \xE9carter les c\xE9lestes. Deux secondes."]],pourquoiCaMarche:[["La m\xE9moire de travail est petite","De t\xEAte, on ne garde que 4 \xE9l\xE9ments environ \xE0 la fois. Sur papier, retenues et chiffres interm\xE9diaires l'encombrent vite. Le soroban la d\xE9charge : le total est pos\xE9 sur les boules, la t\xEAte n'a rien \xE0 retenir \xE0 part le nombre qu'on lit."],["Pourquoi 5 et 4 boules","L'\u0153il reconna\xEEt d'un coup, sans compter, jusqu'\xE0 4 objets. Une tige se lit donc en un regard : la c\xE9leste (5 ou rien) plus un petit groupe de terrestres. C'est aussi pour cela qu'on lit les grands nombres par tranches de 3 chiffres."],["Du geste au r\xE9flexe","Au d\xE9but, chaque ami demande une r\xE9flexion (\xAB 4 = 5 \u2212 1 \xBB). Avec la r\xE9p\xE9tition, le cerveau transforme cette r\xE8gle en geste automatique, qui ne co\xFBte plus d'attention. D'o\xF9 les volumes d'entra\xEEnement, et la vitesse qui vient d'elle-m\xEAme : on ne peut pas aller vite tant qu'on r\xE9fl\xE9chit."],["Pourquoi les r\xE9visions espac\xE9es","Revoir une le\xE7on juste avant de l'oublier (apr\xE8s 1, 3, 7, 14, 30 jours) la fixe bien mieux que de la r\xE9p\xE9ter le m\xEAme jour. C'est le r\xF4le des r\xE9visions du jour."],["Pourquoi m\xE9langer ensuite","R\xE9p\xE9ter un geste en bloc l'installe vite ; le m\xE9langer ensuite avec les autres oblige \xE0 le CHOISIR, comme dans un vrai calcul. C'est ce qui le rend durable : d'o\xF9 les s\xE9ances de consolidation apr\xE8s chaque le\xE7on."],["Et la t\xEAte dans tout \xE7a ?","\xC0 force de manipuler, l'image du soroban s'installe dans la t\xEAte : c'est l'anzan. Le calcul mental des bons joueurs n'est pas un don, c'est ce soroban imaginaire, construit geste apr\xE8s geste."]],demos:[]}]},{id:"p1",titre:"Gestes directs",sousPaliers:[{id:"p1-1",titre:"Ajouter 1 \xE0 4",cibles:be("+",[1,2,3,4],"direct"),chiffres:1,lignes:3,ops:["+"],repetitions:20,cumul:!0,pourquoi:"Ajouter, c'est faire monter des boules terrestres contre la barre, avec le POUCE, plac\xE9 sous les boules : un seul mouvement vers le haut. Condition : les boules n\xE9cessaires doivent \xEAtre libres (en bas).",demos:[{depart:0,op:"+",n:3},{depart:6,op:"+",n:3}]},{id:"p1-2",titre:"Retirer 1 \xE0 4",cibles:be("-",[1,2,3,4],"direct"),chiffres:1,lignes:4,repetitions:20,cumul:!0,pourquoi:"Retirer, c'est \xE9loigner des boules terrestres de la barre avec l'INDEX, qui les pousse vers le bas. Pouce pour monter, index pour descendre : les deux doigts ne se g\xEAnent jamais.",demos:[{depart:4,op:"-",n:3},{depart:8,op:"-",n:2}]},{id:"p1-3",titre:"Le 5 et la pinc\xE9e (6 \xE0 9)",cibles:[...be("+",[5,6,7,8,9],"direct"),...be("-",[5,6,7,8,9],"direct")],chiffres:1,lignes:4,repetitions:20,cumul:!0,pourquoi:"La boule c\xE9leste vaut 5 et c'est toujours l'INDEX qui la man\u0153uvre. Pour 6 \xE0 9 (5 + 1 \u2026 5 + 4), on fait UN seul geste : l'index abaisse la c\xE9leste pendant que le pouce monte les terrestres, comme une pince. Pour retirer 6 \xE0 9, c'est l'index seul, en UN SEUL mouvement : il rel\xE8ve la c\xE9leste et descend les terrestres dans la m\xEAme trajectoire, sans s'arr\xEAter entre les deux.",demos:[{depart:2,op:"+",n:5},{depart:0,op:"+",n:7},{depart:9,op:"-",n:6}]},{id:"p1-4",titre:"Gestes directs \xE0 2 et 3 chiffres",cibles:Pr,chiffres:2,lignes:4,repetitions:20,cumul:!0,pourquoi:"On calcule NOMBRE PAR NOMBRE et de GAUCHE \xC0 DROITE : pour 12 + 35, on pose 12, puis on ajoute 35 en entier, d'abord le 3 sur les dizaines, puis le 5 sur les unit\xE9s, dans l'ordre de lecture. Jamais colonne par colonne comme sur papier : le total courant est sur le soroban. Chaque tige se traite ind\xE9pendamment.",demos:[{depart:12,op:"+",n:35},{depart:87,op:"-",n:32}]}]},{id:"p2",titre:"Petits amis (compl\xE9ments \xE0 5)",sousPaliers:[{id:"p2-1",titre:"+4 et +3",cibles:be("+",[4,3],"petit"),chiffres:1,lignes:5,repetitions:50,pourquoi:"Sur 3, ajouter 4 : il ne reste qu'une terrestre libre. Astuce : 4 = 5 \u2212 1. L'index abaisse la c\xE9leste (+5), puis descend 1 terrestre (\u22121). 1 et 4 sont \xAB petits amis \xBB (leur somme fait 5), de m\xEAme 2 et 3.",demos:[{depart:3,op:"+",n:4},{depart:2,op:"+",n:3}]},{id:"p2-2",titre:"+2 et +1",cibles:be("+",[2,1],"petit"),chiffres:1,lignes:5,repetitions:50,pourquoi:"2 = 5 \u2212 3 et 1 = 5 \u2212 4. Sur 4, ajouter 1 : l'index abaisse la c\xE9leste et descend les 4 terrestres.",demos:[{depart:4,op:"+",n:1},{depart:3,op:"+",n:2}]},{id:"p2-3",titre:"Petits amis en addition, 2 et 3 chiffres",cibles:be("+",[1,2,3,4],"petit"),chiffres:2,lignes:5,repetitions:50,pourquoi:"Le petit ami peut tomber sur n'importe quelle tige. Toujours de gauche \xE0 droite : chaque tige choisit son geste, direct ou petit ami.",demos:[{depart:34,op:"+",n:43}]},{id:"p2-4",titre:"\u22124 et \u22123",cibles:be("-",[4,3],"petit"),chiffres:1,lignes:5,repetitions:50,pourquoi:"Sur 5, retirer 4 : aucune terrestre n'est contre la barre. \u22124 = +1 \u2212 5 : le pouce monte 1 terrestre, puis l'index rel\xE8ve la c\xE9leste. On ajoute d'abord le petit ami, puis on enl\xE8ve le 5.",demos:[{depart:5,op:"-",n:4},{depart:6,op:"-",n:3}]},{id:"p2-5",titre:"\u22122 et \u22121",cibles:be("-",[2,1],"petit"),chiffres:1,lignes:5,repetitions:50,pourquoi:"\u22122 = +3 \u2212 5 et \u22121 = +4 \u2212 5. Sur 5, retirer 1 : le pouce monte les 4 terrestres, l'index rel\xE8ve la c\xE9leste.",demos:[{depart:5,op:"-",n:1},{depart:6,op:"-",n:2}]},{id:"p2-6",titre:"Petits amis en soustraction, 2 et 3 chiffres",cibles:be("-",[1,2,3,4],"petit"),chiffres:2,lignes:5,repetitions:50,pourquoi:"M\xEAme geste sur chaque tige concern\xE9e, de gauche \xE0 droite.",demos:[{depart:65,op:"-",n:32}]},{id:"p2-7",titre:"Tous les petits amis, 3 chiffres",cibles:ti,chiffres:3,lignes:5,repetitions:50,pourquoi:"Additions et soustractions m\xE9lang\xE9es : si les boules manquent sur une tige, le petit ami s'impose. Avec la r\xE9p\xE9tition, le geste devient un r\xE9flexe associ\xE9 au chiffre.",demos:[{depart:342,op:"+",n:413}]}]},{id:"p3",titre:"Grands amis en addition (compl\xE9ments \xE0 10)",sousPaliers:[{id:"p3-1",titre:"+9 et +8",cibles:be("+",[9,8],"grand"),chiffres:1,lignes:5,repetitions:50,pourquoi:"Sur 3, ajouter 9 donnerait 12 : impossible sur une tige. 9 = 10 \u2212 1 : on retire 1 sur les unit\xE9s, puis on ajoute 1 sur les dizaines (la retenue). 9 et 1 sont \xAB grands amis \xBB (leur somme fait 10). Ordre standard : d'abord le compl\xE9ment, ensuite la retenue.",demos:[{depart:3,op:"+",n:9},{depart:4,op:"+",n:8}]},{id:"p3-2",titre:"+7 et +6",cibles:be("+",[7,6],"grand"),chiffres:1,lignes:5,repetitions:50,pourquoi:"7 = 10 \u2212 3 et 6 = 10 \u2212 4. Sur 8, ajouter 7 : l'index descend 3 terrestres, puis le pouce monte 1 terrestre sur les dizaines.",demos:[{depart:8,op:"+",n:7},{depart:4,op:"+",n:6}]},{id:"p3-3",titre:"+5 \xE0 +1",cibles:be("+",[5,4,3,2,1],"grand"),chiffres:1,lignes:5,repetitions:50,pourquoi:"5 = 10 \u2212 5, 4 = 10 \u2212 6 \u2026 1 = 10 \u2212 9. Le compl\xE9ment \xE0 retirer contient la c\xE9leste : l'index la rel\xE8ve (et descend les terrestres d'un m\xEAme geste), puis la retenue.",demos:[{depart:7,op:"+",n:5},{depart:8,op:"+",n:4},{depart:9,op:"+",n:1}]},{id:"p3-4",titre:"Grands amis en addition, 2 et 3 chiffres",cibles:Dr(hs),chiffres:2,lignes:5,repetitions:50,pourquoi:"La retenue tombe sur la tige de gauche, d\xE9j\xE0 calcul\xE9e : c'est pour cela qu'on travaille de gauche \xE0 droite, la retenue s'ajoute simplement.",demos:[{depart:39,op:"+",n:85}]}]},{id:"p4",titre:"Grands amis en soustraction",sousPaliers:[{id:"p4-1",titre:"\u22129 et \u22128",cibles:be("-",[9,8],"grand"),chiffres:1,lignes:5,repetitions:50,pourquoi:"Sur 12, retirer 9 : les unit\xE9s ne valent que 2. \u22129 = \u221210 + 1 : on retire d'abord 1 sur les dizaines (l'emprunt), puis on ajoute 1 sur les unit\xE9s. En soustraction, l'ordre s'inverse : l'emprunt d'abord, le compl\xE9ment ensuite.",demos:[{depart:12,op:"-",n:9},{depart:11,op:"-",n:8}]},{id:"p4-2",titre:"\u22127 et \u22126",cibles:be("-",[7,6],"grand"),chiffres:1,lignes:5,repetitions:50,pourquoi:"\u22127 = \u221210 + 3 et \u22126 = \u221210 + 4. Sur 15, retirer 7 : l'index retire 1 dizaine, puis le pouce monte 3 terrestres sur les unit\xE9s.",demos:[{depart:15,op:"-",n:7},{depart:10,op:"-",n:6}]},{id:"p4-3",titre:"\u22125 \xE0 \u22121",cibles:be("-",[5,4,3,2,1],"grand"),chiffres:1,lignes:5,repetitions:50,pourquoi:"\u22125 = \u221210 + 5 \u2026 \u22121 = \u221210 + 9. On emprunte 1 dizaine, puis on ajoute le grand compl\xE9ment (c\xE9leste, ou pinc\xE9e c\xE9leste + terrestres).",demos:[{depart:13,op:"-",n:5},{depart:10,op:"-",n:1}]},{id:"p4-4",titre:"Grands amis en soustraction, 2 et 3 chiffres",cibles:Rr(hs),chiffres:2,lignes:5,repetitions:50,pourquoi:"L'emprunt se prend sur la tige de gauche, d\xE9j\xE0 calcul\xE9e. Toujours de gauche \xE0 droite.",demos:[{depart:95,op:"-",n:17}]},{id:"p4-5",titre:"Tous les grands amis, 3 chiffres",cibles:hs,chiffres:3,lignes:5,repetitions:50,pourquoi:"Rep\xE9rez le passage de la dizaine avant de bouger : si la tige ne peut pas absorber le chiffre, c'est le grand ami. Compl\xE9ment d'abord en addition, emprunt d'abord en soustraction.",demos:[{depart:876,op:"+",n:285},{depart:952,op:"-",n:663}]}]},{id:"p5",titre:"Combinaisons et r\xE9vision g\xE9n\xE9rale",sousPaliers:[{id:"p5-1",titre:"+6 \xE0 +9 combin\xE9s (grand ami + petit ami)",cibles:Dr(kr),chiffres:1,lignes:5,repetitions:50,pourquoi:"Sur 5, ajouter 6 : grand ami, il faut retirer 4\u2026 mais aucune terrestre n'est pos\xE9e. Le \u22124 se fait par le petit ami (+1 \u22125). Geste complet : pouce +1, index rel\xE8ve la c\xE9leste, puis pouce +1 sur les dizaines.",demos:[{depart:5,op:"+",n:6},{depart:6,op:"+",n:8}]},{id:"p5-2",titre:"\u22126 \xE0 \u22129 combin\xE9s",cibles:Rr(kr),chiffres:1,lignes:5,repetitions:50,pourquoi:"Sur 13, retirer 8 : on emprunte 1 dizaine, puis il faut ajouter 2 sur un 3 : pas assez de terrestres, petit ami +5 \u22123. Geste : index \u22121 sur les dizaines, index abaisse la c\xE9leste, index descend 3 terrestres.",demos:[{depart:13,op:"-",n:8},{depart:12,op:"-",n:6}]},{id:"p5-3",titre:"Combinaisons, 2 et 3 chiffres",cibles:kr,chiffres:2,lignes:5,repetitions:50,pourquoi:"Les combinaisons arrivent sur n'importe quelle tige. D\xE9composez calmement : grand ami d'abord, et son compl\xE9ment par le petit ami.",demos:[{depart:56,op:"+",n:67}]},{id:"p5-4",titre:"Retenues et emprunts en cascade",cibles:["cascade+","cascade-"],chiffres:2,lignes:4,repetitions:30,cumul:!0,pourquoi:"Une retenue qui tombe sur un 9 : ce 9 devient 0 (grand ami, \u22129) et la retenue continue plus \xE0 gauche. Un emprunt sur un 0 le transforme en 9 et continue. C'est la m\xEAme r\xE8gle, r\xE9p\xE9t\xE9e.",demos:[{depart:99,op:"+",n:1},{depart:100,op:"-",n:1},{depart:95,op:"+",n:17}]},{id:"p5-5",titre:"R\xE9vision g\xE9n\xE9rale, 3 chiffres",cibles:de,chiffres:3,lignes:5,repetitions:50,cumul:!0,pourquoi:"Tous les gestes sont permis : chaque tige choisit le sien. C'est le calcul courant.",demos:[{depart:478,op:"+",n:685}]}]},{id:"p6",titre:"Multiplication (\u4E21\u843D\u3068\u3057)",sousPaliers:[{id:"p6-a",titre:"1 \xD7 1 : un produit, deux tiges (\xAB 06 \xBB)",type:"table",repetitions:40,pourquoi:"En multiplication japonaise, chaque produit de la table occupe TOUJOURS deux tiges : la dizaine et l'unit\xE9. 7 \xD7 8 = \xAB 56 \xBB, mais 2 \xD7 3 = \xAB 06 \xBB : la tige des dizaines reste vide, et c'est elle qui garde le d\xE9calage juste pour la suite. Ici, tapez chaque produit sur deux chiffres (06, 00, 56) : c'est la convention \xE0 ancrer, et en m\xEAme temps un entra\xEEnement de vitesse sur la table.",demos:[{a:2,b:3},{a:7,b:8}]},{id:"p6-0",titre:"O\xF9 poser le premier produit ?",type:"placement",op:"mul",repetitions:40,pourquoi:"Avant de multiplier, il faut savoir O\xD9 commencer, sans r\xE9fl\xE9chir. R\xE8gle : comptez les chiffres des deux nombres (37 \xD7 85 : 2 + 2 = 4). La dizaine du premier produit se pose sur la 4e tige en comptant la tige des unit\xE9s comme la 1re. Cliquez la bonne tige le plus vite possible : ce r\xE9flexe doit devenir automatique, c'est lui qui \xE9vite les r\xE9sultats d\xE9cal\xE9s. L'index gauche se pose ensuite sur cette tige et la marque pendant tout le calcul.",demos:[]},{id:"p6-1",titre:"2 chiffres \xD7 1 chiffre",type:"mul",m:2,n:1,repetitions:30,pourquoi:"M\xE9thode japonaise actuelle, \u4E21\u843D\u3068\u3057 (\xAB les deux tombent \xBB) : on ne pose ni le multiplicande ni le multiplicateur, on les lit sur la feuille. On ne pose que les produits de la table, chacun sur DEUX tiges (dizaine, unit\xE9 ; 2 \xD7 3 s'\xE9crit \xAB 06 \xBB). On commence \xE0 gauche. Position du premier produit : 2 + 1 = 3 chiffres au total, donc sa dizaine va sur la 3e tige en partant des unit\xE9s. Chaque produit suivant se d\xE9cale d'une tige vers la droite.",demos:[{a:37,b:8},{a:23,b:3}]},{id:"p6-2",titre:"3 et 4 chiffres \xD7 1 chiffre",type:"mul",m:3,n:1,repetitions:30,pourquoi:"M\xEAme principe : 3 + 1 = 4 chiffres, donc premier produit sur la 4e tige (sa dizaine). Exemple 372 \xD7 8 : 24, puis 56 une tige plus \xE0 droite, puis 16.",demos:[{a:372,b:8}]},{id:"p6-3",titre:"2 chiffres \xD7 2 chiffres",type:"mul",m:2,n:2,repetitions:30,pourquoi:"Pour 37 \xD7 85 : 4 chiffres au total. On prend le 3 et on le multiplie par 8 puis par 5 (24, puis 15 une tige \xE0 droite) ; on passe au 7 : 7 \xD7 8 = 56 se pose l\xE0 o\xF9 commen\xE7ait le 15 (une tige \xE0 droite du 24), puis 7 \xD7 5 = 35.",demos:[{a:37,b:85}]},{id:"p6-4",titre:"3 chiffres \xD7 2 chiffres",type:"mul",m:3,n:2,repetitions:30,pourquoi:"5 chiffres au total : premier produit sur la 5e tige. Chaque chiffre du multiplicande commence une tige plus \xE0 droite que le pr\xE9c\xE9dent.",demos:[{a:246,b:37}]}]},{id:"p7",titre:"Division (\u7247\u843D\u3068\u3057)",sousPaliers:[{id:"p7-0",titre:"O\xF9 poser le premier chiffre du quotient ?",type:"placement",op:"div",repetitions:40,pourquoi:"Le dividende est pos\xE9 \xE0 droite. On compare son d\xE9but au diviseur : s'il est plus grand ou \xE9gal (156 \xF7 12 : 15 \u2265 12), le premier chiffre du quotient se pose DEUX tiges \xE0 gauche du premier chiffre du dividende ; s'il est plus petit (108 \xF7 12 : 10 < 12), JUSTE \xE0 gauche. Cliquez la bonne tige : ce r\xE9flexe doit \xEAtre imm\xE9diat. L'index gauche se pose ensuite sur cette tige.",demos:[]},{id:"p7-1",titre:"\xF7 1 chiffre, quotient 1 chiffre",type:"div",nd:1,nq:1,repetitions:30,pourquoi:"M\xE9thode \u7247\u843D\u3068\u3057 : on pose seulement le dividende ; le diviseur se lit sur la feuille. On compare le d\xE9but du dividende au diviseur : plus grand ou \xE9gal \u2192 le chiffre du quotient se pose DEUX tiges \xE0 gauche (une tige libre) ; plus petit \u2192 JUSTE \xE0 gauche. Puis on retire le produit (quotient \xD7 diviseur, sur deux tiges) juste \xE0 droite du quotient.",demos:[{a:14,b:2},{a:72,b:8}]},{id:"p7-2",titre:"\xF7 1 chiffre, quotient 2 et 3 chiffres",type:"div",nd:1,nq:2,repetitions:30,pourquoi:"On r\xE9p\xE8te pour chaque chiffre du quotient, avec le reste. L'unit\xE9 du quotient se trouve 2 tiges \xE0 gauche de l'unit\xE9 du dividende (1 chiffre au diviseur + 1).",demos:[{a:156,b:4}]},{id:"p7-e",titre:"Diviser par 2 chiffres : estimer et corriger",type:"div",nd:2,nq:1,repetitions:30,corrections:!0,pourquoi:"Personne ne conna\xEEt la table de 18 : on ESTIME. On arrondit le diviseur \xE0 sa dizaine (18 \u2192 20, 43 \u2192 40 ; on arrondit au-dessus d\xE8s que le 2e chiffre vaut 5 ou plus) et on divise le d\xE9but du dividende par ce nombre rond : 144 \xF7 20 \u2248 7. Puis on v\xE9rifie avec les vrais produits : 7 \xD7 1 = 7 et 7 \xD7 8 = 56, donc 7 \xD7 18 = 126, qui tient dans 144. On retire 126 : il reste 18, qui n'est pas plus petit que 18 \u2192 l'estimation \xE9tait trop petite : on ajoute 1 au quotient (8) et on retire encore 18. Si au contraire le produit ne tient pas (arrondi au-dessous : 112 \xF7 14, 14 \u2248 10 donne 11, on plafonne \xE0 9 ; 9 \xD7 14 = 126 > 112), on diminue de 1 de t\xEAte AVANT de poser. En cas de blocage pendant un exercice, le bouton \xAB Je suis bloqu\xE9 \xBB d\xE9roule ce raisonnement et affiche la table du diviseur.",demos:[{a:144,b:18},{a:112,b:14},{a:156,b:12}]},{id:"p7-3",titre:"\xF7 2 chiffres, quotient 1 chiffre",type:"div",nd:2,nq:1,repetitions:30,pourquoi:"On compare les deux premiers chiffres du dividende au diviseur entier. Le chiffre du quotient s'estime avec le premier chiffre du diviseur ; puis on retire quotient \xD7 chaque chiffre du diviseur, en d\xE9calant d'une tige. Si le produit ne peut pas \xEAtre retir\xE9, le chiffre \xE9tait trop grand : on le diminue de 1.",demos:[{a:108,b:12}]},{id:"p7-4",titre:"\xF7 2 chiffres, quotient 2 chiffres",type:"div",nd:2,nq:2,repetitions:30,pourquoi:"L'unit\xE9 du quotient est 3 tiges \xE0 gauche de l'unit\xE9 du dividende (2 chiffres au diviseur + 1).",demos:[{a:156,b:12}]}]},{id:"pd",titre:"D\xE9cimaux et arrondis",sousPaliers:[{id:"pd-1",titre:"Le point des unit\xE9s : additions et soustractions de d\xE9cimaux",type:"addsubdec",repetitions:30,pourquoi:"Les points de la barre servent de rep\xE8re : on choisit l'un d'eux comme tige des unit\xE9s, et TOUTES les virgules s'alignent dessus. Les d\xE9cimales se posent sur les tiges \xE0 sa droite (dixi\xE8mes, centi\xE8mes\u2026). Pour 12,5 + 3,075 : 12 avant le point, 5 sur la 1re tige apr\xE8s ; puis 3 sur les unit\xE9s, 0, 7, 5 sur les trois tiges suivantes. Rien d'autre ne change : m\xEAmes gestes, m\xEAmes amis.",demos:[]},{id:"pd-2",titre:"Placer un produit d\xE9cimal (compte des chiffres)",type:"placement",op:"muldec",repetitions:30,pourquoi:"La m\xE9thode la plus rapide ne place pas la virgule \xE0 la fin : elle pose le premier produit directement au bon endroit. On compte les chiffres de chaque facteur AVEC SIGNE : 37,2 compte 2 (chiffres avant la virgule), 0,85 compte 0, 0,04 compte \u22121 (un z\xE9ro juste apr\xE8s la virgule). On additionne : la dizaine du premier produit va sur la tige de ce rang (2 \u2192 2e tige avant la virgule ; 0 \u2192 1re tige apr\xE8s la virgule ; \u22121 \u2192 2e tige apr\xE8s). C'est la r\xE8gle \xAB m + n \xBB des entiers, prolong\xE9e.",demos:[]},{id:"pd-3",titre:"Multiplier des d\xE9cimaux",type:"muldec",repetitions:30,pourquoi:"Compte des chiffres, puis \u4E21\u843D\u3068\u3057 exactement comme avec des entiers. Le r\xE9sultat se lit directement par rapport au point des unit\xE9s. V\xE9rification rapide : le nombre de d\xE9cimales du r\xE9sultat est la somme de celles des facteurs.",demos:[]},{id:"pd-4",titre:"Diviser des d\xE9cimaux",type:"divdec",repetitions:30,pourquoi:"Le quotient a q chiffres avant la virgule, avec q = compte(dividende) \u2212 compte(diviseur), plus 1 si le d\xE9but du dividende est plus grand ou \xE9gal au diviseur (le m\xEAme test que pour poser le premier chiffre). Exemple : 1,56 \xF7 0,12 : 1 \u2212 0 + 1 = 2 chiffres \u2192 13. On divise comme d'habitude, et on lit le quotient avec ce compte.",demos:[]},{id:"pd-5",titre:"Arrondir au milli\xE8me",type:"divarrondi",repetitions:30,pourquoi:"Pour arrondir au milli\xE8me, on calcule UNE d\xE9cimale de plus (la 4e), puis on arrondit. Astuce rapide au soroban : on ajoute 5 sur la tige de cette 4e d\xE9cimale ; si elle valait 5 ou plus, la retenue monte toute seule sur le milli\xE8me. On lit ensuite jusqu'au milli\xE8me, sans rien effacer.",demos:[]}]},{id:"p8",titre:"Vers le 5e et le 4e ky\u016B",sousPaliers:[{id:"p8-t1",titre:"Transition : 3 chiffres, 6 \xE0 7 lignes",cibles:de,chiffres:3,lignes:6,lignesMax:7,repetitions:30,cumul:!0,pourquoi:"Avant les 10 lignes : des colonnes un peu plus longues, avec des nombres que vous connaissez d\xE9j\xE0. Gardez le m\xEAme rythme d'un bout \xE0 l'autre de la colonne.",demos:[{depart:472,op:"+",n:358}]},{id:"p8-t2",titre:"Transition : 4 chiffres, 6 \xE0 7 lignes",cibles:de,chiffres:4,lignes:6,lignesMax:7,repetitions:30,cumul:!0,pourquoi:"Le 4e chiffre ajoute une tranche : rep\xE9rez les milliers avec le point de la barre, lisez le nombre d'un bloc, posez-le de gauche \xE0 droite.",demos:[{depart:4721,op:"+",n:3586}]},{id:"p8-1",titre:"Additions et soustractions \xE0 4 chiffres, 10 lignes",cibles:de,chiffres:4,lignes:10,repetitions:30,cumul:!0,pourquoi:"Le format des examens : 10 lignes, 4 chiffres. La difficult\xE9 n'est plus le geste mais la lecture et le rythme : lisez chaque nombre d'un bloc, posez-le de gauche \xE0 droite, et lisez d\xE9j\xE0 le suivant.",demos:[{depart:4721,op:"+",n:3586}]},{id:"p8-2",titre:"Z\xE9ros internes",cibles:de,chiffres:4,lignes:8,repetitions:30,cumul:!0,zeros:!0,pourquoi:"Un z\xE9ro au milieu d'un nombre (3 058, 7 040) est le pi\xE8ge n\xB0 1 : on saute une tige de trop ou de moins, et tout le reste est d\xE9cal\xE9. Le z\xE9ro ne se pose pas, mais il se COMPTE : dites-le int\xE9rieurement (\xAB trois, z\xE9ro, cinq, huit \xBB) et faites avancer le doigt d'une tige.",demos:[{depart:3058,op:"+",n:4070}]},{id:"p8-3",titre:"5 et 6 chiffres, 10 lignes (endurance)",cibles:de,chiffres:5,chiffresMax:6,lignes:10,repetitions:20,cumul:!0,pourquoi:"Endurance : 10 lignes de 5 ou 6 chiffres sans perdre le rythme. Rep\xE9rez les tranches de 3 chiffres avec les points de la barre.",demos:[{depart:52708,op:"+",n:39415}]},{id:"p8-4",titre:"Multiplication avec des z\xE9ros (406 \xD7 7)",type:"mul",m:3,n:1,mMax:4,zeros:!0,repetitions:30,pourquoi:"Avec \u4E21\u843D\u3068\u3057, un z\xE9ro dans un facteur donne un produit \xAB 00 \xBB : on ne pose rien, MAIS on avance d'une tige. Pour 406 \xD7 7 : 4 \xD7 7 = 28, puis 0 \xD7 7 = 00 (rien, on avance), puis 6 \xD7 7 = 42.",demos:[{a:406,b:7},{a:37,b:208}]},{id:"p8-5",titre:"Multiplication 3 \xD7 3 et 4 \xD7 3 chiffres",type:"mul",m:3,n:3,mMax:4,repetitions:30,pourquoi:"M\xEAme m\xE9thode, plus de produits : 6 chiffres au total pour 3 \xD7 3, donc premier produit sur la 6e tige. L'index gauche avance d'une tige \xE0 chaque chiffre du multiplicande ; les produits du m\xEAme chiffre glissent d'une tige chacun.",demos:[{a:246,b:375}]},{id:"p8-6",titre:"Division : quotient avec un z\xE9ro (304)",type:"div",nd:1,nq:3,ndMax:2,zeros:!0,repetitions:30,pourquoi:"Quand le reste est plus petit que le diviseur, le chiffre du quotient est 0 : la tige reste vide MAIS elle compte, le chiffre suivant se pose une tige plus \xE0 droite. Ne \xAB tassez \xBB jamais le quotient.",demos:[{a:2128,b:7},{a:3672,b:12}]},{id:"p8-7",titre:"Division par 3 chiffres",type:"div",nd:3,nq:2,repetitions:30,corrections:!0,pourquoi:"M\xEAme estimation qu'avec 2 chiffres : on arrondit le diviseur sur son premier chiffre (243 \u2192 200, 268 \u2192 300), on estime, puis on corrige de \xB11 si besoin. On compare les 3 premiers chiffres du dividende au diviseur pour savoir o\xF9 poser le quotient.",demos:[{a:5832,b:243}]},{id:"p8-n",titre:"R\xE9sultats n\xE9gatifs : le compl\xE9ment (facultatif)",type:"negatif",chiffres:2,lignes:4,repetitions:20,optionnel:!0,pourquoi:"Quand une soustraction \xAB d\xE9passe \xBB (il faut retirer plus que ce qui est pos\xE9), on emprunte un 1 IMAGINAIRE sur la tige \xE0 gauche de la colonne (100 pour une colonne \xE0 2 chiffres) et on continue normalement. \xC0 la fin, le soroban affiche le COMPL\xC9MENT du r\xE9sultat : s'il affiche 63 apr\xE8s un emprunt de 100, le r\xE9sultat est \u2212(100 \u2212 63) = \u221237. Lecture rapide : compl\xE9ment \xE0 9 de chaque chiffre, \xE0 10 pour le dernier (63 \u2192 3 et 7 \u2192 \u221237). Si le calcul repasse au-dessus de z\xE9ro, la retenue rend le 1 emprunt\xE9. Tapez le r\xE9sultat avec le signe moins.",demos:[]}]},{id:"pa",titre:"Anzan et visualisation (piste parall\xE8le)",mental:!0,sousPaliers:[{id:"pa-0",titre:"Le cours : voir le soroban dans sa t\xEAte",type:"theorie",apres:"p1-4",repetitions:0,pourquoi:"L'anzan, c'est calculer avec un soroban imaginaire. Ce n'est pas du calcul mental \xAB avec des mots \xBB : on VOIT les boules bouger. Cette piste avance \xE0 son rythme, en parall\xE8le des le\xE7ons sur le vrai soroban, et toujours un peu en retard sur elles : on n'imagine bien que des gestes d\xE9j\xE0 automatiques.",sections:[["Les \xE9tapes","1. Prendre la \xAB photo \xBB d'un soroban : le voir une seconde et lire le nombre. 2. Tenir une image : poser un nombre sur le soroban imaginaire et le garder net. 3. Calculer avec une image d'aide qui s'estompe peu \xE0 peu. 4. Calculer de t\xEAte, en allongeant la cha\xEEne de nombres, puis en acc\xE9l\xE9rant."],["Toujours le m\xEAme soroban","Imaginez VOTRE soroban, avec sa couleur, la taille de ses boules et sa barre. Toujours le m\xEAme : l'image se renforce \xE0 chaque s\xE9ance. Ne visualisez que les tiges utiles (une ou deux au d\xE9but), pas tout le cadre."],["Garder l'image du TOTAL","Le nombre lu ne sert qu'\xE0 d\xE9clencher un geste, puis on l'oublie. Ce qu'on garde en t\xEAte, c'est l'\xE9tat du soroban : le total. \xC0 la fin, on ne calcule rien, on LIT le soroban imaginaire."],["Les doigts dans l'air","\xC0 chaque nombre, faites le geste avec le pouce et l'index, comme sur le vrai soroban. Au d\xE9but, c'est le mouvement des doigts qui \xAB porte \xBB l'image. Les doigts s'effacent d'eux-m\xEAmes beaucoup plus tard."],["Pas de phrase int\xE9rieure","Ne vous dites pas \xAB 4 plus 3 \xE9gale 7 \xBB : on voit la c\xE9leste descendre et deux terrestres s'en aller. Si une voix int\xE9rieure compte, ralentissez jusqu'\xE0 voir les boules."],["Les yeux","En mitori-anzan (colonne affich\xE9e), fermer les yeux un instant entre deux nombres aide au d\xE9but. En flash, regardez le nombre, puis l'image int\xE9rieure."],["Quand l'image se brouille","On r\xE9duit le NOMBRE de nombres, pas la vitesse : mieux vaut 3 nombres nets que 5 flous. Quand on est perdu, on ne devine pas : on le note faux et on recommence. L'application allonge la cha\xEEne quand vous r\xE9ussissez, et la raccourcit apr\xE8s une erreur."],["Peu, mais tous les jours","5 minutes d'anzan chaque jour valent mieux que 20 minutes une fois par semaine. L'image se construit par la r\xE9p\xE9tition, entre les s\xE9ances."]],pourquoiCaMarche:[["Une image plut\xF4t que des mots","Garder \xAB 47 \xBB en mots occupe la m\xE9moire de travail, d\xE9j\xE0 petite. Une image de soroban se garde mieux : c'est une forme, pas une suite de sons. C'est pourquoi on \xE9vite la voix int\xE9rieure."],["Les doigts aident la t\xEAte","Les zones du cerveau qui commandent un geste s'activent aussi
